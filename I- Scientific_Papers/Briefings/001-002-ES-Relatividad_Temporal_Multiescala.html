document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

: 'VT323';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"383747f8-f0ef-42a2-ac37-fdfb0558ee62\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   RTM // Relatividad Temporal Multiescala\n   Retro CRT / 80s sci-fi terminal — visual system\n   ============================================================ */\n\n:root {\n  --bg: #000000;\n  --paper: #07060f;\n  --ink: #b9a9ff;        /* primary electric lilac */\n  --ink-dim: #6a5fb5;\n  --ink-bright: #e6dfff;\n  --grid: rgba(185, 169, 255, 0.18);\n  --frame: rgba(185, 169, 255, 0.65);\n  --glow: rgba(185, 169, 255, 0.55);\n  --hot: #ff3df0;        /* magenta glitch */\n  --cool: #5cf0ff;       /* cyan glitch */\n  --warn: #ffd23d;\n  --good: #6dff9b;\n  --pixel: 'Press Start 2P', monospace;\n  --term:  'VT323', 'IBM Plex Mono', monospace;\n  --mono:  'IBM Plex Mono', 'Space Mono', monospace;\n}\n\n* { box-sizing: border-box; }\n\nhtml, body {\n  margin: 0;\n  padding: 0;\n  background: var(--bg);\n  color: var(--ink);\n  font-family: var(--term);\n  overflow: hidden;\n}\n\ndeck-stage {\n  --slide-bg: var(--bg);\n  background: var(--bg);\n}\n\n/* ---------- SLIDE BASE ---------- */\nsection.slide {\n  position: relative;\n  width: 1920px;\n  height: 1080px;\n  background: var(--bg);\n  color: var(--ink);\n  overflow: hidden;\n  font-family: var(--term);\n}\n\n/* CRT scanlines on every slide */\nsection.slide::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background:\n    repeating-linear-gradient(\n      to bottom,\n      rgba(0,0,0,0) 0px,\n      rgba(0,0,0,0) 2px,\n      rgba(0,0,0,0.35) 3px,\n      rgba(0,0,0,0) 4px\n    );\n  pointer-events: none;\n  z-index: 90;\n  mix-blend-mode: multiply;\n}\n\n/* CRT vignette + faint horizontal sweep */\nsection.slide::after {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background:\n    radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.85) 100%),\n    linear-gradient(180deg, rgba(185,169,255,0.04), transparent 30%);\n  pointer-events: none;\n  z-index: 91;\n}\n\n/* ---------- TYPOGRAPHY ---------- */\n.pix { font-family: var(--pixel); letter-spacing: 0.04em; }\n.term { font-family: var(--term); }\n.mono { font-family: var(--mono); }\n\nh1, h2, h3 { margin: 0; font-weight: normal; }\n\n.glow { text-shadow:\n  0 0 4px var(--glow),\n  0 0 12px rgba(185,169,255,0.4),\n  0 0 28px rgba(126,109,255,0.3);\n}\n\n/* ---------- CHROME: corner brackets, frames, headers ---------- */\n.chrome-frame {\n  position: absolute;\n  border: 1px solid var(--frame);\n  pointer-events: none;\n}\n\n/* outer slide frame */\n.slide-frame {\n  position: absolute;\n  inset: 56px 80px;\n  border: 1px solid var(--frame);\n  pointer-events: none;\n  z-index: 5;\n}\n.slide-frame::before,\n.slide-frame::after,\n.slide-frame > .br,\n.slide-frame > .bl {\n  content: \"\";\n  position: absolute;\n  width: 28px;\n  height: 28px;\n  border: 2px solid var(--ink);\n  background: var(--bg);\n}\n.slide-frame::before { top: -14px; left: -14px; border-right: none; border-bottom: none; }\n.slide-frame::after  { top: -14px; right: -14px; border-left: none; border-bottom: none; }\n.slide-frame > .br   { bottom: -14px; right: -14px; border-left: none; border-top: none; }\n.slide-frame > .bl   { bottom: -14px; left: -14px; border-right: none; border-top: none; }\n\n/* top status bar */\n.status-bar {\n  position: absolute;\n  top: 24px;\n  left: 80px;\n  right: 80px;\n  height: 22px;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  font-family: var(--pixel);\n  font-size: 11px;\n  color: var(--ink);\n  letter-spacing: 0.12em;\n  z-index: 10;\n}\n.status-bar .dots {\n  display: inline-flex;\n  gap: 6px;\n}\n.status-bar .dot {\n  width: 8px; height: 8px;\n  border: 1.5px solid var(--ink);\n  background: transparent;\n}\n.status-bar .dot.on { background: var(--ink); box-shadow: 0 0 8px var(--glow); }\n\n/* bottom status bar */\n.bottom-bar {\n  position: absolute;\n  bottom: 22px;\n  left: 80px;\n  right: 80px;\n  height: 22px;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  font-family: var(--pixel);\n  font-size: 10px;\n  color: var(--ink);\n  letter-spacing: 0.14em;\n  z-index: 10;\n}\n\n/* a \"panel\" — boxed sub-region with corner ticks */\n.panel {\n  position: relative;\n  border: 1px solid var(--frame);\n  background:\n    linear-gradient(rgba(185,169,255,0.025), rgba(185,169,255,0.025));\n}\n.panel > .tick {\n  position: absolute;\n  width: 14px; height: 14px;\n  border: 1.5px solid var(--ink);\n  background: var(--bg);\n}\n.panel > .tick.tl { top: -7px; left: -7px; border-right: none; border-bottom: none; }\n.panel > .tick.tr { top: -7px; right: -7px; border-left: none; border-bottom: none; }\n.panel > .tick.bl { bottom: -7px; left: -7px; border-right: none; border-top: none; }\n.panel > .tick.br { bottom: -7px; right: -7px; border-left: none; border-top: none; }\n\n.panel-label {\n  position: absolute;\n  top: -12px;\n  left: 18px;\n  background: var(--bg);\n  padding: 0 10px;\n  font-family: var(--pixel);\n  font-size: 11px;\n  color: var(--ink);\n  letter-spacing: 0.16em;\n  z-index: 2;\n}\n\n/* ---------- HALFTONE / DITHER BACKGROUND ---------- */\n.dither {\n  background-image:\n    radial-gradient(circle at 1px 1px, var(--ink) 1px, transparent 1.4px);\n  background-size: 6px 6px;\n  opacity: 0.35;\n}\n.dither-fade {\n  -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);\n          mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);\n}\n\n/* ---------- GRID BACKGROUND ---------- */\n.gridbg {\n  background-image:\n    linear-gradient(var(--grid) 1px, transparent 1px),\n    linear-gradient(90deg, var(--grid) 1px, transparent 1px);\n  background-size: 40px 40px;\n}\n.gridbg-fine {\n  background-image:\n    linear-gradient(rgba(185,169,255,0.10) 1px, transparent 1px),\n    linear-gradient(90deg, rgba(185,169,255,0.10) 1px, transparent 1px);\n  background-size: 16px 16px;\n}\n\n/* ---------- GLITCH TEXT ---------- */\n.glitch {\n  position: relative;\n  display: inline-block;\n  color: var(--ink-bright);\n}\n.glitch::before,\n.glitch::after {\n  content: attr(data-text);\n  position: absolute;\n  left: 0; top: 0;\n  width: 100%; height: 100%;\n  overflow: hidden;\n  pointer-events: none;\n}\n.glitch::before {\n  color: var(--hot);\n  transform: translate(-2px, 0);\n  clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);\n  animation: glitch-a 2.6s infinite steps(2);\n  mix-blend-mode: screen;\n}\n.glitch::after {\n  color: var(--cool);\n  transform: translate(2px, 0);\n  clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);\n  animation: glitch-b 2.2s infinite steps(2);\n  mix-blend-mode: screen;\n}\n@keyframes glitch-a {\n  0%, 92%, 100% { transform: translate(-2px, 0); }\n  93% { transform: translate(-6px, 1px); }\n  95% { transform: translate(3px, -2px); }\n  97% { transform: translate(-5px, 2px); }\n}\n@keyframes glitch-b {\n  0%, 90%, 100% { transform: translate(2px, 0); }\n  91% { transform: translate(6px, -1px); }\n  94% { transform: translate(-3px, 2px); }\n  96% { transform: translate(4px, -2px); }\n}\n\n/* ---------- FLICKER / TICK ---------- */\n.flicker { animation: flicker 4s infinite; }\n@keyframes flicker {\n  0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }\n  20%, 24%, 55% { opacity: 0.7; }\n}\n.blink { animation: blink 1s steps(2) infinite; }\n@keyframes blink {\n  50% { opacity: 0; }\n}\n.sweep::after {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background: linear-gradient(180deg, transparent, rgba(185,169,255,0.07), transparent);\n  height: 8px;\n  animation: sweep 6s linear infinite;\n  pointer-events: none;\n}\n@keyframes sweep {\n  0% { transform: translateY(-20px); }\n  100% { transform: translateY(1100px); }\n}\n\n/* ---------- ASCII / PIXEL ART ---------- */\npre.ascii {\n  font-family: var(--mono);\n  font-size: 14px;\n  line-height: 1.15;\n  color: var(--ink);\n  white-space: pre;\n  margin: 0;\n  letter-spacing: 0;\n  text-shadow: 0 0 6px var(--glow);\n}\n\n/* ---------- COMMON LABEL ROW (DOSSIER FIELD) ---------- */\n.field {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  font-family: var(--pixel);\n  font-size: 14px;\n  letter-spacing: 0.14em;\n  padding: 16px 24px;\n  border-bottom: 1px solid rgba(185,169,255,0.25);\n}\n.field:last-child { border-bottom: none; }\n.field .k { color: var(--ink-dim); }\n.field .v { color: var(--ink-bright); }\n\n/* ---------- BUTTONS / KEYS ---------- */\n.key {\n  display: inline-block;\n  padding: 6px 14px;\n  border: 1.5px solid var(--ink);\n  font-family: var(--pixel);\n  font-size: 11px;\n  letter-spacing: 0.14em;\n  color: var(--ink);\n  background: var(--bg);\n  text-shadow: 0 0 6px var(--glow);\n}\n\n/* ---------- ALPHA BAR ---------- */\n.alpha-bar {\n  position: relative;\n  height: 18px;\n  border: 1px solid var(--frame);\n  background: linear-gradient(90deg,\n    rgba(185,169,255,0.05),\n    rgba(185,169,255,0.18));\n  overflow: hidden;\n}\n.alpha-bar > span {\n  position: absolute;\n  top: 0; left: 0;\n  height: 100%;\n  background: var(--ink);\n  box-shadow: 0 0 12px var(--glow);\n}\n\n/* ---------- BAND CARD ---------- */\n.band {\n  position: relative;\n  padding: 22px 26px;\n  border: 1px solid var(--frame);\n  background: rgba(185,169,255,0.03);\n  display: grid;\n  gap: 14px;\n}\n.band .badge {\n  font-family: var(--pixel);\n  font-size: 10px;\n  letter-spacing: 0.18em;\n  color: var(--ink-dim);\n}\n.band .alpha-num {\n  font-family: var(--pixel);\n  font-size: 38px;\n  color: var(--ink-bright);\n  text-shadow: 0 0 12px var(--glow);\n}\n.band .name {\n  font-family: var(--pixel);\n  font-size: 14px;\n  letter-spacing: 0.14em;\n  color: var(--ink);\n}\n.band .desc {\n  font-family: var(--term);\n  font-size: 22px;\n  line-height: 1.25;\n  color: var(--ink-bright);\n  opacity: 0.85;\n}\n\n/* ---------- HEADINGS ---------- */\n.eyebrow {\n  font-family: var(--pixel);\n  font-size: 12px;\n  letter-spacing: 0.22em;\n  color: var(--ink-dim);\n}\n.title-xl {\n  font-family: var(--pixel);\n  font-size: 78px;\n  line-height: 1;\n  color: var(--ink-bright);\n  letter-spacing: 0.02em;\n  text-shadow: 0 0 8px var(--glow), 0 0 24px rgba(185,169,255,0.45);\n}\n.title-l {\n  font-family: var(--pixel);\n  font-size: 48px;\n  line-height: 1.05;\n  color: var(--ink-bright);\n  text-shadow: 0 0 8px var(--glow);\n}\n.title-m {\n  font-family: var(--pixel);\n  font-size: 26px;\n  letter-spacing: 0.1em;\n  color: var(--ink);\n}\n.body {\n  font-family: var(--term);\n  font-size: 30px;\n  line-height: 1.35;\n  color: var(--ink-bright);\n}\n.caption {\n  font-family: var(--mono);\n  font-size: 16px;\n  color: var(--ink-dim);\n  letter-spacing: 0.06em;\n}\n\n/* ---------- DEMO STAGE (canvas areas) ---------- */\n.stage {\n  position: relative;\n  background: #04030a;\n  border: 1px solid var(--frame);\n  overflow: hidden;\n}\n.stage canvas {\n  display: block;\n  width: 100%;\n  height: 100%;\n}\n\n/* ---------- WAVE ---------- */\n@keyframes wave-shift {\n  0% { transform: translateX(0); }\n  100% { transform: translateX(-200px); }\n}\n.wave-track {\n  display: flex;\n  animation: wave-shift 8s linear infinite;\n}\n\n/* ---------- noise pulse ---------- */\n@keyframes noise-pulse {\n  0%, 100% { opacity: 0.06; }\n  50% { opacity: 0.14; }\n}\n.noise {\n  position: absolute;\n  inset: 0;\n  pointer-events: none;\n  background-image:\n    radial-gradient(circle at 20% 30%, rgba(185,169,255,0.6) 0.5px, transparent 1px),\n    radial-gradient(circle at 70% 60%, rgba(185,169,255,0.6) 0.5px, transparent 1px),\n    radial-gradient(circle at 40% 80%, rgba(185,169,255,0.6) 0.5px, transparent 1px);\n  background-size: 7px 7px, 11px 11px, 13px 13px;\n  animation: noise-pulse 3s ease-in-out infinite;\n  z-index: 92;\n}\n\n/* ---------- SLIDE-SPECIFIC ---------- */\n\n/* boot slide typewriter */\n.boot-line {\n  font-family: var(--mono);\n  font-size: 22px;\n  color: var(--ink);\n  letter-spacing: 0.04em;\n  white-space: pre;\n}\n.boot-line.bright { color: var(--ink-bright); text-shadow: 0 0 6px var(--glow); }\n\n/* dossier card */\n.dossier {\n  display: grid;\n  grid-template-columns: 1.05fr 1.6fr;\n  gap: 20px;\n  height: 100%;\n}\n.dossier .col { display: flex; flex-direction: column; gap: 20px; }\n\n/* ---------- RESPONSIVE STAGE PUSHED BY DECK ---------- */\ndeck-stage section {\n  background: var(--bg);\n}\n<\u002Fstyle>\n\n<script type=\"application/json\" id=\"speaker-notes\">\n[\n  \"\",\n  \"\",\n  \"\",\n  \"\",\n  \"\",\n  \"\",\n  \"\",\n  \"\",\n  \"\",\n  \"\",\n  \"\",\n  \"\",\n  \"\",\n  \"\"\n]\n<\u002Fscript>\n<\u002Fhead>\n<body>\n\n<deck-stage>\n\n  <!-- ============================================================\n       SLIDE 01 — BOOT SEQUENCE\n       ============================================================ -->\n  <section class=\"slide\" data-screen-label=\"01 Boot\">\n    <div class=\"status-bar\">\n      <span>RTM.SYS // ARRANQUE<\u002Fspan>\n      <span class=\"dots\"><span class=\"dot on\"><\u002Fspan><span class=\"dot on\"><\u002Fspan><span class=\"dot\"><\u002Fspan><span class=\"dot\"><\u002Fspan><\u002Fspan>\n      <span>v.001 // 03/05/2008<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"slide-frame\"><span class=\"bl\"><\u002Fspan><span class=\"br\"><\u002Fspan><\u002Fdiv>\n\n    <div style=\"position:absolute; inset:120px 140px; display:flex; flex-direction:column; justify-content:center; gap: 36px;\">\n\n      <div style=\"display:flex; align-items:flex-start; gap: 60px;\">\n        <pre class=\"ascii\" style=\"font-size:13px; color: var(--ink); opacity:0.95\"><\u002Fpre>\n        <div style=\"flex:1\">\n m;\n  cursor:pointer; text-align:center; }\n.tp-b.on { border-color:var(--ink); color:var(--ink-bright);\n  background:rgba(185,169,255,0.1); box-shadow:0 0 10px var(--glow) inset; }\n.tp-sw { flex:1; height:42px; cursor:pointer; border:1.5px solid var(--ink-dim);\n  display:flex; align-items:flex-end; justify-content:center; padding:4px;\n  font-family:var(--pixel); font-size:8px; letter-spacing:0.14em;\n  color:rgba(255,255,255,0.9); text-shadow:0 0 4px black; }\n.tp-sw.on { border:1.5px solid #fff; box-shadow:0 0 12px rgba(255,255,255,0.4); }\n.tp-sw.lilac { background:linear-gradient(135deg,#1a1530,#b9a9ff); }\n.tp-sw.amber { background:linear-gradient(135deg,#2a1a05,#ffc14d); }\n.tp-sw.toxic { background:linear-gradient(135deg,#052015,#6dff9b); }\n<\u002Fstyle>\n\n<div class=\"tp\" id=\"tp\">\n  <div class=\"tp-h\">AJUSTES<button class=\"tp-x\" id=\"tp-x\">CERRAR<\u002Fbutton><\u002Fdiv>\n  <div class=\"tp-s\"><div class=\"tp-l\">FÓSFORO // PALETA<\u002Fdiv>\n    <div class=\"tp-row\" data-k=\"palette\">\n      <div class=\"tp-sw lilac\" data-v=\"lilac\">LILA<\u002Fdiv>\n      <div class=\"tp-sw amber\" data-v=\"amber\">ÁMBAR<\u002Fdiv>\n      <div class=\"tp-sw toxic\" data-v=\"toxic\">TÓXICO<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <div class=\"tp-s\"><div class=\"tp-l\">SEÑAL // ESTÁTICA<\u002Fdiv>\n    <div class=\"tp-row\" data-k=\"static\">\n      <button class=\"tp-b\" data-v=\"calm\">CALMA<\u002Fbutton>\n      <button class=\"tp-b\" data-v=\"live\">VIVO<\u002Fbutton>\n      <button class=\"tp-b\" data-v=\"haunted\">FANTASMAL<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n  <div class=\"tp-s\"><div class=\"tp-l\">TUBO // CRT<\u002Fdiv>\n    <div class=\"tp-row\" data-k=\"crt\">\n      <button class=\"tp-b\" data-v=\"clean\">LIMPIO<\u002Fbutton>\n      <button class=\"tp-b\" data-v=\"std\">EST<\u002Fbutton>\n      <button class=\"tp-b\" data-v=\"deep\">PROFUNDO<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n(() => {\n  const T = /*EDITMODE-BEGIN*/{\n    \"palette\": \"amber\",\n    \"static\": \"live\",\n    \"crt\": \"deep\"\n  }/*EDITMODE-END*/;\n  const P=['palette-lilac','palette-amber','palette-toxic'];\n  const S=['static-calm','static-live','static-haunted'];\n  const C=['crt-clean','crt-std','crt-deep'];\n  function apply() {\n    document.body.classList.remove(...P,...S,...C);\n    document.body.classList.add('palette-'+T.palette,'static-'+T.static,'crt-'+T.crt);\n    document.querySelectorAll('[data-k]').forEach(g => {\n      const k = g.dataset.k;\n      g.querySelectorAll('[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v===T[k]));\n    });\n  }\n  function set(k,v){ T[k]=v; apply();\n    try{window.parent.postMessage({type:'__edit_mode_set_keys',edits:{[k]:v}},'*');}catch(e){}}\n  document.querySelectorAll('[data-k]').forEach(g => {\n    const k = g.dataset.k;\n    g.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => set(k, b.dataset.v)));\n  });\n  const panel = document.getElementById('tp');\n  window.addEventListener('message', e => {\n    const m = e.data; if (!m || !m.type) return;\n    if (m.type==='__activate_edit_mode')   panel.classList.add('on');\n    if (m.type==='__deactivate_edit_mode') panel.classList.remove('on');\n  });\n  document.getElementById('tp-x').addEventListener('click', () => {\n    panel.classList.remove('on');\n    try{window.parent.postMessage({type:'__edit_mode_dismissed'},'*');}catch(e){}\n  });\n  apply();\n  try{window.parent.postMessage({type:'__edit_mode_available'},'*');}catch(e){}\n})();\n<\u002Fscript>\n\n\n\n\n<style id=\"__om-edit-overrides\">\n.title-m >div { color: rgb(51, 255, 88) !important }\n<\u002Fstyle>\n<\u002Fbody><\u002Fhtml>"
