document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: faltan datos del paquete');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Desempaquetando ' + uuids.length + ' recursos...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Renderizando...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error al desempaquetar: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"f8d1ba48-be0c-4d25-a232-365493f0a30a\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"dcbd0c1e-bd27-40fc-aee0-6ac74b6acd81\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n</style>\n\n<style>\n  :root{\n    --bg:#07080a;\n    --bg-2:#0d0f12;\n    --ink:#e6e8ea;\n    --ink-2:#9aa0a6;\n    --ink-3:#5b6168;\n    --line:#1a1d22;\n    --line-2:#262a31;\n    --hot:#ff3b30;\n    --cool:#3aa0ff;\n    --amber:#ffb547;\n    --green:#34d188;\n    --violet:#b07cff;\n    --mono:'JetBrains Mono', ui-monospace, monospace;\n    --sans:'Space Grotesk', system-ui, sans-serif;\n  }\n  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}\n  deck-stage:not(:defined){visibility:hidden}\n  deck-stage{background:#000;}\n  section{\n    background:\n      radial-gradient(1200px 800px at 50% 60%, rgba(58,160,255,0.04), transparent 60%),\n      linear-gradient(180deg, #08090c 0%, #050608 100%);\n    color:var(--ink);\n    font-family:var(--sans);\n    overflow:hidden;\n    position:relative;\n  }\n\n  /* Universal chrome overlay: corner brackets + topbar + bottom HUD */\n  .chrome{position:absolute;inset:0;pointer-events:none;z-index:5;}\n  .chrome .topbar{\n    position:absolute;top:0;left:0;right:0;height:54px;\n    border-bottom:1px solid var(--line);\n    display:flex;align-items:center;gap:32px;\n    padding:0 36px;\n    font:500 11px/1 var(--mono);\n    letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);\n  }\n  .chrome .topbar .tab{padding:4px 0;}\n  .chrome .topbar .tab.on{color:var(--ink);}\n  .chrome .topbar .tab.on::before{content:\"\";display:inline-block;width:6px;height:6px;background:var(--hot);margin-right:8px;vertical-align:middle;border-radius:50%;box-shadow:0 0 8px var(--hot);}\n  .chrome .topbar .right{margin-left:auto;display:flex;gap:24px;align-items:center;}\n  .chrome .topbar .warn{color:var(--hot);background:rgba(255,59,48,.08);padding:3px 8px;border:1px solid var(--hot);}\n  .chrome .bottombar{\n    position:absolute;bottom:0;left:0;right:0;height:42px;\n    border-top:1px solid var(--line);\n    display:flex;align-items:center;gap:24px;\n    padding:0 36px;\n    font:400 10px/1 var(--mono);\n    letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);\n  }\n  .chrome .bottombar .right{margin-left:auto;display:flex;gap:24px;align-items:center;}\n  .chrome .corner{position:absolute;width:18px;height:18px;border:1px solid var(--ink-2);}\n  .chrome .c-tl{top:60px;left:30px;border-right:none;border-bottom:none;}\n  .chrome .c-tr{top:60px;right:30px;border-left:none;border-bottom:none;}\n  .chrome .c-bl{bottom:48px;left:30px;border-right:none;border-top:none;}\n  .chrome .c-br{bottom:48px;right:30px;border-left:none;border-top:none;}\n\n  .stage{position:absolute;inset:54px 0 42px 0;padding:48px 80px;display:flex;flex-direction:column;}\n\n  /* Tiny tag chip */\n  .chip{\n    display:inline-flex;align-items:center;gap:8px;\n    font:500 11px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;\n    color:var(--ink-2);\n    padding:6px 10px;border:1px solid var(--line-2);\n    background:rgba(255,255,255,.015);\n  }\n  .chip .dot{width:6px;height:6px;background:var(--cool);border-radius:50%;box-shadow:0 0 8px var(--cool);}\n  .chip.hot .dot{background:var(--hot);box-shadow:0 0 8px var(--hot);}\n  .chip.amber .dot{background:var(--amber);box-shadow:0 0 8px var(--amber);}\n  .chip.green .dot{background:var(--green);box-shadow:0 0 8px var(--green);}\n  .chip.violet .dot{background:var(--violet);box-shadow:0 0 8px var(--violet);}\n\n  .mono{font-family:var(--mono);}\n  .micro{font:500 10px/1.2 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);}\n  .label{font:500 11px/1.2 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--ink-2);}\n\n  h1.display{\n    font-family:var(--sans);font-weight:300;\n    font-size:104px;line-height:.95;letter-spacing:-0.03em;\n    margin:0;color:var(--ink);\n  }\n  h2.title{\n    font-family:var(--sans);font-weight:400;\n    font-size:64px;line-height:1;letter-spacing:-0.025em;margin:0;\n  }\n  h3.sub{\n    font-family:var(--sans);font-weight:400;\n    font-size:34px;line-height:1.15;letter-spacing:-0.01em;margin:0;color:var(--ink-2);\n  }\n  p.body{font-size:21px;line-height:1.45;color:var(--ink-2);max-width:64ch;}\n  p.body strong{color:var(--ink);font-weight:500;}\n  .accent-hot{color:var(--hot);}\n  .accent-cool{color:var(--cool);}\n  .accent-amber{color:var(--amber);}\n  .accent-green{color:var(--green);}\n  .accent-violet{color:var(--violet);}\n\n  /* Crosshair util */\n  .crosshair{position:absolute;width:14px;height:14px;}\n  .crosshair::before,.crosshair::after{content:\"\";position:absolute;background:var(--ink-3);}\n  .crosshair::before{left:50%;top:0;bottom:0;width:1px;}\n  .crosshair::after{top:50%;left:0;right:0;height:1px;}\n\n  /* Animations */\n  @keyframes scan { 0%{transform:translateY(-100%)} 100%{transform:translateY(2000%)} }\n  @keyframes blink { 0%,80%{opacity:1} 90%,100%{opacity:.2} }\n  @keyframes pulse { 0%,100%{opacity:.85} 50%{opacity:.4} }\n  @keyframes drift { 0%{transform:translateX(0)} 100%{transform:translateX(-40px)} }\n  @keyframes shimmer { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.5)} }\n\n  .scanline{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cool),transparent);opacity:.45;animation:scan 6s linear infinite;}\n\n  /* Background grid */\n  .grid-bg{position:absolute;inset:0;pointer-events:none;\n    background-image:\n      linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),\n      linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);\n    background-size:80px 80px;\n    mask-image:radial-gradient(1200px 700px at 50% 50%, #000 0%, transparent 80%);\n  }\n\n  /* Pixel heatmap canvas wrapper */\n  .heatmap{position:relative;display:inline-block;}\n  .heatmap canvas{display:block;image-rendering:pixelated;}\n\n  /* Buttons & toggles */\n  .btn{\n    pointer-events:auto;display:inline-flex;align-items:center;gap:8px;\n    font:500 11px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;\n    color:var(--ink-2);background:transparent;border:1px solid var(--line-2);\n    padding:9px 14px;cursor:pointer;transition:all .15s ease;\n  }\n  .btn:hover{color:var(--ink);border-color:var(--ink-2);}\n  .btn.on{color:#000;background:var(--ink);border-color:var(--ink);}\n  .btn .k{color:var(--ink-3);}\n\n  /* Reusable panel frame */\n  .panel{\n    position:relative;border:1px solid var(--line-2);\n    background:rgba(255,255,255,.012);\n    padding:14px 16px;\n  }\n  .panel .panel-lbl{\n    position:absolute;top:-7px;left:12px;background:#07080a;padding:0 8px;\n    font:500 10px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);\n  }\n  .panel.warn{border-color:var(--hot);}\n  .panel.warn .panel-lbl{color:var(--hot);}\n\n  /* Slide-specific scoped layouts use inline data attributes for clarity */\n</style>\n</head>\n<body>\n\n<deck-stage width=\"1920\" height=\"1080\">\n\n<!-- ============================================================ -->\n<!-- SLIDE 1 — COLD OPEN -->\n<!-- ============================================================ -->\n<section data-label=\"Cover\">\n  <div class=\"grid-bg\"></div>\n  <div class=\"chrome\">\n    <div class=\"topbar\">\n      <span class=\"tab on\">PRINCIPIO</span>\n      <span class=\"tab\">HIPÓTESIS</span>\n      <span class=\"tab\">SEÑAL · S1</span>\n      <span class=\"tab\">SEÑAL · S2</span>\n      <span class=\"tab\">VALIDACIÓN</span>\n      <span class=\"tab\">FALSIFICAR</span>\n      <span class=\"right\">\n        <span>UMBRAL SRP 0.50</span>\n        <span class=\"warn\">EN VIVO</span>\n      </span>\n    </div>\n    <div class=\"corner c-tl\"></div><div class=\"corner c-tr\"></div>\n    <div class=\"corner c-bl\"></div><div class=\"corner c-br\"></div>\n    <div class=\"bottombar\">\n      <span>011 / ACCESO CONSCIENTE</span>\n      <span>RTM · HIPÓTESIS OPERACIONAL</span>\n      <span class=\"right\"><span>2026</span><span style=\"color:var(--ink);\">FORMULARIO A 1039 / 3972 E</span></span>\n    </div>\n    <div class=\"scanline\" style=\"top:54px;\"></div>\n  </div>\n\n  <div class=\"stage\" style=\"padding:80px 100px;flex-direction:row;align-items:stretch;gap:60px;\">\n    <!-- Left text -->\n    <div style=\"flex:1;display:flex;flex-direction:column;justify-content:space-between;\">\n      <div>\n        <span class=\"chip hot\"><span class=\"dot\"></span>ARCHIVO · 011 · ES</span>\n        <h1 class=\"display\" style=\"margin-top:26px;\">\n          Acceso<br>\n          <span style=\"color:var(--ink-2);\">Consciente.</span>\n        </h1>\n        <h3 class=\"sub\" style=\"margin-top:30px;max-width:18ch;\">Un umbral de coherencia que puedes medir.<br><span style=\"font-size:34px;font-family:'Lato',sans-serif;font-weight:700;color:var(--ink);\">Sin requerir cuántica.</span></h3>\n      </div>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;max-width:780px;\">\n        <div class=\"panel\"><span class=\"panel-lbl\">SEÑAL · S1</span>\n          <div style=\"font:300 44px/1 var(--mono);color:var(--ink);\">α</div>\n          <div class=\"micro\" style=\"margin-top:8px;\">pendiente multiescala</div>\n        </div>\n        <div class=\"panel\"><span class=\"panel-lbl\">SEÑAL · S2</span>\n          <div style=\"font:300 44px/1 var(--mono);color:var(--ink);\">NDI</div>\n          <div class=\"micro\" style=\"margin-top:8px;\">índice de dirección neta</div>\n        </div>\n        <div class=\"panel\"><span class=\"panel-lbl\">N · PROBADOS</span>\n          <div style=\"font:300 44px/1 var(--mono);color:var(--ink);\">30.873</div>\n          <div class=\"micro\" style=\"margin-top:8px;\">sujetos con EEG</div>\n        </div>\n      </div>\n    </div>\n\n    <!-- Right heatmap stage -->\n    <div style=\"flex:1.05;position:relative;display:flex;align-items:center;justify-content:center;\">\n      <!-- floating coords -->\n      <div class=\"micro\" style=\"position:absolute;top:0;right:0;\">RGT +5° · DEC −17° · SEA 1.43</div>\n      <div class=\"micro\" style=\"position:absolute;bottom:0;right:0;\">ESPECTROS / 011F · CONSCIENCIA</div>\n\n      <!-- dashed bounding box -->\n      <div style=\"position:absolute;width:520px;height:520px;border:1px dashed var(--ink-3);\"></div>\n\n      <!-- circle behind heatmap -->\n      <div style=\"position:absolute;width:460px;height:460px;border-radius:50%;border:1px solid var(--line-2);\"></div>\n\n      <!-- the live pixel heatmap canvas -->\n      <div class=\"heatmap\">\n        <canvas id=\"cover-heat\" width=\"44\" height=\"44\" style=\"width:380px;height:380px;\"></canvas>\n      </div>\n\n      <!-- tick labels -->\n      <div class=\"micro\" style=\"position:absolute;left:-40px;top:50%;transform:translateY(-50%) rotate(-90deg);transform-origin:center;\">FLUJO · COHERENCIA α</div>\n      <div class=\"micro\" style=\"position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);\">0.1 &nbsp; 0.5 &nbsp; 1.0 &nbsp; 10.0 · log(L)</div>\n\n      <!-- corner tag -->\n      <div style=\"position:absolute;top:14px;left:14px;\" class=\"micro\">011F</div>\n    </div>\n  </div>\n</section>\n\n\n<!-- ============================================================ -->\n<!-- SLIDE 2 — LA PREGUNTA -->\n<!-- ============================================================ -->\n<section data-label=\"The Question\">\n  <div class=\"grid-bg\"></div>\n  <div class=\"chrome\">\n    <div class=\"topbar\">\n      <span class=\"tab\">PRINCIPIO</span>\n      <span class=\"tab on\">PREGUNTA</span>\n      <span class=\"tab\">HIPÓTESIS</span>\n      <span class=\"tab\">SEÑAL · S1</span>\n      <span class=\"tab\">SEÑAL · S2</span>\n      <span class=\"tab\">VALIDACIÓN</span>\n      <span class=\"right\"><span>02 / 12</span></span>\n    </div>\n    <div class=\"corner c-tl\"></div><div class=\"corner c-tr\"></div>\n    <div class=\"corner c-bl\"></div><div class=\"corner c-br\"></div>\n    <div class=\"bottombar\"><span>MARCO · ¿POR QUÉ MEDIR LA CONSCIENCIA?</span><span class=\"right\">SECCIÓN I</span></div>\n  </div>\n\n  <div class=\"stage\" style=\"flex-direction:row;gap:80px;align-items:center;\">\n    <div style=\"flex:1;\">\n      <span class=\"chip\"><span class=\"dot\"></span>LA PREGUNTA</span>\n      <h2 class=\"title\" style=\"margin-top:24px;font-size:84px;line-height:.95;max-width:14ch;\">\n        ¿Cuándo un cerebro<br>se vuelve <em style=\"font-style:normal;color:var(--hot);\">consciente</em><br>de lo que ve?\n      </h2>\n      <p class=\"body\" style=\"margin-top:32px;max-width:48ch;\">\n        La mayoría de las teorías de la consciencia se esconden detrás de <strong>física no comprobable</strong> o <strong>cognición vaga</strong>.\n        RTM plantea algo más preciso: <strong>¿qué umbral numérico,</strong> leído desde un EEG ordinario, cambia un cerebro de <em style=\"color:var(--cool);\">ausente</em> a <em style=\"color:var(--ink);\">presente</em>?\n      </p>\n      <div style=\"display:flex;gap:14px;margin-top:36px;\">\n        <div class=\"chip hot\"><span class=\"dot\"></span>SIN CUÁNTICA</div>\n        <div class=\"chip\"><span class=\"dot\"></span>SIN QUALIA</div>\n        <div class=\"chip green\"><span class=\"dot\"></span>FALSIFICABLE</div>\n      </div>\n    </div>\n\n    <!-- right: animated EEG strip with awareness threshold -->\n    <div style=\"flex:1;position:relative;height:560px;border:1px solid var(--line-2);background:rgba(255,255,255,.012);\">\n      <div class=\"micro\" style=\"position:absolute;top:10px;left:14px;\">CH 06F · TRAZO EN VIVO · 250 Hz</div>\n      <div class=\"micro\" style=\"position:absolute;top:10px;right:14px;\">UMBRAL α = 0.50</div>\n      <canvas id=\"qstn-eeg\" width=\"900\" height=\"540\" style=\"width:100%;height:100%;display:block;\"></canvas>\n      <div class=\"micro\" style=\"position:absolute;bottom:10px;left:14px;color:var(--hot);\">T = 00:00.000</div>\n      <div class=\"micro\" style=\"position:absolute;bottom:10px;right:14px;\">¿REPORTEEE? <span id=\"qstn-report\" style=\"color:var(--ink);\">—</span></div>\n    </div>\n  </div>\n</section>\n\n\n<!-- ============================================================ -->\n<!-- SLIDE 3 — HIPÓTESIS -->\n<!-- ============================================================ -->\n<section data-label=\"Hypothesis\">\n  <div class=\"grid-bg\"></div>\n  <div class=\"chrome\">\n    <div class=\"topbar\">\n      <span class=\"tab\">PRINCIPIO</span>\n      <span class=\"tab\">PREGUNTA</span>\n      <span class=\"tab on\">HIPÓTESIS</span>\n      <span class=\"tab\">SEÑAL · S1</span>\n      <span class=\"tab\">SEÑAL · S2</span>\n      <span class=\"right\"><span>03 / 12</span></span>\n    </div>\n    <div class=\"corner c-tl\"></div><div class=\"corner c-tr\"></div>\n    <div class=\"corner c-bl\"></div><div class=\"corner c-br\"></div>\n    <div class=\"bottombar\"><span>AFIRMACIÓN OPERACIONAL · DOS SEÑALES · UN UMBRAL</span><span class=\"right\">SECCIÓN II</span></div>\n  </div>\n\n  <div class=\"stage\">\n    <span class=\"chip amber\"><span class=\"dot\"></span>HIPÓTESIS</span>\n    <h2 class=\"title\" style=\"margin-top:22px;max-width:22ch;\">\n      Acceso consciente = <span style=\"color:var(--cool);\">coherencia multiescala</span> que cruza el umbral,\n      <span style=\"color:var(--ink-2);\">Y</span> <span style=\"color:var(--hot);\">flujo dirigido hacia adelante</span> a través de la jerarquía.\n    </h2>\n\n    <div style=\"display:grid;grid-template-columns:1fr 60px 1fr;gap:30px;margin-top:60px;flex:1;\">\n\n      <!-- S1 -->\n      <div class=\"panel\" style=\"padding:30px 32px;\">\n        <span class=\"panel-lbl\">SEÑAL · S1</span>\n        <div class=\"label\" style=\"color:var(--cool);\">COHERENCIA α</div>\n        <div style=\"font:300 120px/1 var(--mono);color:var(--ink);margin-top:6px;\">α</div>\n        <p class=\"body\" style=\"margin-top:14px;\">La pendiente de log(τ) frente a log(L), es decir, cómo se estira el tiempo al alejar la escala. Una α más alta = el cerebro se mantiene afinado consigo mismo en todas las escalas.</p>\n        <div class=\"mono\" style=\"margin-top:18px;font-size:18px;color:var(--ink-2);\">τ ∝ L<sup style=\"color:var(--cool);\">α</sup></div>\n        <div class=\"mono\" style=\"margin-top:4px;font-size:14px;color:var(--ink-3);\">α<sub>crit</sub> ≈ 0.50</div>\n      </div>\n\n      <!-- linker -->\n      <div style=\"display:flex;align-items:center;justify-content:center;\">\n        <div style=\"font:300 56px var(--mono);color:var(--ink-3);\">∧</div>\n      </div>\n\n      <!-- S2 -->\n      <div class=\"panel\" style=\"padding:30px 32px;\">\n        <span class=\"panel-lbl\">SEÑAL · S2</span>\n        <div class=\"label\" style=\"color:var(--hot);\">DIRECCIONALIDAD NDI</div>\n        <div style=\"font:300 120px/1 var(--mono);color:var(--ink);margin-top:6px;\">NDI</div>\n        <p class=\"body\" style=\"margin-top:14px;\">\n          La información se mueve <strong>sensorial → asociativa</strong> más que al revés.\n          <strong>NDI positivo</strong> = una cascada clara hacia adelante. Simétrico = confuso. Invertido = alterado.\n        </p>\n        <div class=\"mono\" style=\"margin-top:18px;font-size:18px;color:var(--ink-2);\">NDI = (TE<sub>fwd</sub> − TE<sub>bwd</sub>) / (TE<sub>fwd</sub> + TE<sub>bwd</sub>)</div>\n        <div class=\"mono\" style=\"margin-top:4px;font-size:14px;color:var(--ink-3);\">conscious: NDI &gt; 0.15</div>\n      </div>\n    </div>\n\n    <div class=\"micro\" style=\"margin-top:30px;color:var(--ink-2);\">→ REGLA DE DECISIÓN: AMBAS PASAN → CONSCIENTE · UNA PASA → ALTERADO · AMBAS FALLAN → INCONSCIENTE</div>\n  </div>\n</section>\n\n\n<!-- ============================================================ -->\n<!-- SLIDE 4 — S1: SLOPE EN VIVO (INTERACTIVE) -->\n<!-- ============================================================ -->\n<section data-label=\"S1 — Slope\">\n  <div class=\"grid-bg\"></div>\n  <div class=\"chrome\">\n    <div class=\"topbar\">\n      <span class=\"tab\">PRINCIPIO</span>\n      <span class=\"tab\">PREGUNTA</span>\n      <span class=\"tab\">HIPÓTESIS</span>\n      <span class=\"tab on\">SEÑAL · S1</span>\n      <span class=\"tab\">SEÑAL · S2</span>\n      <span class=\"right\"><span>04 / 12</span></span>\n    </div>\n    <div class=\"corner c-tl\"></div><div class=\"corner c-tr\"></div>\n    <div class=\"corner c-bl\"></div><div class=\"corner c-br\"></div>\n    <div class=\"bottombar\"><span>SEÑAL S1 · PENDIENTE DE COHERENCIA MULTIESCALA</span><span class=\"right\">ESTIMADOR α · EN VIVO</span></div>\n  </div>\n\n  <div class=\"stage\" style=\"flex-direction:row;gap:60px;\">\n    <div style=\"width:38%;display:flex;flex-direction:column;justify-content:space-between;\">\n      <div>\n        <span class=\"chip\"><span class=\"dot\"></span>SEÑAL · S1</span>\n        <h2 class=\"title\" style=\"margin-top:22px;font-size:62px;line-height:1;max-width:14ch;\">\n          Arrastra la pendiente.\n          <br><span style=\"color:var(--ink-2);\">Cruza 0.50 para despertar.</span>\n        </h2>\n        <p class=\"body\" style=\"margin-top:22px;\">\n          Grafica el tiempo característico <span class=\"mono\" style=\"color:var(--ink);\">τ</span> frente a la escala <span class=\"mono\" style=\"color:var(--ink);\">L</span> en un eje log-log.\n          Un <strong>cerebro despierto</strong> traza una línea estable con pendiente <span class=\"accent-cool\">α &gt; 0.50</span>.\n          La sedación la aplana. La anestesia la rompe.\n        </p>\n      </div>\n\n      <div class=\"panel\" style=\"padding:18px 20px;\">\n        <span class=\"panel-lbl\">CONTROL</span>\n        <div class=\"micro\" style=\"margin-bottom:10px;\">ARRASTRA EL DESLIZADOR · O PRESIONA A / D</div>\n        <input id=\"s1-slider\" type=\"range\" min=\"0\" max=\"100\" value=\"72\" step=\"1\" style=\"width:100%;accent-color:#fff;\">\n        <div style=\"display:flex;justify-content:space-between;margin-top:10px;\" class=\"micro\">\n          <span>α = <span id=\"s1-alpha\" style=\"color:var(--ink);font-size:14px;\">0.72</span></span>\n          <span>ESTADO = <span id=\"s1-state\" style=\"color:var(--cool);font-size:14px;\">VIGILIA · REPORTEEE</span></span>\n        </div>\n      </div>\n    </div>\n\n    <!-- chart -->\n    <div style=\"flex:1;position:relative;border:1px solid var(--line-2);background:rgba(255,255,255,.012);\">\n      <div class=\"micro\" style=\"position:absolute;top:10px;left:14px;\">log(τ) vs log(L) · ROI 06F</div>\n      <div class=\"micro\" style=\"position:absolute;top:10px;right:14px;\" id=\"s1-classify\">SRP ≥ UMBRAL · CLASE = CONSCIENTE</div>\n      <canvas id=\"s1-chart\" width=\"900\" height=\"600\" style=\"width:100%;height:100%;display:block;\"></canvas>\n      <div class=\"micro\" style=\"position:absolute;bottom:10px;left:14px;\">L = GRANULADO ESPACIAL GRUESO · 10⁰ → 10²</div>\n      <div class=\"micro\" style=\"position:absolute;bottom:10px;right:14px;\">α<sub>crit</sub> = 0.50</div>\n    </div>\n  </div>\n</section>\n\n\n<!-- ============================================================ -->\n<!-- SLIDE 5 — S2: DIRECTIONALITY -->\n<!-- ============================================================ -->\n<section data-label=\"S2 — Cascade\">\n  <div class=\"grid-bg\"></div>\n  <div class=\"chrome\">\n    <div class=\"topbar\">\n      <span class=\"tab\">PRINCIPIO</span>\n      <span class=\"tab\">PREGUNTA</span>\n      <span class=\"tab\">HIPÓTESIS</span>\n      <span class=\"tab\">SEÑAL · S1</span>\n      <span class=\"tab on\">SEÑAL · S2</span>\n      <span class=\"right\"><span>05 / 12</span></span>\n    </div>\n    <div class=\"corner c-tl\"></div><div class=\"corner c-tr\"></div>\n    <div class=\"corner c-bl\"></div><div class=\"corner c-br\"></div>\n    <div class=\"bottombar\"><span>SEÑAL S2 · CASCADA DE INFORMACIÓN DIRIGIDA HACIA ADELANTE</span><span class=\"right\">NDI · ENTROPÍA DE TRANSFERENCIA</span></div>\n  </div>\n\n  <div class=\"stage\" style=\"flex-direction:row;gap:60px;\">\n    <div style=\"width:38%;\">\n      <span class=\"chip hot\"><span class=\"dot\"></span>SEÑAL · S2</span>\n      <h2 class=\"title\" style=\"margin-top:22px;font-size:58px;line-height:1;max-width:13ch;\">\n        La información fluye<br>en una sola dirección<br>cuando eres consciente<br>de ello.\n      </h2>\n      <p class=\"body\" style=\"margin-top:22px;\">De V1 a parietal y luego a frontal, una cascada limpia. Los cerebros despiertos empujan hacia adelante; la retroalimentación moldea, pero nunca invierte el flujo neto. La anestesia lo simetriza. Los psicodélicos lo invierten.</p>\n\n      <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:32px;\">\n        <button class=\"btn on\" data-state=\"awake\">▶ VIGILIA</button>\n        <button class=\"btn\" data-state=\"nrem\">○ SUEÑO NREM</button>\n        <button class=\"btn\" data-state=\"propofol\">○ PROPOFOL</button>\n        <button class=\"btn\" data-state=\"psych\">○ PSICODÉLICO</button>\n      </div>\n\n      <div class=\"panel\" style=\"margin-top:24px;\">\n        <span class=\"panel-lbl\">LECTURA</span>\n        <div style=\"display:flex;gap:24px;align-items:baseline;\">\n          <div>\n            <div class=\"micro\">NDI</div>\n            <div style=\"font:300 44px/1 var(--mono);color:var(--ink);\" id=\"s2-ndi\">+0.35</div>\n          </div>\n          <div>\n            <div class=\"micro\">VEREDICTO</div>\n            <div style=\"font:500 16px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;margin-top:14px;color:var(--green);\" id=\"s2-verdict\">HACIA ADELANTE · CONSCIENTE</div>\n          </div>\n        </div>\n      </div>\n    </div>\n\n    <!-- cascade diagram -->\n    <div style=\"flex:1;position:relative;border:1px solid var(--line-2);background:rgba(255,255,255,.012);\">\n      <div class=\"micro\" style=\"position:absolute;top:10px;left:14px;\">JERARQUÍA CORTICAL · SONDAS TE</div>\n      <div class=\"micro\" style=\"position:absolute;top:10px;right:14px;\" id=\"s2-state-label\">ESTADO · VIGILIA</div>\n      <canvas id=\"s2-cascade\" width=\"1000\" height=\"600\" style=\"width:100%;height:100%;display:block;\"></canvas>\n    </div>\n  </div>\n</section>\n\n\n<!-- ============================================================ -->\n<!-- SLIDE 6 — STATE LANDSCAPE -->\n<!-- ============================================================ -->\n<section data-label=\"State Map\">\n  <div class=\"grid-bg\"></div>\n  <div class=\"chrome\">\n    <div class=\"topbar\">\n      <span class=\"tab\">PRINCIPIO</span>\n      <span class=\"tab\">PREGUNTA</span>\n      <span class=\"tab\">HIPÓTESIS</span>\n      <span class=\"tab\">SEÑAL · S1</span>\n      <span class=\"tab\">SEÑAL · S2</span>\n      <span class=\"tab on\">MAPA DE ESTADOS</span>\n      <span class=\"right\"><span>06 / 12</span></span>\n    </div>\n    <div class=\"corner c-tl\"></div><div class=\"corner c-tr\"></div>\n    <div class=\"corner c-bl\"></div><div class=\"corner c-br\"></div>\n    <div class=\"bottombar\"><span>ESTADOS DE CONSCIENCIA · COORDENADAS α</span><span class=\    </div>\n        <h3 style=\"font:400 36px/1 var(--sans);margin:14px 0 0 0;\">Local arriba. Hacia adelante abajo.</h3>\n        <p class=\"body\" style=\"margin-top:14px;font-size:18px;\">\n          Coherence within layers <em style=\"color:var(--violet);\">intensifies</em>. The forward cascade <em style=\"color:var(--violet);\">reverses</em>.\n        </p>\n        <div style=\"margin-top:24px;\">\n          <div class=\"micro\">S1 · α &nbsp; <span style=\"float:right;\">0.72 → <span style=\"color:var(--violet);\">0.82</span> · +14 %</span></div>\n          <div style=\"height:8px;background:#111;margin-top:6px;position:relative;\">\n            <div style=\"position:absolute;left:0;top:0;bottom:0;width:72%;background:var(--cool);opacity:.4;\"></div>\n            <div style=\"position:absolute;left:0;top:0;bottom:0;width:82%;background:var(--violet);\"></div>\n          </div>\n          <div class=\"micro\" style=\"margin-top:18px;\">S2 · NDI &nbsp; <span style=\"float:right;\">+0.45 → <span style=\"color:var(--violet);\">−0.15</span> · INVERTIDO</span></div>\n          <div style=\"height:8px;background:#111;margin-top:6px;position:relative;\">\n            <div style=\"position:absolute;left:50%;top:0;bottom:0;width:45%;background:var(--cool);opacity:.4;\"></div>\n            <div style=\"position:absolute;right:50%;top:0;bottom:0;width:15%;background:var(--violet);\"></div>\n          </div>\n        </div>\n        <div class=\"micro\" style=\"margin-top:26px;color:var(--violet);\">VEREDICTO · CONSCIENCIA ALTERADA · S1 PASA · S2 FALLA</div>\n      </div>\n    </div>\n\n    <div class=\"panel\" style=\"margin-top:24px;padding:14px 20px;\">\n      <span class=\"panel-lbl\">IDEA CLAVE</span>\n      <p style=\"margin:0;font-size:18px;color:var(--ink-2);\">\n        Behavioral unresponsiveness ≠ unconsciousness. <strong style=\"color:var(--ink);\">S1 and S2 split apart</strong> exactly where folk neuroscience can't tell the difference.\n      </p>\n    </div>\n  </div>\n</section>\n\n\n<!-- ============================================================ -->\n<!-- SLIDE 8 — PLANO α × R² (EN VIVO SCATTER) -->\n<!-- ============================================================ -->\n<section data-label=\"2D Plane\">\n  <div class=\"grid-bg\"></div>\n  <div class=\"chrome\">\n    <div class=\"topbar\">\n      <span class=\"tab\">SEÑAL · S1</span>\n      <span class=\"tab\">SEÑAL · S2</span>\n      <span class=\"tab\">MAPA DE ESTADOS</span>\n      <span class=\"tab\">FARMACOLOGÍA</span>\n      <span class=\"tab on\">PLANO α × R²</span>\n      <span class=\"right\"><span>08 / 12</span></span>\n    </div>\n    <div class=\"corner c-tl\"></div><div class=\"corner c-tr\"></div>\n    <div class=\"corner c-bl\"></div><div class=\"corner c-br\"></div>\n    <div class=\"bottombar\"><span>MÉTRICA 2D DE CONSCIENCIA · 11,500 REGISTROS</span><span class=\"right\">CV AUC = 0.911</span></div>\n  </div>\n\n  <div class=\"stage\" style=\"flex-direction:row;gap:60px;\">\n    <div style=\"width:36%;\">\n      <span class=\"chip amber\"><span class=\"dot\"></span>FLANCO · ABRIL 2026</span>\n      <h2 class=\"title\" style=\"margin-top:22px;font-size:58px;line-height:1;max-width:14ch;\">\n        La pendiente es solo la mitad de la historia.<br><span style=\"color:var(--amber);\">Agrega R²</span> y<br>todo se separa.\n      </h2>\n      <p class=\"body\" style=\"margin-top:22px;\">\n        La consciencia necesita <strong>ambas cosas</strong>: la pendiente correcta y una <strong>ley de potencia limpia</strong>.\n        Multiplicar <span class=\"mono\" style=\"color:var(--ink);\">α × R²</span> casi triplica el tamaño del efecto para ojos abiertos vs. ojos cerrados (d: <span style=\"color:var(--amber);\">0.33 → 0.97</span>).\n      </p>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:30px;\">\n        <div class=\"panel\"><span class=\"panel-lbl\">OJOS ABIERTOS/CERRADOS</span>\n          <div class=\"mono\" style=\"font-size:30px;color:var(--ink);\">0.784</div>\n          <div class=\"micro\">CV AUC</div></div>\n        <div class=\"panel\"><span class=\"panel-lbl\">SANO/CONVULSIÓN</span>\n          <div class=\"mono\" style=\"font-size:30px;color:var(--ink);\">0.911</div>\n          <div class=\"micro\">CV AUC</div></div>\n      </div>\n\n      <div style=\"display:flex;gap:10px;margin-top:24px;flex-wrap:wrap;\">\n        <button class=\"btn plane-toggle on\" data-cls=\"conscious\">● CONSCIENTE</button>\n        <button class=\"btn plane-toggle on\" data-cls=\"seizure\">● CONVULSIÓN</button>\n        <button class=\"btn plane-toggle on\" data-cls=\"closed\">● OJOS CERRADOS</button>\n      </div>\n    </div>\n\n    <div style=\"flex:1;position:relative;border:1px solid var(--line-2);background:rgba(255,255,255,.012);\">\n      <div class=\"micro\" style=\"position:absolute;top:10px;left:14px;\">α (X) × R² (Y) · UCI EEG n=11,500</div>\n      <div class=\"micro\" style=\"position:absolute;top:10px;right:14px;\">FRONTERA DE DECISIÓN · EN VIVO</div>\n      <canvas id=\"plane-canvas\" width=\"900\" height=\"700\" style=\"width:100%;height:100%;display:block;\"></canvas>\n      <div class=\"micro\" style=\"position:absolute;bottom:10px;left:14px;\">α →</div>\n      <div class=\"micro\" style=\"position:absolute;left:8px;top:50%;transform:rotate(-90deg);transform-origin:left top;\">R² →</div>\n    </div>\n  </div>\n</section>\n\n\n<!-- ============================================================ -->\n<!-- SLIDE 9 — EMPIRICAL VALIDACIÓN -->\n<!-- ============================================================ -->\n<section data-label=\"Validation\">\n  <div class=\"grid-bg\"></div>\n  <div class=\"chrome\">\n    <div class=\"topbar\">\n      <span class=\"tab\">MAPA DE ESTADOS</span>\n      <span class=\"tab\">FARMACOLOGÍA</span>\n      <span class=\"tab\">PLANO α × R²</span>\n      <span class=\"tab on\">VALIDACIÓN</span>\n      <span class=\"tab\">FALSIFICAR</span>\n      <span class=\"right\"><span>09 / 12</span></span>\n    </div>\n    <div class=\"corner c-tl\"></div><div class=\"corner c-tr\"></div>\n    <div class=\"corner c-bl\"></div><div class=\"corner c-br\"></div>\n    <div class=\"bottombar\"><span>VALIDACIÓN EMPÍRICA · MONTE CARLO A NIVEL DE SUJETO</span><span class=\"right\">p &lt; 10⁻¹⁰</span></div>\n  </div>\n\n  <div class=\"stage\">\n    <span class=\"chip green\"><span class=\"dot\"></span>VALIDACIÓN</span>\n    <h2 class=\"title\" style=\"margin-top:22px;max-width:24ch;\">\n      <span style=\"color:var(--green);\">30.873</span> sujetos.\n      Una división clara.\n    </h2>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:50px;flex:1;\">\n      <div>\n        <div class=\"panel\" style=\"padding:24px 28px;\">\n          <span class=\"panel-lbl\">DENSIDAD A NIVEL DE SUJETO · PENDIENTE ESPECTRAL β</span>\n          <div style=\"position:relative;height:320px;margin-top:12px;\">\n            <canvas id=\"density-canvas\" width=\"800\" height=\"320\" style=\"width:100%;height:100%;\"></canvas>\n          </div>\n          <div style=\"display:flex;justify-content:space-between;margin-top:14px;\">\n            <span class=\"micro\"><span style=\"color:var(--cool);\">●</span> VIGILIA · β = −2.10</span>\n            <span class=\"micro\"><span style=\"color:var(--hot);\">●</span> INCONSCIENTE · β = −2.84</span>\n          </div>\n          <div style=\"display:flex;justify-content:space-between;margin-top:18px;\">\n            <div><div class=\"mono\" style=\"font-size:30px;color:var(--green);\">d = 0.46</div><div class=\"micro\">d de Cohen</div></div>\n            <div><div class=\"mono\" style=\"font-size:30px;color:var(--green);\">p &lt; 10⁻¹⁰</div><div class=\"micro\">significancia</div></div>\n            <div><div class=\"mono\" style=\"font-size:30px;color:var(--green);\">n = 10,255</div><div class=\"micro\">replicación</div></div>\n          </div>\n        </div>\n      </div>\n\n      <div>\n        <p class=\"body\" style=\"margin-top:0;\"></p>\n\n        <div class=\"panel\" style=\"margin-top:24px;padding:22px 28px;\">\n          <span class=\"panel-lbl\">DISOCIACIÓN POR KETAMINA</span>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px;\">\n            <div>\n              <div class=\"micro\" style=\"color:var(--hot);\">PROPOFOL</div>\n              <div class=\"mono\" style=\"font-size:34px;color:var(--ink);\">−1.25</div>\n              <div class=\"micro\">Δβ · 69% de cambio espectral</div>\n              <div class=\"micro\" style=\"color:var(--hot);margin-top:6px;\">LA CONSCIENCIA COLAPSA</div>\n            </div>\n            <div>\n              <div class=\"micro\" style=\"color:var(--green);\">KETAMINA</div>\n              <div class=\"mono\" style=\"font-size:34px;color:var(--ink);\">−0.10</div>\n              <div class=\"micro\">Δβ · 5% de cambio espectral</div>\n              <div class=\"micro\" style=\"color:var(--green);margin-top:6px;\">CONSCIENCIA PRESERVADA</div>\n            </div>\n          </div>\n        </div>\n\n        <div class=\"panel\" style=\"margin-top:18px;padding:18px 24px;\">\n          <span class=\"panel-lbl\">CRITERIO OPERACIONAL</span>\n          <p style=\"margin:6px 0 0;font-size:18px;\">\n            <span class=\"mono\" style=\"color:var(--green);\">|Δβ/β| &lt; 20%</span> — <strong>consciencia preservada</strong><br>\n            <span class=\"mono\" style=\"color:var(--hot);\">|Δβ/β| &gt; 40%</span> — <strong>consciencia perdida</strong>\n          </p>\n        </div>\n      </div>\n    </div>\n  </div>\n</section>\n\n\n<!-- ============================================================ -->\n<!-- SLIDE 10 — REM PARADOJA -->\n<!-- ============================================================ -->\n<section data-label=\"REM Paradox\">\n  <div class=\"grid-bg\"></div>\n  <div class=\"chrome\">\n    <div class=\"topbar\">\n      <span class=\"tab\">FARMACOLOGÍA</span>\n      <span class=\"tab\">PLANO α × R²</span>\n      <span class=\"tab\">VALIDACIÓN</span>\n      <span class=\"tab on\">REM</span>\n      <span class=\"tab\">FALSIFICAR</span>\n      <span class=\"right\"><span>10 / 12</span></span>\n    </div>\n    <div class=\"corner c-tl\"></div><div class=\"corner c-tr\"></div>\n    <div class=\"corner c-bl\"></div><div class=\"corner c-br\"></div>\n    <div class=\"bottombar\"><span>LA PARADOJA REM · PREDICCIÓN COMPROBABLE</span><span class=\"right\">NO RESUELTO → RESOLUBLE</span></div>\n  </div>\n\n  <div class=\"stage\" style=\"flex-direction:row;gap:60px;\">\n    <div style=\"width:40%;\">\n      <span class=\"chip amber\"><span class=\"dot\"></span>PARADOJA</span>\n      <h2 class=\"title\" style=\"margin-top:22px;font-size:58px;line-height:1;max-width:14ch;\">\n        Soñar es <span style=\"color:var(--violet);\">consciente</span>.<br>\n        Su pendiente es <span style=\"color:var(--hot);\">inconsciente</span>.<br>\n        <span style=\"color:var(--ink-2);\">¿Qué ocurre?</span>\n      </h2>\n      <p class=\"body\" style=\"margin-top:22px;\">REM tiene una pendiente pronunciada (β ≈ −3.25), la misma forma que muestra el sueño NREM. Aun así, quienes sueñan ven, sienten y recuerdan. La pendiente por sí sola se equivoca.</p>\n      <p class=\"body\" style=\"margin-top:14px;\">La métrica 2D predice la respuesta: REM debería preservar un R² alto;&nbsp; la estructura de ley de potencia permanece intacta incluso cuando la dinámica se ralentiza.</p>\n      <div class=\"panel\" style=\"margin-top:26px;padding:16px 20px;\">\n        <span class=\"panel-lbl\">PREDICCIÓN</span>\n        <p style=\"margin:6px 0 0;font-size:17px;\">\n          La polisomnografía en NSRR debería mostrar:<br>\n          <span class=\"mono\" style=\"color:var(--green);\">REM · R² ≈ vigilia</span>,\n          <span class=\"mono\" style=\"color:var(--hot);\">NREM · R² colapsa</span>.\n        </p>\n      </div>\n    </div>\n\n    <div style=\"flex:1;position:relative;border:1px solid var(--line-2);background:rgba(255,255,255,.012);\">\n      <div class=\"micro\" style=\"position:absolute;top:10px;left:14px;\">α (inclinación) × R² (estructura) · PREDICHO</div>\n      <div class=\"micro\" style=\"position:absolute;top:10px;right:14px;\">3 ESTADOS SE SEPARAN</div>\n      <canvas id=\"rem-canvas\" width=\"900\" height=\"640\" style=\"width:100%;height:100%;display:block;\"></canvas>\n    </div>\n  </div>\n</section>\n\n\n<!-- ============================================================ -->\n<!-- SLIDE 11 — FALSIFIABILITY MATRIX -->\n<!-- ============================================================ -->\n<section data-label=\"Falsifiability\">\n  <div class=\"grid-bg\"></div>\n  <div class=\"chrome\">\n    <div class=\"topbar\">\n      <span class=\"tab\">PLANO α × R²</span>\n      <span class=\"tab\">VALIDACIÓN</span>\n      <span class=\"tab\">REM</span>\n      <span class=\"tab on\">FALSIFICAR</span>\n      <span class=\"tab\">DECISIÓN</span>\n      <span class=\"right\"><span>11 / 12</span></span>\n    </div>\n    <div class=\"corner c-tl\"></div><div class=\"corner c-tr\"></div>\n    <div class=\"corner c-bl\"></div><div class=\"corner c-br\"></div>\n    <div class=\"bottombar\"><span>MATRIZ DE FALSABILIDAD · TABLA DE DECISIÓN PASA/FALLA</span><span class=\"right\">INFORME REGISTRADO · ETAPA 1</span></div>\n  </div>\n\n  <div class=\"stage\">\n    <span class=\"chip hot\"><span class=\"dot\"></span>FALSIFICAR</span>\n    <h2 class=\"title\" style=\"margin-top:22px;max-width:24ch;\">\n      La teoría <span style=\"color:var(--hot);\">muere</span> si cualquiera de estos puntos falla.\n    </h2>\n\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:50px;flex:1;\">\n      <div class=\"panel\" style=\"padding:22px;\">\n        <span class=\"panel-lbl\">H1 · ACCESO</span>\n        <div class=\"label\" style=\"color:var(--cool);margin-top:6px;\">REPORTEEE vs SIN REPORTEEE</div>\n        <h3 style=\"font:400 24px var(--sans);margin:10px 0 12px;\">α aumenta a través de la jerarquía involucrada.</h3>\n        <p style=\"margin:0;font-size:15px;color:var(--ink-2);line-height:1.4;\">Si α cae en ensayos conscientes, la teoría queda falsificada.</p>\n      </div>\n      <div class=\"panel\" style=\"padding:22px;\">\n        <span class=\"panel-lbl\">H2 · ANESTESIA</span>\n        <div class=\"label\" style=\"color:var(--cool);margin-top:6px;\">PROPOFOL / NREM</div>\n        <h3 style=\"font:400 24px var(--sans);margin:10px 0 12px;\">α y NDI colapsan juntos.</h3>\n        <p style=\"margin:0;font-size:15px;color:var(--ink-2);line-height:1.4;\">REM debería restaurar parcialmente ambas.</p>\n      </div>\n      <div class=\"panel\" style=\"padding:22px;\">\n        <span class=\"panel-lbl\">H3 · PSICODÉLICOS</span>\n        <div class=\"label\" style=\"color:var(--cool);margin-top:6px;\">AGONISTAS 5-HT</div>\n        <h3 style=\"font:400 24px var(--sans);margin:10px 0 12px;\">α ↑ localmente, NDI ↓ globalmente.</h3>\n        <p style=\"margin:0;font-size:15px;color:var(--ink-2);line-height:1.4;\">S1 y S2 deben disociarse.</p>\n      </div>\n      <div class=\"panel\" style=\"padding:22px;\">\n        <span class=\"panel-lbl\">H4 · TMS-EEG</span>\n        <div class=\"label\" style=\"color:var(--cool);margin-top:6px;\">PERTURBACIONAL</div>\n        <h3 style=\"font:400 24px var(--sans);margin:10px 0 12px;\">Los pulsos conscientes avanzan hacia adelante; los pulsos de LOC no.</h3>\n        <p style=\"margin:0;font-size:15px;color:var(--ink-2);line-height:1.4;\">TMS simulada como control nulo.</p>\n      </div>\n    </div>\n\n    <div class=\"panel warn\" style=\"margin-top:24px;padding:18px 24px;\">\n      <span class=\"panel-lbl\">PRE-REGISTRADO · CONTROLES NULOS</span>\n      <p style=\"margin:6px 0 0;font-size:17px;color:var(--ink-2);\">\n        Sustitutos con fase mezclada · TMS simulada · BH-FDR q = 0.05 · se requieren dos proxies de escala independientes para convergencia · código con semilla y público.\n      </p>\n    </div>\n  </div>\n</section>\n\n\n<!-- ============================================================ -->\n<!-- SLIDE 12 — DECISIÓN / CLOSING -->\n<!-- ============================================================ -->\n<section data-label=\"Decision\">\n  <div class=\"grid-bg\"></div>\n  <div class=\"chrome\">\n    <div class=\"topbar\">\n      <span class=\"tab\">VALIDACIÓN</span>\n      <span class=\"tab\">REM</span>\n      <span class=\"tab\">FALSIFICAR</span>\n      <span class=\"tab on\">DECISIÓN</span>\n      <span class=\"right\"><span>12 / 12</span><span class=\"warn\">FIN</span></span>\n    </div>\n    <div class=\"corner c-tl\"></div><div class=\"corner c-tr\"></div>\n    <div class=\"corner c-bl\"></div><div class=\"corner c-br\"></div>\n    <div class=\"bottombar\"><span>011 / ACCESO CONSCIENTE · RTM</span><span class=\"right\"><span>CC BY 4.0</span></span></div>\n  </div>\n\n  <div class=\"stage\" style=\"padding:80px 100px;flex-direction:row;gap:60px;align-items:stretch;\">\n    <div style=\"flex:1;display:flex;flex-direction:column;justify-content:space-between;\">\n      <div>\n        <span class=\"chip green\"><span class=\"dot\"></span>CIERRE</span>\n        <h1 class=\"display\" style=\"margin-top:26px;\">\n          Un cerebro<br>\n          <span style=\"color:var(--cool);\">se escucha a sí mismo</span><br>\n          a través de cada escala,<br>\n          <span style=\"color:var(--ink-2);\">hacia adelante.</span>\n        </h1>\n        <p class=\"body\" style=\"margin-top:28px;max-width:48ch;\">\n          Eso es todo lo que necesita ser el “acceso consciente”: una pendiente que puedes leer con electrodos, una dirección que puedes confirmar con estadística y un umbral que la farmacología obedece.\n        </p>\n      </div>\n\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:18px;\">\n        <div class=\"panel\"><span class=\"panel-lbl\">PASA · PASA</span>\n          <div class=\"mono\" style=\"font-size:22px;color:var(--green);\">CONSCIENTE</div></div>\n        <div class=\"panel\"><span class=\"panel-lbl\">PASA · FALLA</span>\n          <div class=\"mono\" style=\"font-size:22px;color:var(--violet);\">ALTERADO</div></div>\n        <div class=\"panel warn\"><span class=\"panel-lbl\">FALLA · FALLA</span>\n          <div class=\"mono\" style=\"font-size:22px;color:var(--hot);\">INCONSCIENTE</div></div>\n      </div>\n    </div>\n\n    <!-- closing instrument -->\n    <div style=\"flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;\">\n      <div style=\"position:absolute;width:560px;height:560px;border:1px solid var(--line-2);border-radius:50%;\"></div>\n      <div style=\"position:absolute;width:420px;height:420px;border:1px dashed var(--ink-3);border-radius:50%;animation:pulse 4s ease-in-out infinite;\"></div>\n      <canvas id=\"closing-canvas\" width=\"500\" height=\"500\" style=\"width:380px;height:380px;display:block;image-rendering:pixelated;\"></canvas>\n      <div class=\"micro\" style=\"margin-top:30px;letter-spacing:.3em;\">FORMULARIO A · 1039 / 3972 E</div>\n      <div class=\"micro\" style=\"margin-top:6px;color:var(--ink-2);\">FIN DE LA TRANSMISIÓN</div>\n    </div>\n  </div>\n</section>\n\n</deck-stage>\n\n<script src=\"216b4a89-2fa9-4046-88d2-e5335f175d42\"><\/script>\n<script>\n/* ============================================================\n   Visualizations — pure-canvas, no deps\n   ============================================================ */\n\n// Utility: animation registry; only run for active slide\nconst activeRunners = new Map(); // index -> stop() fn\nlet currentIndex = 0;\n\nfunction rafLoop(fn){\n  let id; let running = true;\n  const tick = (t) => { if (!running) return; fn(t); id = requestAnimationFrame(tick); };\n  id = requestAnimationFrame(tick);\n  return () => { running = false; cancelAnimationFrame(id); };\n}\n\n/* ----- SLIDE 1: cover pixel heatmap ----- */\nfunction startCoverHeatmap(){\n  const cv = document.getElementById('cover-heat'); if (!cv) return;\n  const ctx = cv.getContext('2d');\n  const W = cv.width, H = cv.height;\n  const cx = W/2, cy = H/2;\n  return rafLoop((t) => {\n    ctx.clearRect(0,0,W,H);\n    const time = t * 0.0008;\n    for (let y=0; y<H; y++){\n      for (let x=0; x<W; x++){\n        const dx = x - cx, dy = y - cy;\n        const r = Math.sqrt(dx*dx+dy*dy);\n        const ang = Math.atan2(dy,dx);\n        // smiley face: eyes + mouth heat\n        const leftEye  = Math.exp(-((x-15)**2 + (y-18)**2)/8);\n        const rightEye = Math.exp(-((x-29)**2 + (y-18)**2)/8);\n        const mouth = Math.exp(-((x-22)**2 + (y-30)**2)/(20 + 6*Math.sin(time*3)));\n        const ring = Math.exp(-((r-15)**2)/40) * (0.4 + 0.3*Math.sin(ang*4 + time*2));\n        const noise = 0.08 * Math.sin(x*0.7 + time*4) * Math.cos(y*0.6 - time*3);\n        const v = Math.max(0, leftEye*1.4 + rightEye*1.4 + mouth*1.2 + ring + noise);\n        if (v < 0.05) continue;\n        // colormap: hot at high, blue at low\n        let r1,g1,b1;\n        if (v > 0.9){ r1=255;g1=240;b1=180; }\n        else if (v > 0.55){ r1=255;g1=70;b1=40; }\n        else if (v > 0.3){ r1=210;g1=40;b1=80; }\n        else { r1=60;g1=110;b1=240; }\n        ctx.fillStyle = `rgba(${r1},${g1},${b1},${Math.min(1, v)})`;\n        ctx.fillRect(x,y,1,1);\n      }\n    }\n  });\n}\n\n/* ----- SLIDE 2: live EEG trace ----- */\nfunction startEegTrace(){\n  const cv = document.getElementById('qstn-eeg'); if (!cv) return;\n  const ctx = cv.getContext('2d');\n  const W = cv.width, H = cv.height;\n  const report = document.getElementById('qstn-report');\n  let phase = 0;\n  return rafLoop((t) => {\n    ctx.fillStyle = 'rgba(7,8,10,0.4)';\n    ctx.fillRect(0,0,W,H);\n    // threshold line\n    ctx.strokeStyle = 'rgba(255,59,48,0.35)';\n    ctx.setLineDash([6,6]);\n    ctx.beginPath(); ctx.moveTo(0, H*0.5); ctx.lineTo(W, H*0.5); ctx.stroke();\n    ctx.setLineDash([]);\n    // moving label\n    phase += 0.02;\n    // generate trace\n    ctx.strokeStyle = '#3aa0ff';\n    ctx.lineWidth = 1.4;\n    ctx.beginPath();\n    let aboveCount = 0;\n    for (let x=0; x<W; x+=2){\n      const tt = phase + x*0.008;\n      // mix of slow rhythm + spikes (consciousness events)\n      const slow = Math.sin(tt*0.7) * 60;\n      const med = Math.sin(tt*2.3 + Math.sin(tt*0.4)) * 28;\n      const noise = (Math.sin(tt*7.1 + x*0.3) + Math.sin(tt*11.7 - x*0.2)) * 12;\n      // periodic awareness \"events\"\n      const evtPhase = (tt*0.6) % (Math.PI*2);\n      const evt = Math.exp(-Math.pow((evtPhase - Math.PI),2)*6) * 90;\n      const y = H*0.5 - (slow + med + noise + evt);\n      if (y < H*0.5 - 60) aboveCount++;\n      if (x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);\n    }\n    ctx.stroke();\n    if (report) report.textContent = aboveCount > 80 ? 'SÍ' : '—';\n    if (report) report.style.color = aboveCount > 80 ? '#34d188' : '#9aa0a6';\n  });\n}\n\n/* ----- SLIDE 4: log-log scaling chart driven by slider ----- */\nfunction setupS1Chart(){\n  const cv = document.getElementById('s1-chart'); if (!cv) return;\n  const ctx = cv.getContext('2d');\n  const W = cv.width, H = cv.height;\n  const slider = document.getElementById('s1-slider');\n  const alphaOut = document.getElementById('s1-alpha');\n  const stateOut = document.getElementById('s1-state');\n  const classify = document.getElementById('s1-classify');\n  const padL = 80, padR = 50, padT = 60, padB = 80;\n  const w = W - padL - padR, h = H - padT - padB;\n  let alpha = 0.72;\n\n  function draw(){\n    ctx.clearRect(0,0,W,H);\n    // grid\n    ctx.strokeStyle = 'rgba(255,255,255,0.05)';\n    ctx.lineWidth = 1;\n    for (let i=0;i<=6;i++){\n      const x = padL + (i/6)*w;\n      ctx.beginPath(); ctx.moveTo(x,padT); ctx.lineTo(x,padT+h); ctx.stroke();\n    }\n    for (let i=0;i<=5;i++){\n      const y = padT + (i/5)*h;\n      ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+w,y); ctx.stroke();\n    }\n    // axes labels\n    ctx.fillStyle = '#5b6168';\n    ctx.font = '11px JetBrains Mono';\n    ctx.textAlign = 'center';\n    for (let i=0;i<=6;i++){\n      ctx.fillText(`10^${i-1}`, padL + (i/6)*w, padT+h+22);\n    }\n    ctx.save();\n    ctx.translate(20, padT+h/2); ctx.rotate(-Math.PI/2);\n    ctx.fillText('log(τ) · TIEMPO CARACTERÍSTICO', 0,0);\n    ctx.restore();\n    // threshold line (alpha=0.5)\n    ctx.strokeStyle = 'rgba(255,59,48,0.5)';\n    ctx.setLineDash([5,5]);\n    ctx.beginPath();\n    const x0 = padL, y0 = padT + h - 0.05*h;\n    const x1 = padL + w, y1 = padT + h - (0.5 * 6 / 5) * h - 0.05*h;\n    // simpler: line y = padT+h*(1 - alpha * t) where t from 0..1\n    function lineFor(a, color, dash){\n      ctx.strokeStyle = color;\n      ctx.setLineDash(dash||[]);\n      ctx.lineWidth = dash? 1.5: 2.8;\n      ctx.beginPath();\n      for (let i=0;i<=60;i++){\n        const tx = i/60;\n        const ty = a * tx + 0.06; // intercept\n        const sx = padL + tx*w;\n        const sy = padT + h - ty*h;\n        if (i===0) ctx.moveTo(sx,sy); else ctx.lineTo(sx,sy);\n      }\n      ctx.stroke();\n    }\n    lineFor(0.5, 'rgba(255,59,48,0.55)', [6,6]);\n    ctx.setLineDash([]);\n    // current alpha line\n    const color = alpha > 0.5 ? '#3aa0ff' : '#ff3b30';\n    lineFor(alpha, color);\n    // scatter points around the line\n    ctx.fillStyle = alpha > 0.5 ? 'rgba(58,160,255,0.8)' : 'rgba(255,59,48,0.8)';\n    const seed = 1;\n    for (let i=0;i<48;i++){\n      const tx = (i+0.5)/48;\n      const ty = alpha * tx + 0.06 + (Math.sin(i*1.3+seed)*0.04 + Math.cos(i*0.7)*0.03);\n      const sx = padL + tx*w;\n      const sy = padT + h - ty*h;\n      ctx.beginPath(); ctx.arc(sx, sy, 3, 0, Math.PI*2); ctx.fill();\n    }\n    // threshold label\n    ctx.fillStyle = '#ff3b30';\n    ctx.font = '11px JetBrains Mono';\n    ctx.textAlign = 'left';\n    ctx.fillText('α = 0.50 · UMBRAL', padL + 12, padT + h - 0.5*h*0.85 + 2);\n\n    // alpha text on line\n    ctx.fillStyle = color;\n    ctx.font = '600 18px JetBrains Mono';\n    ctx.textAlign = 'right';\n    ctx.fillText(`α = ${alpha.toFixed(2)}`, padL+w-12, padT + h - (alpha*1+0.06)*h - 14);\n  }\n\n  function stateFor(a){\n    if (a >= 0.65) return {name:'VIGILIA · REPORTEEE', col:'#3aa0ff'};\n    if (a >= 0.50) return {name:'SEDACIÓN LIGERA', col:'#3aa0ff'};\n    if (a >= 0.40) return {name:'SIN REPORTEEE', col:'#ffb547'};\n    if (a >= 0.30) return {name:'NREM SLEEP', col:'#ff3b30'};\n    return {name:'DEEP ANESTESIA', col:'#ff3b30'};\n  }\n  function update(){\n    alpha = slider.value/100 * 1.0; // 0..1.0\n    if (alphaOut) alphaOut.textContent = alpha.toFixed(2);\n    const s = stateFor(alpha);\n    if (stateOut){ stateOut.textContent = s.name; stateOut.style.color = s.col; }\n    if (classify){\n      const pass = alpha > 0.5;\n      classify.textContent = pass ? 'SRP ≥ UMBRAL · CLASE = CONSCIENTE' : 'SRP < UMBRAL · CLASE = INCONSCIENTE';\n      classify.style.color = pass ? '#34d188' : '#ff3b30';\n    }\n    draw();\n  }\n  slider.addEventListener('input', update);\n  // keyboard A/D\n  document.addEventListener('keydown', (e) => {\n    if (currentIndex !== 3) return;\n    if (e.key === 'a' || e.key === 'A'){ slider.value = Math.max(0, +slider.value-3); update(); }\n    if (e.key === 'd' || e.key === 'D'){ slider.value = Math.min(100, +slider.value+3); update(); }\n  });\n  update();\n}\n\n/* ----- SLIDE 5: directional cascade ----- */\nfunction setupS2Cascade(){\n  const cv = document.getElementById('s2-cascade'); if (!cv) return;\n  const ctx = cv.getContext('2d');\n  const W = cv.width, H = cv.height;\n  const buttons = document.querySelectorAll('section[data-screen-label*=\"Cascade\"] [data-state]');\n  const ndiOut = document.getElementById('s2-ndi');\n  const verdictOut = document.getElementById('s2-verdict');\n  const stateLbl = document.getElementById('s2-state-label');\n\n  const states = {\n    awake:    {ndi: 0.35, dir: 1.0, color:'#34d188', label:'ESTADO · VIGILIA', verdict:'HACIA ADELANTE · CONSCIENTE'},\n    nrem:     {ndi: 0.02, dir: 0.05, color:'#ffb547', label:'ESTADO · SUEÑO NREM', verdict:'SIMÉTRICO · INCONSCIENTE'},\n    propofol: {ndi: 0.01, dir: 0.02, color:'#ff3b30', label:'ESTADO · PROPOFOL', verdict:'COLAPSADO · INCONSCIENTE'},\n    psych:    {ndi:-0.15, dir:-0.65, color:'#b07cff', label:'ESTADO · PSICODÉLICO', verdict:'INVERTIDO · ALTERADO'},\n  };\n  let cur = 'awake';\n  buttons.forEach(b => b.addEventListener('click', () => {\n    cur = b.dataset.state;\n    buttons.forEach(bb => {\n      bb.classList.toggle('on', bb===b);\n      bb.firstChild && (bb.innerHTML = bb.innerHTML.replace(/^[○▶]/, bb===b?'▶':'○'));\n    });\n    const s = states[cur];\n    ndiOut.textContent = (s.ndi>=0?'+':'') + s.ndi.toFixed(2);\n    verdictOut.textContent = s.verdict; verdictOut.style.color = s.color;\n    stateLbl.textContent = s.label;\n  }));\n\n  const nodes = [\n    {x:0.08, y:0.5, label:'V1', sub:'visual'},\n    {x:0.30, y:0.32, label:'V4', sub:'rasgo'},\n    {x:0.50, y:0.5, label:'IT', sub:'objeto'},\n    {x:0.72, y:0.32, label:'PAR', sub:'parietal'},\n    {x:0.92, y:0.5, label:'PFC', sub:'frontal'},\n  ];\n\n  return rafLoop((t)=>{\n    ctx.clearRect(0,0,W,H);\n    const s = states[cur];\n    // edges with packets\n    for (let i=0;i<nodes.length-1;i++){\n      const a = nodes[i], b = nodes[i+1];\n      const ax = a.x*W, ay = a.y*H, bx = b.x*W, by = b.y*H;\n      // edge\n      ctx.strokeStyle = 'rgba(255,255,255,0.08)';\n      ctx.lineWidth = 1.5;\n      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();\n      // forward packets\n      const speed = 0.0006 * s.dir;\n      const nPackets = 4;\n      for (let k=0;k<nPackets;k++){\n        const u = ((t*speed + k/nPackets) % 1 + 1) % 1;\n        const px = ax + (bx-ax)*u;\n        const py = ay + (by-ay)*u;\n        const intensity = s.dir >= 0 ? 1.0 : 0.5;\n        ctx.fillStyle = s.dir >= 0 ? s.color : '#b07cff';\n        ctx.globalAlpha = 0.85 * intensity;\n        ctx.beginPath(); ctx.arc(px,py, s.dir>=0?5:4, 0, Math.PI*2); ctx.fill();\n        ctx.globalAlpha = 1;\n      }\n      // small backward packets if state has reversal/symmetric\n      if (Math.abs(s.dir) < 0.5 || s.dir < 0){\n        const nb = s.dir < 0 ? 5 : 2;\n        for (let k=0;k<nb;k++){\n          const u = ((t*0.0003 + k/nb) % 1);\n          const px = bx + (ax-bx)*u;\n          const py = by + (ay-by)*u;\n          ctx.fillStyle = s.dir < 0 ? '#b07cff' : 'rgba(255,255,255,0.4)';\n          ctx.globalAlpha = 0.7;\n          ctx.beginPath(); ctx.arc(px,py, 3, 0, Math.PI*2); ctx.fill();\n          ctx.globalAlpha = 1;\n        }\n      }\n    }\n    // nodes\n    nodes.forEach((n,i) => {\n      const nx = n.x*W, ny = n.y*H;\n      ctx.strokeStyle = s.color; ctx.lineWidth = 1.5;\n      ctx.fillStyle = 'rgba(10,12,15,1)';\n      ctx.beginPath(); ctx.arc(nx,ny, 30, 0, Math.PI*2); ctx.fill(); ctx.stroke();\n      ctx.fillStyle = '#e6e8ea'; ctx.font = '600 16px JetBrains Mono'; ctx.textAlign='center';\n      ctx.fillText(n.label, nx, ny+5);\n      ctx.fillStyle = '#5b6168'; ctx.font = '10px JetBrains Mono';\n      ctx.fillText(n.sub.toUpperCase(), nx, ny+44);\n    });\n    // label\n    ctx.fillStyle = '#9aa0a6'; ctx.font = '10px JetBrains Mono'; ctx.textAlign = 'left';\n    ctx.fillText('SENSORIAL → ASOCIATIVA → FRONTAL', 30, H-20);\n  });\n}\n\n/* ----- SLIDE 6: state axis ----- */\nfunction setupStateAxis(){\n  const cv = document.getElementById('state-axis'); if (!cv) return;\n  const ctx = cv.getContext('2d');\n  const W = cv.width, H = cv.height;\n  const states = [\n    {name:'VIGILIA · REPORTEEE', a:0.72, c:'#34d188'},\n    {name:'REM', a:0.65, c:'#34d188'},\n    {name:'SEDACIÓN', a:0.52, c:'#ffb547'},\n    {name:'SIN REPORTEEE', a:0.48, c:'#ffb547'},\n    {name:'NREM', a:0.35, c:'#ff3b30'},\n    {name:'ANESTESIA', a:0.28, c:'#ff3b30'},\n  ];\n  const padL=80, padR=80, padT=60, padB=70;\n  const w = W-padL-padR, h = H-padT-padB;\n  let revealT = 0;\n\n  return rafLoop((t) => {\n    revealT = Math.min(1, revealT + 0.018);\n    ctx.clearRect(0,0,W,H);\n    // axis\n    const ay = padT + h*0.7;\n    ctx.strokeStyle = 'rgba(255,255,255,0.15)';\n    ctx.beginPath(); ctx.moveTo(padL, ay); ctx.lineTo(padL+w, ay); ctx.stroke();\n    // ticks\n    ctx.fillStyle = '#5b6168'; ctx.font = '11px JetBrains Mono'; ctx.textAlign='center';\n    for (let i=0;i<=10;i++){\n      const xp = padL + (i/10)*w;\n      ctx.strokeStyle = 'rgba(255,255,255,0.1)';\n      ctx.beginPath(); ctx.moveTo(xp, ay-6); ctx.lineTo(xp, ay+6); ctx.stroke();\n      ctx.fillText(((i/10)).toFixed(1), xp, ay+24);\n    }\n    // threshold zone\n    const tx = padL + 0.5*w;\n    ctx.fillStyle = 'rgba(255,59,48,0.06)';\n    ctx.fillRect(padL, padT, tx-padL, h);\n    ctx.fillStyle = 'rgba(52,209,136,0.06)';\n    ctx.fillRect(tx, padT, padL+w-tx, h);\n    ctx.strokeStyle = 'rgba(255,59,48,0.8)';\n    ctx.setLineDash([6,6]);\n    ctx.beginPath(); ctx.moveTo(tx, padT); ctx.lineTo(tx, padT+h); ctx.stroke();\n    ctx.setLineDash([]);\n    ctx.fillStyle = '#ff3b30';\n    ctx.font = '500 11px JetBrains Mono'; ctx.textAlign='center';\n    ctx.fillText('α_crit = 0.50', tx, padT+12);\n    ctx.fillStyle = '#5b6168'; ctx.textAlign='left'; ctx.fillText('INCONSCIENTE', padL+10, padT+12);\n    ctx.textAlign='right'; ctx.fillText('CONSCIENTE', padL+w-10, padT+12);\n\n    // points\n    states.forEach((s,i) => {\n      const reveal = Math.max(0, Math.min(1, revealT*states.length - i));\n      if (reveal <= 0) return;\n      const x = padL + (s.a)*w;\n      ctx.fillStyle = s.c;\n      ctx.globalAlpha = reveal;\n      ctx.beginPath(); ctx.arc(x, ay, 8 + Math.sin(t*0.003 + i)*2, 0, Math.PI*2); ctx.fill();\n      ctx.globalAlpha = reveal*0.3;\n      ctx.beginPath(); ctx.arc(x, ay, 22, 0, Math.PI*2); ctx.fill();\n      ctx.globalAlpha = reveal;\n      // stem up to label\n      ctx.strokeStyle = s.c; ctx.lineWidth = 1;\n      const labelY = padT + 30 + (i%2)*18;\n      ctx.beginPath(); ctx.moveTo(x, ay-12); ctx.lineTo(x, labelY+4); ctx.stroke();\n      ctx.fillStyle = '#e6e8ea'; ctx.font = '500 12px JetBrains Mono'; ctx.textAlign='center';\n      ctx.fillText(s.name, x, labelY);\n      ctx.fillStyle = s.c; ctx.font = '600 14px JetBrains Mono';\n      ctx.fillText(`α = ${s.a.toFixed(2)}`, x, ay+52);\n      ctx.globalAlpha = 1;\n    });\n  });\n}\n\n/* ----- SLIDE 8: α × R² scatter plane ----- */\nfunction setupPlane(){\n  const cv = document.getElementById('plane-canvas'); if (!cv) return;\n  const ctx = cv.getContext('2d');\n  const W = cv.width, H = cv.height;\n  const buttons = document.querySelectorAll('.plane-toggle');\n  const enabled = {conscious:true, seizure:true, closed:true};\n  buttons.forEach(b => b.addEventListener('click', () => {\n    enabled[b.dataset.cls] = !enabled[b.dataset.cls];\n    b.classList.toggle('on');\n  }));\n\n  // generate cluster points (deterministic with simple seeded RNG)\n  let seed = 17;\n  function rand(){ seed = (seed*1664525 + 1013904223) >>> 0; return (seed>>>8)/16777216; }\n  function gauss(mean, sd){ let u=0,v=0; while(u===0)u=rand(); while(v===0)v=rand(); return mean + sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }\n  const pts = [];\n  for (let i=0;i<260;i++) pts.push({cls:'conscious', a:gauss(0.72, 0.08), r:gauss(0.86, 0.06)});\n  for (let i=0;i<180;i++) pts.push({cls:'seizure',    a:gauss(0.38, 0.18), r:gauss(0.42, 0.14)});\n  for (let i=0;i<200;i++) pts.push({cls:'closed',     a:gauss(0.58, 0.10), r:gauss(0.68, 0.10)});\n  const COLORS = {conscious:'#34d188', seizure:'#ff3b30', closed:'#3aa0ff'};\n  const padL=70, padR=40, padT=50, padB=60;\n  const w = W-padL-padR, h = H-padT-padB;\n  let reveal = 0;\n  return rafLoop((t) => {\n    reveal = Math.min(1, reveal + 0.008);\n    ctx.clearRect(0,0,W,H);\n    // grid\n    ctx.strokeStyle = 'rgba(255,255,255,0.05)';\n    for (let i=0;i<=10;i++){\n      const x = padL + (i/10)*w; const y = padT + (i/10)*h;\n      ctx.beginPath(); ctx.moveTo(x,padT); ctx.lineTo(x,padT+h); ctx.stroke();\n      ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+w,y); ctx.stroke();\n    }\n    // axes\n    ctx.fillStyle = '#5b6168'; ctx.font = '11px JetBrains Mono'; ctx.textAlign='center';\n    for (let i=0;i<=10;i++){\n      ctx.fillText((i/10).toFixed(1), padL+(i/10)*w, padT+h+18);\n    }\n    ctx.textAlign='right';\n    for (let i=0;i<=10;i++){\n      ctx.fillText((1-i/10).toFixed(1), padL-8, padT+(i/10)*h+4);\n    }\n    // boundary curve α*R² = 0.45\n    ctx.strokeStyle = 'rgba(255,255,255,0.35)';\n    ctx.setLineDash([4,6]); ctx.lineWidth = 1.4;\n    ctx.beginPath();\n    for (let i=0;i<=100;i++){\n      const a = i/100;\n      const r = 0.45 / Math.max(a, 0.01);\n      if (r < 0 || r > 1) continue;\n      const sx = padL + a*w;\n      const sy = padT + (1-r)*h;\n      if (i===0) ctx.moveTo(sx,sy); else ctx.lineTo(sx,sy);\n    }\n    ctx.stroke();\n    ctx.setLineDash([]);\n    ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.font='10px JetBrains Mono'; ctx.textAlign='left';\n    ctx.fillText('α × R² = 0.45 · FRONTERA', padL+w-180, padT+30);\n\n    // points\n    const maxShow = Math.floor(pts.length * reveal);\n    for (let i=0;i<maxShow;i++){\n      const p = pts[i];\n      if (!enabled[p.cls]) continue;\n      const sx = padL + Math.max(0,Math.min(1,p.a))*w;\n      const sy = padT + (1-Math.max(0,Math.min(1,p.r)))*h;\n      ctx.fillStyle = COLORS[p.cls];\n      ctx.globalAlpha = 0.7;\n      ctx.beginPath(); ctx.arc(sx,sy, 3.2, 0, Math.PI*2); ctx.fill();\n    }\n    ctx.globalAlpha = 1;\n  });\n}\n\n/* ----- SLIDE 9: density curves ----- */\nfunction setupDensity(){\n  const cv = document.getElementById('density-canvas'); if (!cv) return;\n  const ctx = cv.getContext('2d');\n  const W = cv.width, H = cv.height;\n  let reveal = 0;\n  function curve(mean, sd, scale){\n    const arr = new Array(W);\n    for (let x=0;x<W;x++){\n      const b = -4 + (x/W)*3; // x from -4 to -1 in β\n      const v = Math.exp(-0.5*Math.pow((b-mean)/sd,2)) / (sd*Math.sqrt(2*Math.PI));\n      arr[x] = v*scale;\n    }\n    return arr;\n  }\n  return rafLoop((t) => {\n    reveal = Math.min(1, reveal + 0.012);\n    ctx.clearRect(0,0,W,H);\n    // axis\n    ctx.strokeStyle = 'rgba(255,255,255,0.08)';\n    ctx.beginPath(); ctx.moveTo(0,H-30); ctx.lineTo(W,H-30); ctx.stroke();\n    ctx.fillStyle='#5b6168'; ctx.font='10px JetBrains Mono'; ctx.textAlign='center';\n    for (let i=0;i<=6;i++){\n      const x = (i/6)*W;\n      const b = -4 + (i/6)*3;\n      ctx.fillText('β=' + b.toFixed(1), x, H-12);\n    }\n    // wake curve (cool)\n    const wake = curve(-2.10, 0.55, 120);\n    const unc  = curve(-2.84, 0.45, 120);\n    function fillCurve(arr, color, fillAlpha){\n      ctx.beginPath();\n      ctx.moveTo(0, H-30);\n      for (let x=0;x<W;x++){\n        const tt = Math.min(1, reveal*1.6 - x/W);\n        const y = H-30 - (arr[x]||0)*Math.max(0,tt);\n        ctx.lineTo(x, y);\n      }\n      ctx.lineTo(W, H-30); ctx.closePath();\n      ctx.fillStyle = color + Math.round(fillAlpha*255).toString(16).padStart(2,'0');\n      ctx.fill();\n      // stroke\n      ctx.beginPath();\n      for (let x=0;x<W;x++){\n        const tt = Math.min(1, reveal*1.6 - x/W);\n        const y = H-30 - (arr[x]||0)*Math.max(0,tt);\n        if (x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);\n      }\n      ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();\n    }\n    fillCurve(wake, '#3aa0ff', 0.25);\n    fillCurve(unc,  '#ff3b30', 0.25);\n    // overlap region\n    ctx.fillStyle='rgba(255,255,255,0.05)';\n    // separation marker\n    const sepX = ((((-2.10 + -2.84)/2) - (-4))/3)*W;\n    ctx.strokeStyle='rgba(255,255,255,0.4)';\n    ctx.setLineDash([4,4]);\n    ctx.beginPath(); ctx.moveTo(sepX, 8); ctx.lineTo(sepX, H-30); ctx.stroke();\n    ctx.setLineDash([]);\n    ctx.fillStyle='#9aa0a6'; ctx.textAlign='center'; ctx.font='10px JetBrains Mono';\n    ctx.fillText('d = 0.46', sepX, 18);\n  });\n}\n\n/* ----- SLIDE 10: REM 2D ----- */\nfunction setupRem(){\n  const cv = document.getElementById('rem-canvas'); if (!cv) return;\n  const ctx = cv.getContext('2d');\n  const W = cv.width, H = cv.height;\n  let phase = 0;\n  return rafLoop((t)=>{\n    phase = t*0.0005;\n    ctx.clearRect(0,0,W,H);\n    const padL=70, padR=50, padT=60, padB=60;\n    const w=W-padL-padR, h=H-padT-padB;\n    // grid\n    ctx.strokeStyle = 'rgba(255,255,255,0.05)';\n    for (let i=0;i<=10;i++){\n      const x=padL+(i/10)*w; const y=padT+(i/10)*h;\n      ctx.beginPath(); ctx.moveTo(x,padT); ctx.lineTo(x,padT+h); ctx.stroke();\n      ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+w,y); ctx.stroke();\n    }\n    ctx.fillStyle='#5b6168'; ctx.font='10px JetBrains Mono';\n    ctx.textAlign='center';\n    ctx.fillText('α baja (pronunciada) ← α (pendiente suave) → α alta', padL+w/2, padT+h+30);\n    ctx.save(); ctx.translate(18, padT+h/2); ctx.rotate(-Math.PI/2);\n    ctx.fillText('R² bajo ← R² (calidad de ley de potencia) → R² alto', 0, 0); ctx.restore();\n    // axis labels\n    // three blobs\n    function blob(cx, cy, color, label, sub, pulse){\n      const px = padL + cx*w, py = padT + (1-cy)*h;\n      const radius = 60 + Math.sin(phase*2 + pulse)*4;\n      const grd = ctx.createRadialGradient(px,py,0,px,py,radius);\n      grd.addColorStop(0, color + 'aa');\n      grd.addColorStop(1, color + '00');\n      ctx.fillStyle = grd;\n      ctx.beginPath(); ctx.arc(px,py,radius,0,Math.PI*2); ctx.fill();\n      // scatter points\n      for (let i=0;i<30;i++){\n        const a = (i/30)*Math.PI*2 + phase + pulse;\n        const r = 18 + Math.sin(i*3.1+phase)*16;\n        const ox = px + Math.cos(a)*r;\n        const oy = py + Math.sin(a)*r;\n        ctx.fillStyle = color;\n        ctx.globalAlpha = 0.6;\n        ctx.beginPath(); ctx.arc(ox,oy,2.5,0,Math.PI*2); ctx.fill();\n      }\n      ctx.globalAlpha = 1;\n      ctx.fillStyle = '#fff'; ctx.font='600 22px Space Grotesk';\n      ctx.textAlign = 'center';\n      ctx.fillText(label, px, py - 70);\n      ctx.fillStyle = color; ctx.font='11px JetBrains Mono';\n      ctx.fillText(sub, px, py - 50);\n    }\n    blob(0.78, 0.85, '#34d188', 'VIGILIA', 'α alta · R² alto', 0);\n    blob(0.24, 0.78, '#b07cff', 'REM', 'α baja · R² ALTO ★', 1.2);\n    blob(0.22, 0.25, '#ff3b30', 'NREM', 'α baja · R² bajo', 2.4);\n    // separator hint\n    ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.setLineDash([3,5]);\n    ctx.beginPath(); ctx.moveTo(padL, padT+h*0.5); ctx.lineTo(padL+w, padT+h*0.5); ctx.stroke();\n    ctx.setLineDash([]);\n    ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.font='10px JetBrains Mono'; ctx.textAlign='left';\n    ctx.fillText('UMBRAL R² · ESTRUCTURA INTACTA ARRIBA', padL+8, padT+h*0.5-6);\n  });\n}\n\n/* ----- SLIDE 12: closing instrument ----- */\nfunction setupClosing(){\n  const cv = document.getElementById('closing-canvas'); if (!cv) return;\n  const ctx = cv.getContext('2d');\n  const W = cv.width, H = cv.height;\n  return rafLoop((t) => {\n    ctx.clearRect(0,0,W,H);\n    const cx = W/2, cy = H/2;\n    const N = 64;\n    for (let i=0;i<N;i++){\n      const a = (i/N)*Math.PI*2 + t*0.0003;\n      const r1 = 80 + Math.sin(t*0.001 + i*0.3)*30;\n      const r2 = r1 + 60 + Math.sin(t*0.002 + i*0.2)*30;\n      const x1 = cx + Math.cos(a)*r1, y1 = cy + Math.sin(a)*r1;\n      const x2 = cx + Math.cos(a)*r2, y2 = cy + Math.sin(a)*r2;\n      const v = (Math.sin(i*0.4 + t*0.001)+1)/2;\n      ctx.strokeStyle = v > 0.6 ? '#3aa0ff' : (v > 0.3 ? '#9aa0a6' : '#5b6168');\n      ctx.globalAlpha = 0.4 + v*0.5;\n      ctx.lineWidth = 1.2;\n      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();\n    }\n    ctx.globalAlpha = 1;\n    // center crosshair\n    ctx.strokeStyle='#e6e8ea';\n    ctx.beginPath(); ctx.arc(cx,cy, 6, 0, Math.PI*2); ctx.stroke();\n    ctx.beginPath(); ctx.moveTo(cx-14,cy); ctx.lineTo(cx-9,cy); ctx.moveTo(cx+9,cy); ctx.lineTo(cx+14,cy);\n    ctx.moveTo(cx,cy-14); ctx.lineTo(cx,cy-9); ctx.moveTo(cx,cy+9); ctx.lineTo(cx,cy+14); ctx.stroke();\n  });\n}\n\n/* ============================================================\n   Wire animation lifecycle to slide changes\n   ============================================================ */\nconst starters = {\n  0: startCoverHeatmap,\n  1: startEegTrace,\n  3: () => null,  // s1 chart sets itself up + updates on input\n  4: setupS2Cascade,\n  5: setupStateAxis,\n  7: setupPlane,\n  8: setupDensity,\n  9: setupRem,\n  11: setupClosing,\n};\n\nfunction activate(index){\n  // stop all\n  for (const [k, stop] of activeRunners) { try{stop && stop();}catch(e){} }\n  activeRunners.clear();\n  currentIndex = index;\n  const fn = starters[index];\n  if (fn){\n    const stop = fn();\n    if (stop) activeRunners.set(index, stop);\n  }\n}\n\n// Setup non-animated interactive content once on load\nwindow.addEventListener('load', () => {\n  setupS1Chart();\n  // initial activation\n  setTimeout(() => activate(0), 50);\n});\n\ndocument.addEventListener('slidechange', (e) => {\n  activate(e.detail.index);\n});\n<\/script>\n\n\n</body></html>"
  </script>
