  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

     <div class=\"test\"><span class=\"arrow\">▸<\u002Fspan>OBS: precisi\u00f3n de perturbaci\u00f3n lineal<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"bottom-chrome\">\n    <span class=\"seg solid\">FALSIFICABLE<\u002Fspan>\n    <span>// TRES NAVAJAS, TODAS VERIFICABLES AHORA<\u002Fspan>\n    <span class=\"dashline\"><\u002Fspan>\n    <span class=\"arrow\">▸<\u002Fspan><span>SIG. // CIERRE<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================================================ SLIDE 10 / CLOSING ============================================================ -->\n<section class=\"slide\" data-screen-label=\"10 Closing\">\n  <div class=\"corner-mark tl\"><\u002Fdiv><div class=\"corner-mark tr\"><\u002Fdiv>\n  <div class=\"corner-mark bl\"><\u002Fdiv><div class=\"corner-mark br\"><\u002Fdiv>\n\n  <div class=\"top-chrome\">\n    <span class=\"dot\"><\u002Fspan><span>EVENTO 10<\u002Fspan><span>RESUMEN EJECUTIVO // CAPA COMPLETA<\u002Fspan>\n    <span class=\"grow\"><\u002Fspan><span class=\"pill solid\">ENV\u00cdO // 004<\u002Fspan>\n  <\u002Fdiv>\n\n  <div class=\"slide-eyebrow\"><span class=\"num\">10<\u002Fspan><span class=\"bar\"><\u002Fspan><span>CAPA COMPLETA<\u002Fspan><\u002Fdiv>\n\n  <h1 class=\"s10-headline\">Un exponente.<br><em>Una aceleraci\u00f3n.<\u002Fem><br>El universo, a tiempo.<\u002Fh1>\n\n  <div class=\"s10-grid\">\n    <div class=\"c\">\n      <div class=\"lbl\">// LA LEY<\u002Fdiv>\n      <div class=\"v\">T ∝ L<sup style=\"font-size:42px;color:var(--orange)\">α<\u002Fsup><\u002Fdiv>\n      <div class=\"desc\">El tiempo es funci\u00f3n de la geometr\u00eda, no al rev\u00e9s.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"c solid\">\n      <div class=\"lbl\">// EL FACTOR<\u002Fdiv>\n      <div class=\"v\">A ≈ 20 –37×<\u002Fdiv>\n      <div class=\"desc\">En z = 10, los relojes mesoscópicos corren 20–37× más rápido. Cota superior EdS, ΛCDM realista.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"c\">\n      <div class=\"lbl\">// LA EVIDENCIA<\u002Fdiv>\n      <div class=\"v orange\">α = 1.16<span style=\"font-size:22px;color:var(--ink-dim);margin-left:4px\">±0.08<\u002Fspan><\u002Fdiv>\n      <div class=\"desc\">55 galaxias JWST, Monte Carlo corregido por sesgo. p &lt; 10⁻⁶.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"c\">\n      <div class=\"lbl\">// LA SEGURIDAD<\u002Fdiv>\n      <div class=\"v\">BBN ✓<br>CMB ✓<\u002Fdiv>\n      <div class=\"desc\">α inactivo en plasma homog\u00e9neo. Sin da\u00f1o al fondo.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"bottom-chrome\">\n    <span class=\"seg solid\">EVENTO // 10 / 10<\u002Fspan>\n    <span>NOTA 004 // REESCALAMIENTO TEMPORAL // Á. QUICENO<\u002Fspan>\n    <span class=\"dashline\"><\u002Fspan>\n    <span class=\"arrow\">▸<\u002Fspan><span>BUCLE // REINICIAR<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdeck-stage>\n\n<script>\n/* ===================================================================\n   Apply .active to currently visible slide so entry transitions trigger.\n   The <deck-stage> shows one section at a time; we observe via parent message + initial DOM.\n=================================================================== */\n(function(){\n  function syncActive(){\n    const stage = document.querySelector('deck-stage');\n    if(!stage) return;\n    const slides = stage.querySelectorAll('section.slide');\n    // deck-stage sets aria-hidden / hidden on inactive slides\n    slides.forEach(s=>{\n      const hidden = s.hasAttribute('hidden') || getComputedStyle(s).display==='none' || s.getAttribute('aria-hidden')==='true';\n      s.classList.toggle('active', !hidden);\n    });\n  }\n  window.addEventListener('load', syncActive);\n  // re-sync on slide changes (deck-stage posts slideIndexChanged)\n  window.addEventListener('message', (e)=>{\n    if(e.data && e.data.slideIndexChanged !== undefined) setTimeout(syncActive, 30);\n  });\n  // also poll every 400ms for robustness\n  setInterval(syncActive, 400);\n})();\n\n/* ===================================================================\n   Slide 2 — JWST anomaly map\n=================================================================== */\n(function(){\n  const map = document.getElementById('anomaly-map');\n  if(!map) return;\n  const tip = document.getElementById('anomaly-tip');\n  // mock catalog of 55 galaxies seeded for repeatability\n  function seedrandom(seed){let s=seed;return ()=>{s=(s*9301+49297)%233280;return s/233280}}\n  const rng = seedrandom(7);\n\n  const catalog = [];\n  const surveys = ['JADES','CEERS','UNCOVER','GLASS','Labbé+'];\n  for(let i=0;i<55;i++){\n    const z = 6 + rng()*10.4;        // 6..16.4\n    const logM = 7 + rng()*3.5;       // 10^7..10^10.5\n    // ceiling: ΛCDM expected log M ≈ 10.5 - 0.4*(z-6)\n    const ceiling = 10.5 - 0.30*(z-6);\n    const exceed = logM > ceiling;\n    catalog.push({\n      id:'G-'+String(1000+i).slice(-3),\n      z:+z.toFixed(2),\n      logM:+logM.toFixed(2),\n      survey:surveys[i%surveys.length],\n      exceed\n    });\n  }\n\n  // Project onto map area (chart inner area)\n  const padL = 60, padR = 24, padT = 24, padB = 42;\n  // map dimensions (in % of map element)\n  catalog.forEach((g, i)=>{\n    const x = (g.z - 6) / (16.4 - 6); // 0..1\n    const y = (g.logM - 7) / (10.5 - 7); // 0..1\n    const dot = document.createElement('div');\n    dot.className = 'gal' + (g.exceed?' exceed':'');\n    dot.style.left = `calc(${padL}px + (100% - ${padL+padR}px) * ${x})`;\n    dot.style.bottom = `calc(${padB}px + (100% - ${padT+padB}px) * ${y})`;\n    dot.style.transitionDelay = (i*15) + 'ms';\n    dot.dataset.id = g.id;\n    dot.dataset.z = g.z;\n    dot.dataset.lm = g.logM;\n    dot.dataset.survey = g.survey;\n    dot.dataset.exceed = g.exceed?'1':'0';\n    map.appendChild(dot);\n    dot.addEventListener('mouseenter', (e)=>{\n      tip.innerHTML = `<span class=\"k\">ID<\u002Fspan> <span class=\"v\">${g.id}<\u002Fspan> &nbsp; <span class=\"k\">z<\u002Fspan> <span class=\"v\">${g.z}<\u002Fspan> &nbsp; <span class=\"k\">log M⋆<\u002Fspan> <span class=\"v\">${g.logM}<\u002Fspan> &nbsp; <span class=\"k\">/<\u002Fspan> ${g.survey}`;\n      tip.style.display = 'block';\n    });\n    dot.addEventListener('mousemove', (e)=>{\n      const r = map.getBoundingClientRect();\n      tip.style.left = (e.clientX - r.left + 14) + 'px';\n      tip.style.top  = (e.clientY - r.top + 14 + 380) + 'px'; // 380 is offset of map from page top\n    });\n    dot.addEventListener('mouseleave', ()=> tip.style.display='none');\n  });\n\n  // Filter\n  document.querySelectorAll('.anomaly-side .filter button').forEach(btn=>{\n    btn.addEventListener('click', ()=>{\n      document.querySelectorAll('.anomaly-side .filter button').forEach(b=>b.classList.remove('active'));\n      btn.classList.add('active');\n      const f = btn.dataset.filter;\n      map.querySelectorAll('.gal').forEach(d=>{\n        const ex = d.dataset.exceed==='1';\n        if(f==='all') d.dataset.show='show';\n        else if(f==='exceed') d.dataset.show = ex?'show':'hide';\n        else d.dataset.show = !ex?'show':'hide';\n      });\n    });\n  });\n})();\n\n/* ===================================================================\n   Slide 3 — T ∝ L^α  (two curves, slider drives α)\n=================================================================== */\n(function(){\n  const canvas = document.getElementById('s3-canvas');\n  if(!canvas) return;\n  const ctx = canvas.getContext('2d');\n  const slider = document.getElementById('s3-alpha');\n  const valEl = document.getElementById('s3-alphav');\n  const stretchEl = document.getElementById('s3-stretch');\n  const classEl = document.getElementById('s3-class');\n  const regimeEl = document.getElementById('s3-regime');\n  const regimes = [...document.querySelectorAll('#s3-regimes span')];\n\n  function regimeFor(a){\n    for(const r of regimes){\n      const min = parseFloat(r.dataset.min), max = parseFloat(r.dataset.max);\n      if(a>=min && a<=max){\n        return {label: r.textContent.split('//')[1].trim(), node: r};\n      }\n    }\n    return {label:'TRANSITIONAL', node:null};\n  }\n\n  function draw(){\n    const a = parseFloat(slider.value);\n    valEl.textContent = a.toFixed(2);\n    const w = canvas.width, h = canvas.height;\n    ctx.clearRect(0,0,w,h);\n\n    // axes\n    ctx.strokeStyle = '#3B3935'; ctx.lineWidth = 1;\n    ctx.beginPath();\n    ctx.moveTo(50, h-30); ctx.lineTo(w-20, h-30);\n    ctx.moveTo(50, h-30); ctx.lineTo(50, 20);\n    ctx.stroke();\n    ctx.font = '10px JetBrains Mono';\n    ctx.fillStyle = '#5A5751';\n    ctx.fillText('L →', w-40, h-14);\n    ctx.save();\n    ctx.translate(20, 30); ctx.rotate(-Math.PI/2);\n    ctx.fillText('← T', 0, 0);\n    ctx.restore();\n\n    // L grid\n    for(let i=1;i<=10;i++){\n      const x = 50 + (w-70)*(i/10);\n      ctx.beginPath();\n      ctx.moveTo(x, h-30); ctx.lineTo(x, h-26);\n      ctx.strokeStyle='#3B3935';\n      ctx.stroke();\n    }\n\n    // T_max for normalization\n    const Tmax = Math.pow(10, a);\n\n    // dim reference: linear (α=1)\n    ctx.strokeStyle = 'rgba(155,151,141,0.35)';\n    ctx.setLineDash([3,4]); ctx.lineWidth = 1.5;\n    ctx.beginPath();\n    for(let L=1;L<=10;L+=0.05){\n      const T = Math.pow(L,1);\n      const x = 50 + (w-70)*((L-1)/9);\n      const y = (h-30) - (h-50) * (T/Math.max(Tmax, 10));\n      if(L===1) ctx.moveTo(x,y); else ctx.lineTo(x,y);\n    }\n    ctx.stroke();\n    ctx.setLineDash([]);\n\n    // main curve\n    ctx.strokeStyle = '#E0543A'; ctx.lineWidth = 2.5;\n    ctx.beginPath();\n    for(let L=1;L<=10;L+=0.05){\n      const T = Math.pow(L,a);\n      const x = 50 + (w-70)*((L-1)/9);\n      const y = (h-30) - (h-50) * (T/Math.max(Tmax, 10));\n      if(L===1) ctx.moveTo(x,y); else ctx.lineTo(x,y);\n    }\n    ctx.stroke();\n    // dot at L=10\n    {\n      const T = Math.pow(10,a);\n      const x = 50 + (w-70)*((10-1)/9);\n      const y = (h-30) - (h-50) * (T/Math.max(Tmax,10));\n      ctx.fillStyle='#E0543A';\n      ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.fill();\n      ctx.fillStyle='#EDE9E0'; ctx.font='11px JetBrains Mono';\n      ctx.fillText('T = ' + (Tmax>=100?Tmax.toExponential(1):Tmax.toFixed(1)), x-90, y-14);\n    }\n\n    // update readouts\n    const stretch = Math.pow(10,a);\n    stretchEl.innerHTML = (stretch>=1000?stretch.toExponential(1):stretch.toFixed(stretch<10?2:0)) + '<span style=\"font-size:24px;color:var(--ink-dim);vertical-align:top;margin-left:4px\">×<\u002Fspan>';\n    const r = regimeFor(a);\n    classEl.textContent = r.label;\n    regimeEl.textContent = r.label;\n    regimes.forEach(rr=>rr.classList.remove('active'));\n    if(r.node) r.node.classList.add('active');\n  }\n  slider.addEventListener('input', draw);\n  draw();\n})();\n\n/* ===================================================================\n   Slide 4 — Acceleration factor live readout + mini chart\n=================================================================== */\n(function(){\n  const Z = document.getElementById('s4-z'), A = document.getElementById('s4-alpha');\n  if(!Z) return;\n  const zv = document.getElementById('s4-zv'), av = document.getElementById('s4-alphav');\n  const zlbl = document.getElementById('s4-zlbl'), alphalbl = document.getElementById('s4-alphalbl');\n  const Abig = document.getElementById('s4-A'), Aeds = document.getElementById('s4-Aeds');\n  const ageEl = document.getElementById('s4-age');\n  const canvas = document.getElementById('s4-chart');\n  const ctx = canvas.getContext('2d');\n\n  // Planck-ish ΛCDM\n  const Om = 0.315, OL = 0.685;\n  function H_ratio(z){ return Math.sqrt(Om*Math.pow(1+z,3) + OL); }\n  function H_eds(z){ return Math.pow(1+z, 1.5); }\n  function ageGyr(z){\n    // crude: t(z) ≈ (2/3)/H0 * 1/(Om*(1+z)^3+OL)^(1/2) * approx\n    // Use a fitting table-like form: 13.8 / (1+z)^a  ; better: cosmo integral approx\n    // We'll just interpolate known values\n    const ref = {0:13.8, 5:1.17, 7:0.76, 10:0.47, 12:0.37, 15:0.27, 20:0.18};\n    const keys = Object.keys(ref).map(Number).sort((a,b)=>a-b);\n    for(let i=0;i<keys.length-1;i++){\n      if(z>=keys[i] && z<=keys[i+1]){\n        const t = (z-keys[i])/(keys[i+1]-keys[i]);\n        return ref[keys[i]]*(1-t) + ref[keys[i+1]]*t;\n      }\n    }\n    return ref[20];\n  }\n\n  function fmt(v){\n    if(v>=1000) return v.toExponential(1);\n    if(v>=100) return v.toFixed(0);\n    return v.toFixed(1);\n  }\n\n  function drawChart(currentZ, currentA){\n    const w=canvas.width, h=canvas.height;\n    ctx.clearRect(0,0,w,h);\n\n    // axes\n    ctx.strokeStyle='#2A2926'; ctx.lineWidth=1;\n    ctx.beginPath();\n    ctx.moveTo(40,h-22); ctx.lineTo(w-10,h-22);\n    ctx.moveTo(40,10); ctx.lineTo(40,h-22);\n    ctx.stroke();\n\n    // labels\n    ctx.fillStyle='#5A5751'; ctx.font='9px JetBrains Mono';\n    [0,5,10,15,20].forEach(zz=>{\n      const x = 40 + (w-50)*(zz/20);\n      ctx.fillText('z='+zz, x-8, h-8);\n    });\n\n    // log scale for A: cap 1..150\n    const maxA = 150;\n    function yFor(A){ return h-22 - (h-32) * (Math.log10(Math.max(1,A))/Math.log10(maxA)); }\n\n    // ΛCDM curve at slider α (dim)\n    ctx.strokeStyle='rgba(155,151,141,0.4)'; ctx.lineWidth=1.5; ctx.setLineDash([3,3]);\n    ctx.beginPath();\n    for(let zz=0;zz<=20;zz+=0.2){\n      const A = Math.pow(H_eds(zz), currentA);\n      const x = 40 + (w-50)*(zz/20); const y = yFor(A);\n      if(zz===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);\n    }\n    ctx.stroke();\n    ctx.setLineDash([]);\n\n    // ΛCDM solid\n    ctx.strokeStyle='#E0543A'; ctx.lineWidth=2;\n    ctx.beginPath();\n    for(let zz=0;zz<=20;zz+=0.2){\n      const A = Math.pow(H_ratio(zz), currentA);\n      const x = 40 + (w-50)*(zz/20); const y = yFor(A);\n      if(zz===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);\n    }\n    ctx.stroke();\n\n    // marker at currentZ\n    const Acur = Math.pow(H_ratio(currentZ), currentA);\n    const x = 40 + (w-50)*(currentZ/20);\n    const y = yFor(Acur);\n    ctx.strokeStyle='#E0543A'; ctx.setLineDash([2,3]); ctx.lineWidth=1;\n    ctx.beginPath(); ctx.moveTo(x,h-22); ctx.lineTo(x,y); ctx.stroke();\n    ctx.setLineDash([]);\n    ctx.fillStyle='#E0543A';\n    ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.fill();\n  }\n\n  function update(){\n    const z = parseFloat(Z.value), a = parseFloat(A.value);\n    zv.textContent = z.toFixed(1);\n    av.textContent = a.toFixed(2);\n    zlbl.textContent = z.toFixed(1);\n    alphalbl.textContent = a.toFixed(2);\n    const Avalue = Math.pow(H_ratio(z), a);\n    const AEdS = Math.pow(H_eds(z), a);\n    Abig.innerHTML = fmt(Avalue) + '<span class=\"x\">×<\u002Fspan>';\n    Aeds.textContent = fmt(AEdS) + '×';\n    ageEl.textContent = ageGyr(z).toFixed(2) + ' Gyr';\n    drawChart(z, a);\n  }\n  Z.addEventListener('input', update);\n  A.addEventListener('input', update);\n  update();\n})();\n\n/* ===================================================================\n   Slide 5 — A(z) table\n=================================================================== */\n(function(){\n  const t = document.getElementById('s5-table');\n  if(!t) return;\n  const rows = [\n    {z:5, age:'1.17 Gyr', eds:14.7, lcdm:8.3},\n    {z:7, age:'0.76 Gyr', eds:22.6, lcdm:12.7},\n    {z:10, age:'0.47 Gyr', eds:36.5, lcdm:20.5},\n    {z:12, age:'0.37 Gyr', eds:46.9, lcdm:26.3},\n    {z:15, age:'0.27 Gyr', eds:64.0, lcdm:35.9},\n    {z:20, age:'0.18 Gyr', eds:96.2, lcdm:54.0},\n  ];\n  const maxV = 100;\n  rows.forEach((r,i)=>{\n    const div = document.createElement('div');\n    div.className='row';\n    div.innerHTML = `\n      <span class=\"z\">${r.z}<\u002Fspan>\n      <span class=\"age\">${r.age}<\u002Fspan>\n      <span class=\"v eds\"><span class=\"bar\" style=\"width:${(r.eds/maxV)*240}px\"><\u002Fspan>${r.eds.toFixed(1)}×<\u002Fspan>\n      <span class=\"v\"><span class=\"bar\" style=\"width:${(r.lcdm/maxV)*240}px\"><\u002Fspan>${r.lcdm.toFixed(1)}×<\u002Fspan>\n    `;\n    t.appendChild(div);\n    // entry animation\n    div.style.opacity=0; div.style.transform='translateX(-20px)';\n    div.style.transition=`opacity 400ms ease ${i*70}ms, transform 400ms ease ${i*70}ms`;\n    requestAnimationFrame(()=>{ setTimeout(()=>{ div.style.opacity=1; div.style.transform='translateX(0)'; }, 80) });\n  });\n})();\n\n/* ===================================================================\n   Slide 6 — Galaxy assembly interactive\n=================================================================== */\n(function(){\n  const mh = document.getElementById('s6-mh'), ms = document.getElementById('s6-ms'), eps = document.getElementById('s6-eps'), zE = document.getElementById('s6-z');\n  if(!mh) return;\n  const mhV = document.getElementById('s6-mhv'), msV = document.getElementById('s6-msv'), epsV = document.getElementById('s6-epsv'), zV = document.getElementById('s6-zv');\n  const areqEl = document.getElementById('s6-areq'), areqBar = document.getElementById('s6-areqbar');\n  const aavailEl = document.getElementById('s6-aavail'), aavailBar = document.getElementById('s6-aavailbar');\n  const ndynEl = document.getElementById('s6-ndyn'), ndynBar = document.getElementById('s6-ndynbar');\n  const verdictEl = document.getElementById('s6-verdict');\n  const sfelblEl = document.getElementById('s6-sfelbl');\n  const canvas = document.getElementById('s6-canvas'); const ctx = canvas.getContext('2d');\n  const fb = 0.157;\n  const Om = 0.315, OL = 0.685;\n\n  function age(z){\n    const ref = {0:13.8, 5:1.17, 7:0.76, 10:0.47, 12:0.37, 15:0.27, 20:0.18};\n    const k = Object.keys(ref).map(Number).sort((a,b)=>a-b);\n    for(let i=0;i<k.length-1;i++){\n      if(z>=k[i]&&z<=k[i+1]){ const t=(z-k[i])/(k[i+1]-k[i]); return ref[k[i]]*(1-t)+ref[k[i+1]]*t }\n    }\n    return 0.18;\n  }\n  function H_ratio(z){return Math.sqrt(Om*Math.pow(1+z,3)+OL)}\n\n  function update(){\n    const Mh = Math.pow(10, parseFloat(mh.value));\n    const Ms = Math.pow(10, parseFloat(ms.value));\n    const e = parseFloat(eps.value);\n    const z = parseFloat(zE.value);\n    mhV.textContent = parseFloat(mh.value).toFixed(2);\n    msV.textContent = parseFloat(ms.value).toFixed(2);\n    epsV.textContent = (e*100).toFixed(1)+'%';\n    zV.textContent = z.toFixed(1);\n\n    const dt = age(z) * 1000; // Myr\n    const tdyn = 0.1 / H_ratio(z) * (1/(0.069)) * 1000 * 0.001; // crude scale → Myr; we approximate using ref\n    // Use the worked example: at z=14, t_dyn ≈ 44 Myr; scale by 1/H ratio normalized\n    const Href14 = H_ratio(14);\n    const tdyn_approx = 44 * (Href14 / H_ratio(z)); // Myr\n    const N = Math.max(1, dt / tdyn_approx);\n    const target = Math.min(0.99, Ms / (fb * Mh));\n    let Areq;\n    if(target>=1) Areq = 999;\n    else Areq = (1/(e*N)) * Math.log(1/(1-target));\n    if(!isFinite(Areq) || Areq<0) Areq = 999;\n\n    // Aavailable at α=1, ΛCDM\n    const Aavail = H_ratio(z);\n\n    // SFE under RTM with A_avail\n    const SFE = 1 - Math.exp(-e * Aavail * N);\n\n    areqEl.textContent = Areq.toFixed(1);\n    aavailEl.textContent = Aavail.toFixed(1);\n    ndynEl.textContent = N.toFixed(1);\n    sfelblEl.textContent = (SFE*100).toFixed(1) + '%';\n\n    // bars normalized to 60 max\n    const maxBar = 60;\n    areqBar.style.width = Math.min(100, (Areq/maxBar)*100) + '%';\n    aavailBar.style.width = Math.min(100, (Aavail/maxBar)*100) + '%';\n    ndynBar.style.width = Math.min(100, (N/15)*100) + '%';\n\n    if(Areq <= Aavail){\n      verdictEl.textContent = 'SUFFICIENT';\n      verdictEl.classList.remove('fail');\n      verdictEl.style.color = 'var(--green)';\n    } else {\n      verdictEl.textContent = 'NEEDS α > 1';\n      verdictEl.style.color = 'var(--orange)';\n    }\n\n    // canvas: starbar showing time progress and mass accumulated\n    const w = canvas.width, h = canvas.height;\n    ctx.clearRect(0,0,w,h);\n    // baseline\n    ctx.strokeStyle='#2A2926';\n    ctx.beginPath(); ctx.moveTo(40,h-30); ctx.lineTo(w-20,h-30); ctx.stroke();\n    // standard curve (no A) and RTM curve\n    ctx.font='10px JetBrains Mono'; ctx.fillStyle='#5A5751';\n    ctx.fillText('0', 40, h-14); ctx.fillText('t_cosmic', w-50, h-14);\n    ctx.save(); ctx.translate(14,h-30); ctx.rotate(-Math.PI/2); ctx.fillText('M⋆', 0, 0); ctx.restore();\n\n    function plot(curve, color, dash){\n      ctx.strokeStyle=color; ctx.lineWidth=2; ctx.setLineDash(dash||[]);\n      ctx.beginPath();\n      for(let i=0;i<=100;i++){\n        const t = i/100; // 0..1 normalized cosmic time\n        const Neff = curve(t);\n        const sfe = 1 - Math.exp(-e * Neff);\n        const massFrac = sfe; // 0..1\n        const x = 40 + (w-60)*t;\n        const y = (h-30) - (h-50)*massFrac;\n        if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);\n      }\n      ctx.stroke();\n      ctx.setLineDash([]);\n    }\n    plot(t=> t*N, 'rgba(155,151,141,0.5)', [3,4]);  // std\n    plot(t=> t*N*Aavail, '#E0543A');                // RTM\n\n    // target line\n    ctx.strokeStyle='rgba(224,84,58,0.4)'; ctx.setLineDash([2,3]);\n    ctx.beginPath();\n    const ytgt = (h-30) - (h-50)*target;\n    ctx.moveTo(40,ytgt); ctx.lineTo(w-20,ytgt); ctx.stroke();\n    ctx.setLineDash([]);\n    ctx.fillStyle='#E0543A'; ctx.font='10px JetBrains Mono';\n    ctx.fillText('TARGET M⋆/fbMh = '+(target*100).toFixed(0)+'%', w-220, ytgt-6);\n    // legend\n    ctx.fillStyle='#9C988F'; ctx.fillText('— RTM (A·N)', w-220, 20);\n    ctx.fillStyle='#5A5751'; ctx.fillText('· · standard', w-220, 36);\n  }\n  [mh,ms,eps,zE].forEach(el=>el.addEventListener('input', update));\n  update();\n})();\n\n/* ===================================================================\n   Slide 8 — Monte Carlo histogram (animated build-up)\n=================================================================== */\n(function(){\n  const canvas = document.getElementById('s8-canvas');\n  if(!canvas) return;\n  const ctx = canvas.getContext('2d');\n  const runs = document.getElementById('s8-runs');\n\n  // Generate gaussian draws around mean 1.16, sd 0.08\n  function gauss(){ // Box-Muller\n    let u=0, v=0;\n    while(u===0) u = Math.random();\n    while(v===0) v = Math.random();\n    return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v);\n  }\n  const bins = 60;\n  const min = 0.6, max = 2.0;\n  const counts = new Array(bins).fill(0);\n  let N = 0;\n  const target = 10000;\n\n  function drawBars(){\n    const w = canvas.width, h = canvas.height;\n    ctx.clearRect(0,0,w,h);\n    // axis\n    ctx.strokeStyle='#2A2926';\n    ctx.beginPath(); ctx.moveTo(0,h-30); ctx.lineTo(w,h-30); ctx.stroke();\n\n    // bar widths\n    const bw = w/bins;\n    let maxC = 1; for(const c of counts) if(c>maxC) maxC=c;\n    for(let i=0;i<bins;i++){\n      const c = counts[i];\n      const hbar = (h-50) * (c/maxC);\n      const x = i*bw;\n      const xCenter = min + (i+0.5)*(max-min)/bins;\n      // colour based on distance from 1.16\n      const dist = Math.abs(xCenter - 1.16);\n      const isCore = dist < 0.18;\n      ctx.fillStyle = isCore ? '#E0543A' : '#5A5751';\n      if(xCenter > 1.0 - 0.02 && xCenter < 1.0 + 0.02){\n        ctx.fillStyle = '#9C988F';\n      }\n      ctx.fillRect(x+1, (h-30) - hbar, bw-2, hbar);\n    }\n\n    // vertical line at 1.0 (rejected ΛCDM)\n    const xAt = (v)=> ((v-min)/(max-min)) * w;\n    ctx.strokeStyle='#9C988F'; ctx.setLineDash([3,3]); ctx.lineWidth=1;\n    ctx.beginPath(); ctx.moveTo(xAt(1.0), 10); ctx.lineTo(xAt(1.0), h-30); ctx.stroke();\n    ctx.setLineDash([]);\n    ctx.fillStyle='#9C988F'; ctx.font='11px JetBrains Mono';\n    ctx.fillText('α = 1.0  ⊘  rejected', xAt(1.0)-150, 24);\n\n    // line at 1.16\n    ctx.strokeStyle='#E0543A'; ctx.lineWidth=1.5;\n    ctx.beginPath(); ctx.moveTo(xAt(1.16), 10); ctx.lineTo(xAt(1.16), h-30); ctx.stroke();\n    ctx.fillStyle='#E0543A';\n    ctx.fillText('α = 1.16 ± 0.08', xAt(1.16)+8, 24);\n  }\n\n  let running = false;\n  function step(){\n    if(N >= target){ runs.textContent = '▸ 10,000 RUNS'; return; }\n    const batch = 80;\n    for(let k=0;k<batch && N<target;k++){\n      let v = 1.16 + 0.08*gauss();\n      if(v<min) v=min; if(v>max) v=max;\n      const bi = Math.min(bins-1, Math.max(0, Math.floor((v-min)/(max-min)*bins)));\n      counts[bi]++;\n      N++;\n    }\n    runs.textContent = '▸ ' + N.toLocaleString() + ' EJECUCIONES';\n    drawBars();\n    if(N<target) requestAnimationFrame(step);\n  }\n\n  function start(){\n    if(running) return;\n    running = true;\n    N = 0; for(let i=0;i<bins;i++) counts[i]=0;\n    drawBars();\n    requestAnimationFrame(step);\n  }\n  // Start when slide becomes visible\n  function isVisible(){\n    const slide = canvas.closest('section.slide');\n    return slide && slide.classList.contains('active');\n  }\n  function watch(){\n    if(isVisible()){ start(); }\n    else if(N>=target){ /* already done */ }\n  }\n  setInterval(watch, 500);\n  // also try right away\n  setTimeout(watch, 600);\n})();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
