  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

flex; flex-direction:column; align-items:center; justify-content:center;\n    gap:48px;\n  }\n  .big-eq{\n    font-family:var(--serif); font-style:italic;\n    font-size:280px; line-height:1; color:var(--ink); letter-spacing:-.02em;\n    display:flex; align-items:center; gap:36px;\n  }\n  .big-eq .frac{ display:inline-flex; flex-direction:column; align-items:center; font-size:.55em; }\n  .big-eq .frac .num{ border-bottom:4px solid var(--ink); padding:0 14px 6px;}\n  .big-eq .frac .den{ padding-top:6px;}\n  .big-eq .paren{ font-family:var(--display); font-weight:300; font-size:1.2em; font-style:normal; color:var(--ink); transform:translateY(-12px);}\n  .big-eq .exp{\n    font-family:var(--display); font-style:normal; font-weight:600;\n    font-size:.42em; color:var(--accent); transform:translateY(-1.2em);\n    padding:6px 18px; border:2px solid var(--accent); border-radius:14px;\n    background:var(--accent-soft);\n  }\n\n  .legend{ display:flex; gap:48px; font-family:var(--mono); font-size:16px; color:var(--ink-2);}\n  .legend b{ color:var(--ink); font-weight:600;}\n\n  /* ---------- alpha bands ---------- */\n  .alpha-ruler-wrap{\n    position:absolute; inset:200px 80px 130px 80px;\n    display:flex; flex-direction:column; gap:48px;\n  }\n  .ruler{\n    position:relative; height:120px;\n    background:var(--paper); border-radius:14px; border:1px solid var(--line);\n    box-shadow:var(--shadow);\n  }\n  .ruler::before{\n    content:\"\"; position:absolute; left:24px; right:24px; top:50%;\n    height:2px; background:var(--line); border-radius:2px;\n  }\n  .tick{\n    position:absolute; top:50%; transform:translate(-50%,-50%);\n    width:14px; height:14px; border-radius:50%; background:var(--ink);\n  }\n  .tick.major{ width:18px; height:18px; background:var(--accent);}\n  .tick-label{\n    position:absolute; top:-40px; left:50%; transform:translateX(-50%);\n    font-family:var(--mono); font-size:14px; color:var(--ink); white-space:nowrap;\n  }\n  .tick-val{\n    posit v>FIG · 01<\u002Fdiv>\n        <div>α = 2.3 — HIERARCHICAL<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"footer\">\n    <div>Rhythmic Chemistry<\u002Fdiv>\n    <div>SCROLL →<\u002Fdiv>\n    <div><span class=\"pgnum\">01<\u002Fspan> / 10<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<!-- =================== SLIDE 2: THE OLD STORY =================== -->\n<section data-screen-label=\"02 The old story\">\n  <div class=\"topbar\">\n    <div class=\"left\"><span class=\"tag\">02<\u002Fspan><span>THE OLD STORY · 100 YEARS OF ARRHENIUS<\u002Fspan><\u002Fdiv>\n    <div class=\"right\"><span>1889 → TODAY<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"twocol\">\n    <div class=\"card arrhenius-card\">\n      <div class=\"stamp\">PASSIVE<\u002Fdiv>\n      <div class=\"eyebrow\">The standard model<\u002Fdiv>\n      <h2 class=\"section-h\" style=\"font-size:80px\">Heat it up.<br><span class=\"it\">Cross the barrier.<\u002Fspan><\u002Fh2>\n      <div class=\"equation\" style=\"margin-top:18px\">\n        k = A e<sup>−Eₐ/RT<\u002Fsup>\n      <\u002Fdiv>\n      <div class=\"body\" style=\"max-width:560px\">\n        Arrhenius (1889) and Eyring (1935) gave us a beautiful, durable recipe: a prefactor, a barrier, a temperature. The environment is just a thermostat.\n      <\u002Fdiv>\n      <div class=\"barrier-stage\">\n        <svg viewBox=\"0 0 500 280\">\n          <defs>\n            <linearGradient id=\"g1\" x1=\"0\" x2=\"1\">\n              <stop offset=\"0\" stop-color=\"#dad3c4\"><\u002Fstop>\n              <stop offset=\".5\" stop-color=\"#ed7c3b\" stop-opacity=\".5\"><\u002Fstop>\n              <stop offset=\"1\" stop-color=\"#dad3c4\"><\u002Fstop>\n            <\u002FlinearGradient>\n          <\u002Fdefs>\n          <path d=\"M 0 230 L 60 230 Q 220 230, 220 60 Q 220 230, 380 230 L 500 230\" fill=\"none\" stroke=\"#15171f\" stroke-width=\"2\"><\u002Fpath>\n          <path d=\"M 0 232 L 60 232 Q 220 232, 220 62 Q 220 232, 380 232 L 500 232\" fill=\"url(#g1)\" stroke=\"none\" opacity=\".3\"><\u002Fpath>\n          <text x=\"40\" y=\"260\" font-family=\"JetBrains Mono\" font-size=\"13\" fill=\"#7b7e8a\">reactants<\u002Ftext>\n          <text x=\"410\" y=\"260\" font-family=\"JetBrains Mono\" font-size=\"13\" fill=\"#7b7e8a\">products<\u002Ftext>\n          <text x=\"225\" y=\"50\" font-family=\"JetBrains Mono\" font-size=\"13\" fill=\"#ed7c3b\">Eₐ ↑<\u002Ftext>\n          <line x1=\"220\" y1=\"62\" x2=\"220\" y2=\"230\" stroke=\"#ed7c3b\" stroke-dasharray=\"4 4\" stroke-width=\"1\"><\u002Fline>\n          <g class=\"ball\">\n            <circle r=\"14\" fill=\"#15171f\"><\u002Fcircle>\n            <circle r=\"6\" fill=\"#ed7c3b\"><\u002Fcircle>\n          <\u002Fg>\n        <\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; flex-direction:column; gap:28px;\">\n      <div class=\"pill\"><span class=\"swatch\"><\u002Fspan>But reality has hints…<\u002Fdiv>\n      <h2 class=\"section-h\" style=\"font-size:80px\">The bath<br><span class=\"it\">isn't passive.<\u002Fspan><\u002Fh2>\n      <div class=\"lede\" style=\"font-size:24px\">Three quiet rebellions against the textbook:<\u002Fdiv>\n\n      <div style=\"display:grid; gap:18px;\">\n        <div class=\"card tight\" style=\"padding:22px 26px; display:flex; gap:20px; align-items:center;\">\n          <div style=\"font-family:var(--serif); font-style:italic; font-size:54px; color:var(--accent); width:80px;\">1<\u002Fdiv>\n          <div>\n            <div style=\"font-family:var(--display); font-weight:600; font-size:24px;\">Sonochemistry<\u002Fdiv>\n            <div style=\"font-family:var(--display); color:var(--mute); font-size:18px;\">Collapsing bubbles spark reactions that shouldn't run at bulk temperature.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card tight\" style=\"padding:22px 26px; display:flex; gap:20px; align-items:center;\">\n          <div style=\"font-family:var(--serif); font-style:italic; font-size:54px; color:var(--accent); width:80px;\">2<\u002Fdiv>\n          <div>\n            <div style=\"font-family:var(--display); font-weight:600; font-size:24px;\">Mechanochemistry<\u002Fdiv>\n            <div style=\"font-family:var(--display); color:var(--mute); font-size:18px;\">A ball-mill grinds a reaction into life with no solvent at all.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card tight\" style=\"padding:22px 26px; display:flex; gap:20px; align-items:center;\">\n          <div style=\"font-family:var(--serif); font-style:italic; font-size:54px; color:var(--accent); width:80px;\">3<\u002Fdiv>\n          <div>\n            <div style=\"font-family:var(--display); font-weight:600; font-size:24px;\">Cavity chemistry<\u002Fdiv>\n            <div style=\"font-family:var(--display); color:var(--mute); font-size:18px;\">An empty optical cavity quietly rewrites selectivity.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"footer\">\n    <div>Rhythmic Chemistry<\u002Fdiv>\n    <div class=\"mono\">§1 — INTRODUCTION<\u002Fdiv>\n    <div><span class=\"pgnum\">02<\u002Fspan> / 10<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<!-- =================== SLIDE 3: MASTER LAW =================== -->\n<section data-screen-label=\"03 The master law\">\n  <div class=\"topbar\">\n    <div class=\"left\"><span class=\"tag\">03<\u002Fspan><span>THE MASTER LAW · ONE DIAL TO RULE THEM ALL<\u002Fspan><\u002Fdiv>\n    <div class=\"right\"><span>§ 2.1<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"floaters\">\n    <span style=\"left:12%; top:30%; animation-delay:0s\"><\u002Fspan>\n    <span style=\"left:25%; top:65%; animation-delay:.8s\"><\u002Fspan>\n    <span style=\"left:72%; top:22%; animation-delay:1.6s\"><\u002Fspan>\n    <span style=\"left:85%; top:75%; animation-delay:2.4s\"><\u002Fspan>\n    <span style=\"left:50%; top:18%; animation-delay:3.2s\"><\u002Fspan>\n  <\u002Fdiv>\n\n  <div class=\"hero-eq\">\n    <div class=\"eyebrow\">Temporal Relativity in Multiscale systems<\u002Fdiv>\n\n    <div class=\"big-eq\">\n      <div class=\"frac\">\n        <span class=\"num\">τ<\u002Fspan>\n        <span class=\"den\">τ₀<\u002Fspan>\n      <\u002Fdiv>\n      <span>=<\u002Fspan>\n      <span class=\"paren\">(<\u002Fspan>\n      <div class=\"frac\">\n        <span class=\"num\">L<\u002Fspan>\n        <span class=\"den\">L₀<\u002Fspan>\n      <\u002Fdiv>\n      <span class=\"paren\">)<\u002Fspan>\n      <span class=\"exp\">α<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"lede\" style=\"text-align:center; max-width:1000px; font-size:32px;\">\n      A reaction's <span class=\"it\" style=\"font-family:var(--serif); color:var(--ink); font-style:italic;\">internal clock<\u002Fspan> bends with the environment's length scale.<br>\n      One exponent, <b style=\"color:var(--accent); font-weight:700\">α<\u002Fb>, sets the rhythm.\n    <\u002Fdiv>\n\n    <div class=\"legend\">\n      <div><b>τ<\u002Fb> — reactive clock<\u002Fdiv>\n      <div><b>L<\u002Fb> — coherence length<\u002Fdiv>\n      <div><b>α<\u002Fb> — environmental coherence exponent<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"position:absolute; left:80px; bottom:120px; max-width:420px;\">\n      <div class=\"annot\" style=\"margin-bottom:8px\">→ takeaway for chemists<\u002Fdiv>\n      <div class=\"card tight\" style=\"padding:22px 28px;\">\n        <div class=\"mono\" style=\"font-size:34px; color:var(--ink); letter-spacing:-.01em;\">k ∝ L<sup style=\"font-size:.6em;\">−α<\u002Fsup><\u002Fdiv>\n        <div style=\"font-family:var(--display); color:var(--mute); margin-top:8px; font-size:16px;\">Shrink the box. Speed up the clock.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"position:absolute; right:80px; bottom:120px; max-width:420px; text-align:right;\">\n      <div class=\"annot\" style=\"margin-bottom:8px\">→ at fixed length<\u002Fdiv>\n      <div class=\"card tight\" style=\"padding:22px 28px;\">\n        <div class=\"mono\" style=\"font-size:34px; color:var(--ink); letter-spacing:-.01em;\">∂k/∂α &lt; 0<\u002Fdiv>\n        <div style=\"font-family:var(--display); color:var(--mute); margin-top:8px; font-size:16px;\">More coherence → fewer paths → slower, but pickier.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"footer\">\n    <div>Rhythmic Chemistry<\u002Fdiv>\n    <div class=\"mono\">§2 — RTM IN BRIEF<\u002Fdiv>\n    <div><span class=\"pgnum\">03<\u002Fspan> / 10<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<!-- =================== SLIDE 4: ALPHA EXPLORER =================== -->\n<section data-screen-label=\"04 Meet alpha\">\n  <div class=\"topbar\">\n    <div class=\"left\"><span class=\"tag\">04<\u002Fspan><span>MEET ALPHA · A FIELD GUIDE TO THE COHERENCE EXPONENT<\u002Fspan><\u002Fdiv>\n    <div class=\"right\"><span class=\"hint\">drag the orange dial<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:absolute; left:80px; top:160px; max-width:1200px;\">\n    <h2 class=\"section-h\" style=\"font-size:88px\">Four <span class=\"it\">flavours<\u002Fspan> of α.<\u002Fh2>\n    <div class=\"lede\" style=\"margin-top:18px\">Every environment lives on a ruler from <b style=\"color:var(--ink); font-weight:600\">free<\u002Fb> to <b style=\"color:var(--ink); font-weight:600\">frozen<\u002Fb>. Where it sits decides how its chemistry beats.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"alpha-ruler-wrap\" style=\"inset:430px 80px 130px 80px;\">\n    <div class=\"ruler\" id=\"alphaRuler\">\n      <div class=\"tick major\" id=\"alphaThumb\" style=\"left:50%; cursor:grab;\">\n        <div class=\"tick-label\" id=\"alphaThumbLabel\">drag me<\u002Fdiv>\n        <div class=\"tick-val\" id=\"alphaThumbVal\" style=\"color:var(--accent); font-weight:600;\">α = 2.0<\u002Fdiv>\n      <\u002Fdiv>\n      <!-- band background -->\n      <svg style=\"posi >\n\n      <div class=\"readout\">\n        <div>\n          <div class=\"label\">Selectivity gain<\u002Fdiv>\n          <div style=\"display:flex; align-items:baseline; gap:8px;\">\n            <span class=\"big\" id=\"ASel\" style=\"color:var(--blue);\">3.2×<\u002Fspan>\n            <span class=\"unit\">for the favored channel<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:var(--mono); font-size:13px; color:var(--mute); border-top:1px dashed var(--line); padding-top:14px;\">\n        ↳ higher α = fewer pathways = pickier chemistry\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"footer\">\n    <div>Rhythmic Chemistry<\u002Fdiv>\n    <div class=\"mono\">§3.2 — KINETICS AS A FUNCTION OF α &amp; L<\u002Fdiv>\n    <div><span class=\"pgnum\">05<\u002Fspan> / 10<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<!-- =================== SLIDE 6: PHASE DIAGRAM =================== -->\n<section data-screen-label=\"06 Phase diagram\">\n  <div class=\"topbar\">\n    <div class=\"left\"><span class=\"tag\">06<\u002Fspan><span>THE PHASE DIAGRAM · WHERE TO LIVE<\u002Fspan><\u002Fdiv>\n    <div class=\"right\"><span class=\"hint\">hover the chart<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:absolute; top:110px; left:80px; right:80px;\">\n    <h2 class=\"section-h\" style=\"font-size:56px; max-width:1100px;\">Where <span class=\"it\">chemistry<\u002Fspan> wants to live.<\u002Fh2>\n  <\u002Fdiv>\n\n  <div class=\"phase-wrap\">\n    <div class=\"phase-chart\">\n      <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;\">\n        <div class=\"eyebrow\">α vs. L — qualitative phase map<\u002Fdiv>\n        <div class=\"mono\" style=\"font-size:12px; color:var(--mute);\">FIG. PHASE-01<\u002Fdiv>\n      <\u002Fdiv>\n\n      <svg class=\"phase-svg\" viewBox=\"0 0 700 540\">\n        <!-- axes -->\n        <line x1=\"60\" y1=\"40\" x2=\"60\" y2=\"480\" stroke=\"#15171f\" stroke-width=\"1.5\"><\u002Fline>\n        <line x1=\"60\" y1=\"480\" x2=\"680\" y2=\"480\" stroke=\"#15171f\" stroke-width=\"1.5\"><\u002Fline>\n\n        <!-- zones -->\n        <g class=\"phase-zones\">\n          <!-- fast entropic: low alpha, any L -->\n          <rect x=\"60\" y=\"320\" width=\"620\" height=\"160\" fill=\"#84b495\" fill-opacity=\".18\" rx=\"6\"><\u002Frect>\n          <text x=\"380\" y=\"412\" text-anchor=\"middle\">FAST &amp; MESSY<\u002Ftext>\n          <text x=\"380\" y=\"440\" text-anchor=\"middle\" class=\"small\">low α — many paths, fast but unselective<\u002Ftext>\n\n          <!-- coherent selective: mid-high alpha, small L -->\n          <rect x=\"60\" y=\"120\" width=\"380\" height=\"180\" fill=\"#ed7c3b\" fill-opacity=\".22\" rx=\"6\"><\u002Frect>\n          <text x=\"245\" y=\"200\" text-anchor=\"middle\">SELECTIVE SWEET SPOT<\u002Ftext>\n          <text x=\"245\" y=\"226\" text-anchor=\"middle\" class=\"small\">α ≈ 2.3–2.7 · L ≲ 100 nm<\u002Ftext>\n          <text x=\"245\" y=\"245\" text-anchor=\"middle\" class=\"small\">coherent catalysis lives here<\u002Ftext>\n\n          <!-- over constrained: very high alpha -->\n          <rect x=\"60\" y=\"40\" width=\"620\" height=\"70\" fill=\"#7a5cad\" fill-opacity=\".22\" rx=\"6\"><\u002Frect>\n          <text x=\"380\" y=\"78\" text-anchor=\"middle\">FROZEN SOLID<\u002Ftext>\n          <text x=\"380\" y=\"98\" text-anchor=\"middle\" class=\"small\">over-constrained · dead-end alignments<\u002Ftext>\n\n          <!-- mass-transfer limited at large L -->\n          <rect x=\"460\" y=\"120\" width=\"220\" height=\"180\" fill=\"#dad3c4\" fill-opacity=\".5\" rx=\"6\"><\u002Frect>\n          <text x=\"570\" y=\"200\" text-anchor=\"middle\" class=\"small\" fill=\"#3a3d49\">DIFFUSION-LIMITED<\u002Ftext>\n          <text x=\"570\" y=\"220\" text-anchor=\"middle\" class=\"small\" fill=\"#7b7e8a\">classical bulk regime<\u002Ftext>\n        <\u002Fg>\n\n        <!-- ideal =\"badge\" style=\"background:#84b495\">↯<\u002Fdiv>\n        <div>\n          <h4>Fast &amp; Messy<\u002Fh4>\n          <p>Low α: lots of pathways, lots of products. Speed without sophistication.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pcard\">\n        <div class=\"badge\" style=\"background:#ed7c3b\">★<\u002Fdiv>\n        <div>\n          <h4>Selective Sweet Spot<\u002Fh4>\n          <p>Mid α, small L. Path narrowing buys you exactly the molecule you wanted.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pcard\">\n        <div class=\"badge\" style=\"background:#7a5cad\">✕<\u002Fdiv>\n        <div>\n          <h4>Frozen Solid<\u002Fh4>\n          <p>Crank α too high and the chemistry can't move. Yield collapses.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pcard\" style=\"background:var(--ink); color:#f3efe6; border-color:transparent;\">\n        <div class=\"badge\" style=\"background:#ed7c3b\">→<\u002Fdiv>\n        <div>\n          <h4 style=\"color:#f3efe6\">Design rule<\u002Fh4>\n          <p style=\"color:#bcbeca\">Tune α just past the threshold for the selectivity you want, but no further.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"footer\">\n    <div>Rhythmic Chemistry<\u002Fdiv>\n    <div class=\"mono\">§3.5 — PHASE DIAGRAM (α, T, L)<\u002Fdiv>\n    <div><span class=\"pgnum\">06<\u002Fspan> / 10<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<!-- =================== SLIDE 7: EMPIRICAL PROOF =================== -->\n<section data-screen-label=\"07 Empirical proof\">\n  <div class=\"topbar\">\n    <div class=\"left\"><span class=\"tag\">07<\u002Fspan><span>EMPIRICAL VALIDATION · 89 DATA POINTS<\u002Fspan><\u002Fdiv>\n    <div class=\"right\"><span>APPENDIX D<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:absolute; top:110px; left:80px; right:80px;\">\n    <h2 class=\"section-h\" style=\"font-size:60px;\">Bulk vs. confined. <span class=\"it\">Zero overlap.<\u002Fspan><\u002Fh2>\n  <\u002Fdiv>\n\n  <div class=\"proof-grid\">\n    <div class=\"proof-left\">\n      <div class=\"body\" style=\"font-size:24px; color:var(--ink-2); max-width:560px;\">\n        We pulled 89 diffusion measurements from the literature, split them into <b style=\"color:var(--ink); font-weight:600\">bulk<\u002Fb> and <b style=\"color:var(--ink); font-weight:600\">zeolite-confined<\u002Fb>, and asked: do the α values agree?\n      <\u002Fdiv>\n\n      <div class=\"stat-row\">\n        <div class=\"stat\">\n          <div class=\"k\">Bulk · Stokes–Einstein<\u002Fdiv>\n          <div class=\"v warn\">−1.23<\u002Fdiv>\n          <div style=\"font-family:var(--mono); font-size:13px; color:var(--mute); margin-top:6px;\">±0.04 · inverse transport class<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"stat\">\n          <div class=\"k\">Zeolite confinement<\u002Fdiv>\n          <div class=\"v good\">+7.25<\u002Fdiv>\n          <div style=\"font-family:var(--mono); font-size:13px; color:var(--mute); margin-top:6px;\">±1.06 · resonant/critical class<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"stat\" style=\"background:var(--ink); color:#f3efe6; border:none;\">\n        <div class=\"k\" style=\"color:#ed7c3b;\">Separation<\u002Fdiv>\n        <div class=\"v\" style=\"color:#f3efe6;\">d = 8.48<\u002Fdiv>\n        <div style=\"font-family:var(--mono); font-size:14px; color:#bcbeca; margin-top:6px;\">Bootstrap distributions don't touch. These are genuinely different physics regimes, not a smooth transition.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; align-items:center; gap:14px; margin-top:6px;\">\n        <span class=\"pill\" style=\"background:var(--accent); color:#fff; border-color:var(--accent);\"><span class=\"swatch\" style=\"background:#fff\"><\u002Fspan>CONVERGENT — Red Team, April 2026<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"dist-chart\">\n      <div style=\"display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px;\">\n        <div>\n          <div class=\"eyebrow\">Bootstrap distributions of α<\u002Fdiv>\n          <div class=\"body\" style=\"font-size:16px; color:var(--mute); margin-top:6px;\">Two regimes. Zero overlap.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"mono\" style=\"font-size:12px; color:var(--mute);\">N = 89 · ODR + Guest-Normalization<\u002Fdiv>\n      <\u002Fdiv>\n\n      <svg viewBox=\"0 0 700 480\" preserveAspectRatio=\"xMidYMid meet\">\n        <!-- axis -->\n        <line x1=\"50\" y1=\"420\" x2=\"680\" y2=\"420\" stroke=\"#15171f\" stroke-width=\"1.5\"><\u002Fline>\n        <line x1=\"50\" y1=\"40\" x2=\"50\" y2=\"420\" stroke=\"#15171f\" stroke-width=\"1.5\"><\u002Fline>\n\n        <!-- gridlines -->\n        <g stroke=\"#dad3c4\" stroke-dasharray=\"2 4\">\n          <line x1=\"50\" y1=\"340\" x2=\"680\" y2=\"340\"><\u002Fline>\n          <line x1=\"50\" y1=\"260\" x2=\"680\" y2=\"260\"><\u002Fline>\n          <line x1=\"50\" y1=\"180\" x2=\"680\" y2=\"180\"><\u002Fline>\n          <line x1=\"50\" y1=\"100\" x2=\"680\" y2=\"100\"><\u002Fline>\n        <\u002Fg>\n\n        <!-- bulk distribution (gaussian-ish around -1.23 mapped to x≈90) -->\n        <path d=\"M 60 420\n                 Q 80 360, 100 280\n                 Q 130 110, 160 280\n                 Q 180 360, 200 420 Z\" fill=\"#c14a3a\" fill-opacity=\".25\" stroke=\"#c14a3a\" stroke-width=\"2\"><\u002Fpath>\n        <text x=\"130\" y=\"80\" text-anchor=\"middle\" font-family=\"Instrument Serif\" font-style=\"italic\" font-size=\"36\" fill=\"#c14a3a\">bulk<\u002Ftext>\n        <text x=\"130\" y=\"105\" text-anchor=\"middle\" font-family=\"JetBrains Mono\" font-size=\"12\" fill=\"#c14a3a\">α = −1.23<\u002Ftext>\n\n        <!-- zeolite distribution around 7.25 mapped to x≈540 -->\n        <path d=\"M 460 420\n                 Q 490 380, 510 270\n                 Q 540 100, 570 270\n                 Q 590 380, 620 420 Z\" fill=\"#3f7a4f\" fill-opacity=\".25\" stroke=\"#3f7a4f\" stroke-width=\"2\"><\u002Fpath>\n        <text x=\"540\" y=\"80\" text-anchor=\"middle\" font-family=\"Instrument Serif\" font-style=\"italic\" font-size=\"36\" fill=\"#3f7a4f\">zeolites<\u002Ftext>\n        <text x=\"540\" y=\"105\" text-anchor=\"middle\" font-family=\"JetBrains Mono\" font-size=\"12\" fill=\"#3f7a4f\">α = +7.25<\u002Ftext>\n\n        <!-- gap labels -->\n        <line x1=\"200\" y1=\"430\" x2=\"460\" y2=\"430\" stroke=\"#15171f\" stroke-dasharray=\"4 4\"><\u002Fline>\n        <text x=\"330\" y=\"460\" text-anchor=\"middle\" font-family=\"JetBrains Mono\" font-size=\"14\" fill=\"#15171f\">d = 8.48 σ<\u002Ftext>\n        <line x1=\"200\" y1=\"425\" x2=\"200\" y2=\"435\" stroke=\"#15171f\"><\u002Fline>\n        <line x1=\"460\" y1=\"425\" x2=\"460\" y2=\"435\" stroke=\"#15171f\"><\u002Fline>\n\n        <!-- x ticks -->\n        <g font-family=\"JetBrains Mono\" font-size=\"11\" fill=\"#7b7e8a\" text-anchor=\"middle\">\n          <text x=\"60\" y=\"445\">−3<\u002Ftext>\n          <text x=\"160\" y=\"445\">−1<\u002Ftext>\n          <text x=\"260\" y=\"445\">+1<\u002Ftext>\n          <text x=\"360\" y=\"445\">+3<\u002Ftext>\n          <text x=\"460\" y=\"445\">+5<\u002Ftext>\n          <text x=\"560\" y=\"445\">+7<\u002Ftext>\n          <text x=\"660\" y=\"445\">+9<\u002Ftext>\n        <\u002Fg>\n        <text x=\"365\" y=\"475\" text-anchor=\"middle\" font-family=\"JetBrains Mono\" font-size=\"12\" fill=\"#15171f\">α (coherence exponent)<\u002Ftext>\n      <\u002Fsvg>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"footer\">\n    <div>Rhythmic Chemistry<\u002Fdiv>\n    <div class=\"mono\">CLASS SWITCH · INVERSE → RESONANT<\u002Fdiv>\n    <div><span class=\"pgnum\">07<\u002Fspan> / 10<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<!-- =================== SLIDE 8: SCALE INVARIANCE =================== -->\n<section data-screen-label=\"08 36.1, 224.1 235.3 C 224.7 234.4, 225.3 233.5, 225.8 232.7 C 226.4 231.8, 226.9 230.8, 227.3 229.9 C 227.8 229.0, 228.2 228.0, 228.5 227.1 C 228.9 226.2, 229.2 225.2, 229.5 224.2 C 229.7 223.3, 230.0 222.3, 230.1 221.3 C 230.3 220.4, 230.4 219.4, 230.5 218.4 C 230.6 217.5, 230.6 216.5, 230.6 215.6 C 230.6 214.6, 230.5 213.7, 230.4 212.7 C 230.3 211.8, 230.1 210.5, 230.0 210.0\" fill=\"none\" stroke=\"#ffb27a\" stroke-width=\"6\" stroke-opacity=\".5\"><\u002Fpath>\n          <g transform=\"translate(288,331) rotate(58) scale(1.5)\">\n          <\u002Fg>\n          <\u002Fg>\n        <\u002Fg>\n        <text x=\"200\" y=\"368\" text-anchor=\"middle\" fill=\"#f3efe6\" opacity=\".4\" font-family=\"Instrument Serif\" font-style=\"italic\" font-size=\"20\">\"time coils — the same rhythm at every scale\"<\u002Ftext>\n      <\u002Fsvg>\n\n      <div style=\"font-family:var(--mono); font-size:13px; color:rgba(243,239,230,.6); letter-spacing:.06em; padding-top:22px; border-top:1px solid rgba(243,239,230,.12);\">\n        <div style=\"color:#f3efe6; font-family:var(--display); font-size:22px; letter-spacing:0; font-weight:500; margin-bottom:8px;\"><\u002Fdiv>\n        CORPUS RHYTHMOS · 2026<br>\n        DOC #007 — RHYTHMIC CHEMISTRY\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"footer\">\n    <div>Rhythmic Chemistry<\u002Fdiv>\n    <div class=\"mono\">FIN<\u002Fdiv>\n    <div><span class=\"pgnum\">10<\u002Fspan> / 10<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdeck-stage>\n\n<script src=\"c000092b-c479-4eb6-a02c-93753d7135df\"><\u002Fscript>\n\n<!-- ============== INTERACTIVITY ============== -->\n<script>\n  // ALPHA RULER (slide 4)\n  (function(){\n    const ruler = document.getElementById('alphaRuler');\n    const thumb = document.getElementById('alphaThumb');\n    const lbl   = document.getElementById('alphaThumbLabel');\n    const val   = document.getElementById('alphaThumbVal');\n    const ro    = document.getElementById('alphaReadout');\n    if (!ruler) return;\n\n    const BANDS = [\n      { max: 1.5, name: 'BALLISTIC', desc: 'no scattering' },\n      { max: 2.2, name: 'DIFFUSIVE', desc: 'bulk solvent' },\n      { max: 2.8, name: 'HIERARCHICAL', desc: 'porous / biological' },\n      { max: 99,  name: 'QUANTUM-CONFINED', desc: 'long memory' },\n    ];\n    function update(pct){\n      const alpha = 0.8 + pct * 2.7; // map 0..1 → 0.8..3.5\n      const a = alpha.toFixed(2);\n      thumb.style.left = (pct*100) + '%';\n      lbl.textContent = '';\n      val.textContent = 'α = ' + a;\n      const band = BANDS.find(b => alpha < b.max);\n      ro.textContent = 'α ≈ ' + a + ' · ' + band.name + ' — ' + band.desc;\n    }\n    update(0.44);\n\n    let dragging = false;\n    function setFromEvent(ev){\n      const r = ruler.getBoundingClientRect();\n      const x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;\n      const pct = Math.max(0, Math.min(1, x / r.width));\n      update(pct);\n    }\n    thumb.addEventListener('pointerdown', e=>{ dragging=true; thumb.setPointerCapture(e.pointerId); });\n    thumb.addEventListener('pointerup',   e=>{ dragging=false; });\n    thumb.addEventListener('pointermove', e=>{ if(dragging) setFromEvent(e); });\n    ruler.addEventListener('click', setFromEvent);\n  })();\n\n  // TWO LEVERS (slide 5)\n  (function(){\n    const L = document.getElementById('LSlider');\n    const A = document.getElementById('ASlider');\n    if (!L || !A) return;\n    const LVal = document.getElementById('LVal');\n    const AVal = document.getElementById('AVal');\n    const LRate = document.getElementById('LRate');\n    const ASel  = document.getElementById('ASel');\n    const LFill = document.getElementById('LFill');\n    const AFill = document.getElementById('AFill');\n\n    function nmLabel(nm){\n      if (nm >= 1e6) return (nm/1e6).toFixed(1).replace(/\\.0$/,'') + ' mm';\n      if (nm >= 1e3) return (nm/1e3).toFixed(1).replace(/\\.0$/,'') + ' µm';\n      return Math.round(nm) + ' nm';\n    }\n    function updateL(){\n      const t = (+L.value)/100;\n      // log scale 1nm (t=0) to 1mm (t=1, 1e6 nm) — but slider 0=1mm, 100=1nm\n      const nm = Math.pow(10, 6 - t*6);\n      LVal.textContent = nmLabel(nm);\n      LFill.style.width = (t*100) + '%';\n      // rate enhancement vs bulk (1mm) at alpha 2.3\n      const enh = Math.pow(1e6 / nm, 2.3 / 6); // simplified illustrative\n      // better: enh = (Lbulk/L)^alpha; use Lbulk=1e6 nm, L=nm, alpha=2.3\n      const ratio = 1e6 / nm;\n      const realEnh = Math.pow(ratio, 2.3);\n      // clamp display\n      let disp;\n      if (realEnh >= 1e6) disp = (realEnh/1e6).toFixed(1)+'M×';\n      else if (realEnh >= 1e3) disp = (realEnh/1e3).toFixed(1)+'k×';\n      else if (realEnh >= 10) disp = Math.round(realEnh)+'×';\n      else disp = realEnh.toFixed(1)+'×';\n      LRate.textContent = disp;\n    }\n    function updateA(){\n      const v = (+A.value)/100; // 1.00 .. 3.50\n      AVal.textContent = v.toFixed(2);\n      const t = (v - 1) / 2.5;\n      AFill.style.width = Math.max(0,Math.min(1,t))*100 + '%';\n      // selectivity gain: rough sigmoid up to ~10x at alpha=3.5\n      const gain = 1 + 9 / (1 + Math.exp(-3*(v - 2.4)));\n      ASel.textContent = gain.toFixed(1) + '×';\n      // color: orange in selective range, purple if over-constrained\n      if (v > 3.1) AFill.style.background = '#7a5cad';\n      else if (v > 2.2) AFill.style.background = 'var(--accent)';\n      else AFill.style.background = 'var(--blue)';\n    }\n    L.addEventListener('input', updateL);\n    A.addEventListener('input', updateA);\n    updateL(); updateA();\n  })();\n\n  // PHASE TRAVELER (slide 6) — orbit along the design path\n  (function(){\n    const t = document.getElementById('traveler');\n    if (!t) return;\n    // pre-sample the dashed path\n    const samples = [];\n    const path = document.querySelector('#traveler')\n      ? document.querySelector('section[data-screen-label=\"06 Phase diagram\"] path[stroke-dasharray=\"6 4\"]')\n      : null;\n    if (!path) return;\n    const total = path.getTotalLength();\n    let s = 0;\n    function tick(){\n      s = (s + 0.6) % total;\n      const p = path.getPointAtLength(s);\n      t.setAttribute('transform', 'translate(' + p.x + ',' + p.y + ')');\n      requestAnimationFrame(tick);\n    }\n    tick();\n  })();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
