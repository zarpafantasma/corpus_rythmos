document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[paquete] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: faltan datos del paquete');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Desempaquetando ' + uuids.length + ' recursos...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' puede no renderizarse');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('No se pudo decodificar el recurso ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Renderizando...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error al desempaquetar: ' + err.message);
    console.error('Error al desempaquetar el paquete:', err);
  }
});

erif;font-weight:400;font-size:64px;line-height:.9;letter-spacing:-.02em;}\n\n  /* deck-stage thumbnail rail wrap fix */\n  deck-stage::part(thumbs){background:#0d0d0c;}\n\n  /* Serpent SVG header */\n  .serpent path{fill:none;stroke:var(--ink);stroke-width:1.2;}\n\n  /* ---------- slide 1 ---------- */\n  .s1 .hero{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr auto;padding:80px 96px;}\n  .s1 h1{font-weight:300;font-size:172px;line-height:.84;letter-spacing:-.04em;margin:0;}\n  .s1 h1 em{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:var(--ochre);}\n  .s1 .sub{font-family:'Instrument Serif',serif;font-style:italic;font-size:54px;color:var(--ink-2);margin-top:8px;}\n  .s1 .ring{position:absolute;right:120px;top:140px;width:520px;height:520px;}\n  .s1 .meta{display:flex;gap:48px;align-items:flex-end;font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--ink-3);}\n  .s1 .meta b{color:var(--ink);font-weight:500;}\n\n  /* ---------- slide 2 ---------- */\n  .s2 .col{position:absolute;top:140px;bottom:120px;width:46%;display:flex;flex-direction:column;gap:24px;}\n  .s2 .colA{left:80px;}\n  .s2 .colB{right:80px;}\n  .s2 h3{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);margin:0;}\n  .s2 .h{font-family:'Instrument Serif',serif;font-style:italic;font-size:84px;line-height:.95;color:var(--ink);margin:0;}\n  .s2 .body{font-size:24px;line-height:1.4;color:var(--ink-2);max-width:42ch;}\n  .s2 .vline{position:absolute;left:50%;top:120px;bottom:120px;width:1px;background:var(--line);}\n  .s2 .icon{height:160px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.3);}\n\n  /* ---------- slide 3 RTM primer ---------- */\n  .s3{}\n  .s3 .stage{position:absolute;left:80px;right:80px;top:130px;bottom:140px;display:grid;grid-template-columns: 1fr 1fr;gap:60px;}\n  .s3 .formula{f width:18px;height:18px;border-radius:50%;background:var(--bone);border:1.5px solid var(--ink);cursor:pointer;\n  }\n\n  /* dial */\n  .dial{position:relative;width:200px;height:200px;}\n  .dial svg{width:100%;height:100%;}\n  .dial .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}\n  .dial .lbl .v{font-family:'Space Grotesk',sans-serif;font-weight:300;font-size:54px;line-height:1;letter-spacing:-.02em;}\n  .dial .lbl .u{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;color:var(--ink-3);}\n\n</style>\n</head>\n<body>\n<script id=\"speaker-notes\" type=\"application/json\">[\n\"Bienvenidos. Esta presentación recorre la homeostasis como coherencia biológica impulsada, el marco C_bio y el protocolo piloto que la convierte en una intervención medible.\",\n\"Dos visiones de la salud: la homeostasis clásica como regulación por puntos de ajuste, frente a la visión multiescala en la que la salud es variabilidad estructurada a través de muchas escalas temporales.\",\n\"Una introducción rápida a la ley de escala RTM. El exponente alfa vincula el tiempo y la longitud característicos. Distintas regiones de alfa corresponden a diferentes clases de transporte.\",\n\"El índice de coherencia biológica, C_bio, es una razón adimensional entre la potencia espectral bloqueada en fase y la potencia de fase aleatoria, agregada entre HRV y EEG.\",\n\"Así se ve el bloqueo de fase. Desliza el control para bloquear o desbloquear los dos osciladores y observa cómo cambia el PLV en tiempo real.\",\n\"Tres zonas de coherencia. Por encima de 0.20 es sano. Por debajo de 0.05 el sistema es frágil. Arrastra el control para ver dónde se ubicaría una persona.\",\n\"La pérdida de coherencia se propaga como una cascada. Los sensores rápidos fallan primero, luego el sueño, los ciclos endocrinos y finalmente el daño inflamatorio y a nivel de órganos.\",\n\"Análisis de fluctuación sin tendencia en PhysioNet. Los corazones sanos se ubican cerca de alfa igual a 1. La insuficiencia cardíaca colapsa hacia el ruido blanco.\",\n\"Este es el hallazgo empírico principal. La insuficiencia cardíaca impone una penalización topológica equivalente a unos 68 años de envejecimiento saludable, comprimidos en el estado de enfermedad.\",\n\"Cuatro modalidades, aplicadas juntas, en una sola sesión de 60 minutos. Haz clic en cada una para activarla y observa cómo aumenta C_bio. Lo multimodal es mayor que la suma de las partes.\",\n\"La sala de lugar de alta alfa. Iluminación circadiana, geometría de proporción áurea, baja reverberación y una malla de Faraday, para que la coherencia endógena pueda reaparecer.\",\n\"Resultados esperados del piloto con n igual a 10. C_bio aumenta, CRP e IL-6 disminuyen, además de ganancias moderadas en relajación subjetiva.\",\n\"La coherencia como propiedad medible y manipulable de los sistemas vivos. C_bio es una de las primeras reglas con las que aprendemos a medirla.\",\n\"Gracias. Preguntas bienvenidas.\"\n]<\/script>\n<deck-stage>\n 1 PORTADA \n<section class=\"s1\" data-screen-label=\"01 Cover\">\n<div class=\"grid-bg\"></div>\n<div class=\"noise\"></div>\n<div class=\"chrome\">\n<span class=\"crop tl\"></span><span class=\"crop tr\"></span><span class=\"crop bl\"></span><span class=\"crop br\"></span>\n<div class=\"tl\">009 / ES_NEUTRO · HOMEOSTASIS · v.PILOTO</div>\n<div class=\"tr\">REL. TEMPORAL MULTIESCALA — RTM<br/>CORPUS RHYTHMOS</div>\n<div class=\"bl\"><span class=\"pulse-dot\"></span>   TRANSMISIÓN DE COHERENCIA EN VIVO</div>\n<div class=\"br\">2026</div>\n</div>\n Anillo decorativo \n<svg class=\"ring\" fill=\"none\" viewbox=\"0 0 520 520\">\n<circle cx=\"260\" cy=\"260\" r=\"240\" stroke=\"#1A1A17\" stroke-dasharray=\"2 6\" stroke-width=\"0.8\"></circle>\n<circle cx=\"260\" cy=\"260\" r=\"180\" stroke=\"#1A1A17\" stroke-dasharray=\"1 3\" stroke-width=\"0.8\"></circle>\n<circle cx=\"260\" cy=\"260\" r=\"120\" stroke=\"#1A1A17\" stroke-width=\"1\"></circle>\n<circle cx=\"260\" cy=\"260\" fill=\"#B8853A\" r=\"6\"></circle>\n<g stroke=\"#1A1A17\" stroke-width=\"0.8\">\n<line x1=\"260\" x2=\"260\" y1=\"20\" y2=\"40\"></line>\n<line x1=\"260\" x2=\"260\" y1=\"480\" y2=\"500\"></line>\n<line x1=\"20\" x2=\"40\" y1=\"260\" y2=\"260\"></line>\n<line x1=\"480\" x2=\"500\" y1=\"260\" y2=\"260\"></line>\n</g>\n<path d=\"M40 260 Q120 200 200 260 T360 260 T520 260\" fill=\"none\" stroke=\"#B8853A\" stroke-width=\"1.5\"></path>\n<text fill=\"#3A3A33\" font-family=\"JetBrains Mono\" font-size=\"10\" letter-spacing=\"3\" text-anchor=\"middle\" x=\"260\" y=\"270\">α_RT</text>\n<text fill=\"#7A7A6E\" font-family=\"JetBrains Mono\" font-size=\"10\" letter-spacing=\"3\" text-anchor=\"middle\" x=\"260\" y=\"155\">C_BIO</text>\n</svg>\n<div class=\"hero\">\n<div class=\"micro\">UN PROTOCOLO PILOTO · <b>2026</b> · 14 DIAPOSITIVAS · INTERACTIVO</div>\n<div>\n<h1>Homeo-<br/>stas<em>i</em>s.</h1>\n<div class=\"sub\">Coherencia biológica impulsada</div>\n</div>\n<div class=\"meta\">\n<div><b>τ</b> ∝ L^α<br/><span style=\"color:var(--ink-4)\">ley de escala</span></div>\n<div><b>C_bio</b> = ΣP_coh / ΣP_inc<br/><span style=\"color:var(--ink-4)\">el índice</span></div>\n<div><b>n = 10</b><br/><span style=\"color:var(--ink-4)\">adultos sanos</span></div>\n<div><b>60 min</b><br/><span style=\"color:var(--ink-4)\">sesión única</span></div>\n</div>\n</div>\n</section>\n 2 ANTIGUO vs NUEVO \n<section class=\"s2\" data-screen-label=\"02 Two views\">\n<div class=\"chrome\">\n<span class=\"crop tl\"></span><span class=\"crop tr\"></span><span class=\"crop bl\"></span><span class=\"crop br\"></span>\n<div class=\"tl\">02 · DOS VISIONES DE LA SALUD</div>\n<div class=\"tr\">§ 1.1 — INTRODUCCIÓN</div>\n<div class=\"bl\">CLÁSICA ↔ MULTIESCALA</div>\n<div class=\"br\">HOMEO·STASIS</div>\n</div>\n<div class=\"vline\"></div>\n<div class=\"col colA\">\n<h3>LA VISIÓN ANTIGUA  ·  PUNTOS DE AJUSTE</h3>\n<div class=\"h\">La salud es la <span class=\"serif\" style=\"color:var(--ink-3)\">ausencia de deriva.</span></div>\n<div class=\"icon\" id=\"oldIcon\">\n<svg height=\"100%\" viewbox=\"0 0 400 140\" width=\"80%\">\n<line stroke=\"#1A1A17\" stroke-dasharray=\"2 4\" stroke-width=\"0.6\" x1=\"0\" x2=\"400\" y1=\"70\" y2=\"70\"></line>\n<path d=\"\" fill=\"none\" id=\"flatSig\" stroke=\"#1A1A17\" stroke-width=\"1.4\"></path>\n<text fill=\"#7A7A6E\" font-family=\"JetBrains Mono\" font-size=\"10\" text-anchor=\"end\" x=\"380\" y=\"74\">PUNTO DE AJUSTE</text>\n</svg>\n</div>\n<div class=\"body\">Los bucles de retroalimentación negativa devuelven cada variable a un valor fijo. La variabilidad se trata como <em>ruido</em> que debe suprimirse. La homeostasis clásica se detiene ahí.</div>\n</div>\n<div class=\"col colB\">\n<h3>LA NUEVA VISIÓN  ·  VARIABILIDAD ESTRUCTURADA</h3>\n<div class=\"h\">La salud es la <span class=\"serif\" style=\"color:var(--ochre)\">estructura de la oscilación.</span></div>\n<div class=\"icon\" id=\"newIcon\">\n<svg height=\"100%\" viewbox=\"0 0 400 140\" width=\"80%\">\n<line stroke=\"#1A1A17\" stroke-dasharray=\"2 4\" stroke-width=\"0.6\" x1=\"0\" x2=\"400\" y1=\"70\" y2=\"70\"></line>\n<path d=\"\" fill=\"none\" id=\"fractalSig\" stroke=\"#B8853A\" stroke-width=\"1.4\"></path>\n<text fill=\"#7A7A6E\" font-family=\"JetBrains Mono\" font-size=\"10\" text-anchor=\"end\" x=\"380\" y=\"74\">FRACTAL</text>\n</svg>\n</div>\n<div class=\"body\">Desde el parpadeo de canales iónicos (ms) hasta las estaciones endocrinas (años), la fisiología sana muestra <em>ritmos sin escala y bloqueados en fase</em> . Al perder esa estructura, se pierde la salud.</div>\n</div>\n</section>\n 3 INTRODUCCIÓN A RTM \n<section class=\"s3\" data-screen-label=\"03 RTM primer\">\n<div class=\"chrome\">\n<span class=\"crop tl\"></span><span class=\"crop tr\"></span><span class=\"crop bl\"></span><span class=\"crop br\"></span>\n<div class=\"tl\">03 · RTM EN UNA DIAPOSITIVA</div>\n<div class=\"tr\">TEMPORAL RELATIVISTA MULTIESCALA</div>\n<div class=\"bl\">ARRASTRA α →</div>\n<div class=\"br\">τ ∝ L^α</div>\n</div>\n<div class=\"stage\">\n<div>\n<div class=\"micro\">LA LEY DE ESCALA</div>\n<div class=\"formula\" style=\"margin-top:20px\">τ  ∝  L<sup>α</sup></div>\n<div class=\"desc\" style=\"margin-top:30px\">Elige cualquier sistema. Grafica cómo su <b>tiempo característico τ</b> escala con su <b>longitud característica L</b>. La pendiente es un único número adimensional, <b>α</b>, que indica qué tipo de física domina.</div>\n<div class=\"micro\" style=\"margin-top:36px\">CUATRO REGÍMENES</div>\n<div class=\"regime\" style=\"margin-top:14px\">\n<div><b>α ≈ 1</b><br/>BALÍSTICO</div>\n<div><b>α ≈ 2</b><br/>DIFUSIVO</div>\n<div><b>α ≈ 2.5</b><br/>FRACTAL · VIDA</div>\n<div><b>α ≈ 3.5</b><br/>CUÁNTICO</div>\n</div>\n</div>\n<div class=\"alphaplot\" id=\"rtmPlot\">\n<div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n<div class=\"micro\">LOG τ × LOG L</div>\n<div class=\"mono\" style=\"font-size:16px\">α = <b id=\"alphaVal\" style=\"color:var(--ochre)\">1.00</b></div>\n</div>\n<svg style=\"margin-top:8px;\" viewbox=\"0 0 500 360\">\n cuadrícula \n<g stroke=\"#1A1A17\" stroke-opacity=\"0.08\">\n<line x1=\"40\" x2=\"40\" y1=\"20\" y2=\"320\"></line>\n<line x1=\"40\" x2=\"480\" y1=\"320\" y2=\"320\"></line>\n<g stroke-dasharray=\"2 4\">\n<line x1=\"40\" x2=\"480\" y1=\"80\" y2=\"80\"></line>\n<line x1=\"40\" x2=\"480\" y1=\"140\" y2=\"140\"></line>\n<line x1=\"40\" x2=\"480\" y1=\"200\" y2=\"200\"></line>\n<line x1=\"40\" x2=\"480\" y1=\"260\" y2=\"260\"></line>\n<line x1=\"120\" x2=\"120\" y1=\"20\" y2=\"320\"></line>\n<line x1=\"200\" x2=\"200\" y1=\"20\" y2=\"320\"></line>\n<line x1=\"280\" x2=\"280\" y1=\"20\" y2=\"320\"></line>\n<line x1=\"360\" x2=\"360\" y1=\"20\" y2=\"320\"></line>\n<line x1=\"440\" x2=\"440\" y1=\"20\" y2=\"320\"></line>\n</g>\n</g>\n<text fill=\"#7A7A6E\" font-family=\"JetBrains Mono\" font-size=\"10\" x=\"40\" y=\"340\">log L →</text>\n<text fill=\"#7A7A6E\" font-family=\"JetBrains Mono\" font-size=\"10\" x=\"20\" y=\"20\">log τ</text>\n regímenes ref. \n<line stroke=\"#7A7A6E\" stroke-dasharray=\"3 3\" stroke-width=\"0.7\" x1=\"40\" x2=\"440\" y1=\"320\" y2=\"240\"></line>\n<line stroke=\"#7A7A6E\" stroke-dasharray=\"3 3\" stroke-width=\"0.7\" x1=\"40\" x2=\"440\" y1=\"320\" y2=\"160\"></line>\n<line stroke=\"#7A7A6E\" stroke-dasharray=\"3 3\" stroke-width=\"0.7\" x1=\"40\" x2=\"440\" y1=\"320\" y2=\"120\"></line>\n<line stroke=\"#7A7A6E\" stroke-dasharray=\"3 3\" stroke-width=\"0.7\" x1=\"40\" x2=\"440\" y1=\"320\" y2=\"40\"></line>\n<text fill=\"#7A7A6E\" font-family=\"JetBrains Mono\" font-size=\"9\" x=\"445\" y=\"244\">α=1</text>\n<text fill=\"#7A7A6E\" font-family=\"JetBrains Mono\" font-size=\"9\" x=\"445\" y=\"164\">α=2</text>\n<text fill=\"#7A7A6E\" font-family=\"JetBrains Mono\" font-size=\"9\" x=\"445\" y=\"124\">α=2.5</text>\n<text fill=\"#7A7A6E\" font-family=\"JetBrains Mono\" font-size=\"9\" x=\"445\" y=\"44\">α=3.5</text>\n línea en vivo \n<line id=\"alphaLine\" stroke=\"#B8853A\" stroke-width=\"2\" x1=\"40\" x2=\"440\" y1=\"320\" y2=\"240\"></line>\n<circle cx=\"440\" cy=\"240\" fill=\"#B8853A\" id=\"alphaDot\" r=\"5\"></circle>\n</svg>\n<div class=\"slider\">\n<div style=\"display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3);\">\n<span>0.5</span><span>1.0</span><span>2.0</span><span>2.5</span><span>3.5</span>\n</div>\n<input id=\"alphaSlider\" max=\"3.5\" min=\"0.5\" step=\"0.05\" type=\"range\" value=\"1.0\"/>\n</div>\n</div>\n</div>\n</section>\n 4 FÓRMULA C_BIO \n<section class=\"s4\" data-screen-label=\"04 Meet C_bio\">\n<div class=\"chrome\">\n<span class=\"crop tl\"></span><span class=\"crop tr\"></span><span class=\"crop bl\"></span><span class=\"crop br\"></span>\n<div class=\"tl\">04 · CONOCE C_BIO</div>\n<div class=\"tr\">ÍNDICE DE COHERENCIA BIOLÓGICA</div>\n<div class=\"bl\">ADIMENSIONAL · OBSERVABLE</div>\n<div class=\"br\">§ 2.1</div>\n</div>\n<div class=\"stage\">\n<div>\n<div class=\"micro\">LA DEFINICIÓN OPERACIONAL</div>\n<div style=\"margin-top:24px;display:flex;align-items:center;gap:30px;\">\n<div class=\"frac\" style=\"font-size:84px;\">\n<span class=\"num\">Σ <span class=\"glyph\">w</span><sub style=\"font-size:.4em\">i</sub> · P<sub style=\"font-size:.4em\">i</sub><sup style=\"font-size:.4em\">coh</sup></span>\n<div class=\"bar\"></div>\n<span class=\"den\">Σ <span class=\"glyph\">w</span><sub style=\"font-size:.4em\">i</sub> · P<sub style=\"font-size:.4em\">i</sub><sup style=\"font-size:.4em\">inc</sup></span>\n</div>\n<div style=\"font-family:'Instrument Serif',serif;font-size:84px;\">= C<sub style=\"font-size:.45em\">bio</sub></div>\n</div>\n<div style=\"margin-top:36px;font-size:22px;line-height:1.45;color:var(--ink-2);max-width:46ch;\">\n        Un único número adimensional. <b>Numerador:</b> potencia espectral que está <em>bloqueada en fase</em> entre la HRV, el EEG y los ritmos moleculares. <b>Denominador:</b> el resto. Su razón indica cuánto del ruido del cuerpo realiza trabajo útil y coordinado.\n      </div>\n</div>\n<div>\n<div class=\"micro\">SÍMBOLOS</div>\n<div class=\"legend\" style=\"margin-top:24px;\">\n<span class=\"k\">P_i^coh</span><span>Potencia en intervalos bloqueados en fase (PLV ≥ 0.70) de la señal <em>i</em></span>\n<span class=\"k\">P_i^inc</span><span>Potencia en intervalos de fase aleatoria (incoherentes)</span>\n<span class=\"k\">w_i</span><span>Peso de modalidad. Predeterminado: HRV 0.40 · EEG 0.40 · molec. 0.20</span>\n<span class=\"k\">θ_PLV</span><span>Umbral de coherencia — predeterminado 0.70</span>\n<span class=\"k\">C_bio^log</span><span>log₁₀(C_bio) — usado para interpretabilidad</span>\n</div>\n<div style=\"margin-top:30px;padding:18px;border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.35);\">\n<div class=\"micro\">¿POR QUÉ UNA RAZÓN?</div>\n<ul style=\"margin:10px 0 0 18px;padding:0;font-size:16px;color:var(--ink-2);line-height:1.5;\">\n<li>Invariante a la escala; resiste cambios de ganancia y de amplificador.</li>\n<li>Comparable entre modalidades de magnitudes muy diferentes.</li>\n<li>Se lee como <em></em>.</li>\n</ul>\n</div>\n</div>\n</div>\n</section>\n 5 DEMO DE BLOQUEO DE FASE \n<section class=\"s5\" data-screen-label=\"05 Phase-locking\">\n<div class=\"chrome\">\n<span class=\"crop tl\"></span><span class=\"crop tr\"></span><span class=\"crop bl\"></span><span class=\"crop br\"></span>\n<div class=\"tl\">05 · ¿QUÉ ES EL BLOQUEO DE FASE?</div>\n<div class=\"tr\">PLV — VALOR DE BLOQUEO DE FASE</div>\n<div class=\"bl\">↓ ARRASTRA EL ACOPLAMIENTO ↓</div>\n<div class=\"br\">θ_PLV = 0.70</div>\n</div>\n<div class=\"stage\">\n<div style=\"display:flex;justify-content:space-between;align-items:flex-end;\">\n<div>\n<div class=\"micro\">DOS OSCILADORES — HRV × EEG-α</div>\n<div style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:48px;line-height:1;margin-top:8px;\">Cuando respiran juntos, <span style=\"color:var(--ochre)\">la potencia es útil.</span></div>\n</div>\n<div class=\"dial\">\n<svg viewbox=\"0 0 200 200\">\n<circle cx=\"100\" cy=\"100\" fill=\"none\" r=\"86\" stroke=\"#1A1A17\" stroke-opacity=\".15\" stroke-width=\"6\"></circle>\n<circle cx=\"100\" cy=\"100\" fill=\"none\" id=\"plvArc\" r=\"86\" stroke=\"#B8853A\" stroke-dasharray=\"540\" stroke-dashoffset=\"540\" stroke-linecap=\"round\" stroke-width=\"6\" transform=\"rotate(-90 100 100)\"></circle>\n</svg>\n<div class=\"lbl\"><div class=\"v\" id=\"plvVal\">0.20</div><div class=\"u\">PLV</div></div>\n</div>\n</div>\n<div class=\"lanes\">\n<div class=\"lane\">\n<div class=\"tag\"><b>SEÑAL · A</b>HRV  0.04–0.4 Hz</div>\n<canvas height=\"200\" id=\"waveA\" width=\"1400\"></canvas>\n<div class=\"plv\"><span id=\"ampA\">1.00</span></div>\n</div>\n<div class=\"lane\">\n<div class=\"tag\"><b>SEÑAL · B</b>EEG  α-band</div>\n<canvas height=\"200\" id=\"waveB\" width=\"1400\"></canvas>\n<div class=\"plv\"><span id=\"ampB\">1.00</span></div>\n</div>\n</div>\n<div class=\"controls\">\n<div style=\"display:flex;align-items:center;gap:18px;flex:1;max-width:60%;\">\n<div class=\"mono\" style=\"font-size:13px;\">DESACOPLADOS</div>\n<input id=\"couplingSlider\" max=\"1\" min=\"0\" step=\"0.01\" style=\"flex:1;\" type=\"range\" value=\"0.2\"/>\n<div class=\"mono\" style=\"font-size:13px;\">BLOQUEADOS</div>\n</div>\n<div class=\"pill\"><span class=\"dot\" id=\"plvLamp\"></span><span id=\"plvLabel\">INTERVALO INCOHERENTE</span></div>\n</div>\n</div>\n</section>\n 6 MEDIDOR \n<section class=\"s6\" data-screen-label=\"06 C_bio meter\">\n<div class=\"chrome\">\n<span class=\"crop tl\"></span><span class=\"crop tr\"></span><span class=\"crop bl\"></span><span class=\"crop br\"></span>\n<div class=\"tl\">06 · EL MEDIDOR C_BIO</div>\n<div class=\"tr\">ESCALA LOG₁₀</div>\n<div class=\"bl\">← ARRASTRA PARA RECORRER EL ESPECTRO</div>\n<div class=\"br\">SANO · PRECLÍNICO · CLÍNICO</div>\n</div>\n<div class=\"stage\">\n<div class=\"meter\">\n<div class=\"micro\">UN ÚNICO NÚMERO ADIMENSIONAL</div>\n<svg id=\"meterSvg\" style=\"margin-top:14px;\" viewbox=\"0 0 600 600\">\n arcos \n<defs>\n<path d=\"M 90 460 A 220 220 0 0 1 510 460\" id=\"arcPath\"></path>\n</defs>\n anillo de fondo \n<path d=\"M 90 460 A 220 220 0 0 1 510 460\" fill=\"none\" stroke=\"#1A1A17\" stroke-linecap=\"butt\" stroke-opacity=\".1\" stroke-width=\"34\"></path>\n bandas de zona \n<path d=\"M 90 460 A 220 220 0 0 1 230 248\" fill=\"none\" stroke=\"#A24A2A\" stroke-opacity=\".65\" stroke-width=\"34\"></path>\n<path d=\"M 230 248 A 220 220 0 0 1 370 248\" fill=\"none\" stroke=\"#B8853A\" stroke-opacity=\".75\" stroke-width=\"34\"></path>\n<path d=\"M 370 248 A 220 220 0 0 1 510 460\" fill=\"none\" stroke=\"#6B8068\" stroke-opacity=\".85\" stroke-width=\"34\"></path>\n marcas \n<g stroke=\"#1A1A17\" stroke-width=\"1\">\n<line x1=\"90\" x2=\"90\" y1=\"460\" y2=\"480\"></line>\n<line x1=\"510\" x2=\"510\" y1=\"460\" y2=\"480\"></line>\n<line x1=\"170\" x2=\"160\" y1=\"280\" y2=\"270\"></line>\n<line x1=\"300\" x2=\"300\" y1=\"220\" y2=\"200\"></line>\n<line x1=\"430\" x2=\"440\" y1=\"280\" y2=\"270\"></line>\n</g>\n<text fill=\"#3A3A33\" font-family=\"JetBrains Mono\" font-size=\"14\" text-anchor=\"middle\" x=\"90\" y=\"500\">0.00</text>\n<text fill=\"#3A3A33\" font-family=\"JetBrains Mono\" font-size=\"14\" text-anchor=\"middle\" x=\"510\" y=\"500\">0.35</text>\n<text fill=\"#3A3A33\" font-family=\"JetBrains Mono\" font-size=\"14\" text-anchor=\"middle\" x=\"300\" y=\"185\">C_bio^log</text>\n<text fill=\"#3A3A33\" font-family=\"JetBrains Mono\" font-size=\"10\" text-anchor=\"middle\" x=\"160\" y=\"260\">0.08</text>\n<text fill=\"#3A3A33\" font-family=\"JetBrains Mono\" font-size=\"10\" text-anchor=\"middle\" x=\"440\" y=\"260\">0.22</text>\n aguja \n<g id=\"needle\" transform=\"rotate(0 300 460)\">\n<line stroke=\"#1A1A17\" stroke-linecap=\"round\" stroke-width=\"3\" x1=\"300\" x2=\"300\" y1=\"460\" y2=\"230\"></line>\n<circle cx=\"300\" cy=\"460\" fill=\"#1A1A17\" r=\"18\"></circle>\n<circle cx=\"300\" cy=\"460\" fill=\"#B8853A\" r=\"6\"></circle>\n</g>\n<text fill=\"#1A1A17\" font-family=\"Space Grotesk\" font-size=\"80\" font-weight=\"300\" letter-spacing=\"-2\" text-anchor=\"middle\" x=\"300\" y=\"540\"><tspan id=\"meterVal\">0.22</tspan></text>\n<text fill=\"#7A7A6E\" font-family=\"JetBrains Mono\" font-size=\"12\" letter-spacing=\"3\" text-anchor=\"middle\" x=\"300\" y=\"572\">LECTURA ACTUAL</text>\n</svg>\n<input id=\"meterSlider\" max=\"0.34\" min=\"0\" step=\"0.001\" style=\"margin-top:24px;\" type=\"range\" value=\"0.22\"/>\n</div>\n<div>\n<div class=\"micro\">ZONAS DE COHERENCIA</div>\n<div class=\"bands\" id=\"bands\">\n<div class=\"band\" data-max=\"1\" data-min=\"0.20\">\n<div>\n<div class=\"name\">Alta</div>\n<div class=\"micro\" style=\"margin-top:6px;color:var(--ink-3)\">SANO</div>\n</div>\n<div class=\"desc\">Domina la potencia coherente. HRV y EEG se bloquean en fase en múltiples bandas. El cuerpo redistribuye la carga eficientemente.</div>\n<div class=\"val\">≥ 0.20</div>\n</div>\n<div class=\"band\" data-max=\"0.20\" data-min=\"0.05\">\n<div>\n<div class=\"name\">Intermedia</div>\n<div class=\"micro\" style=\"margin-top:6px;color:var(--ink-3)\">ACOPLAMIENTO PARCIAL</div>\n</div>\n<div class=\"desc\">Los subsistemas aún se comunican, pero se desincronizan con frecuencia. Aquí se ubican la mayoría de las molestias crónicas.</div>\n<div class=\"val\">0.05 – 0.20</div>\n</div>\n<div class=\"band\" data-max=\"0.05\" data-min=\"0\">\n<div>\n<div class=\"name\">Baja</div>\n<div class=\"micro\" style=\"margin-top:6px;color:var(--ink-3)\">FRÁGIL</div>\n</div>\n<div class=\"desc\">Domina la potencia incoherente. La organización global es débil; el sistema es vulnerable a fallas en cascada.</div>\n<div class=\"val\">≤ 0.05</div>\n</div>\n</div>\n<div class=\"micro\" style=\"margin-top:22px;\">LECTURA POBLACIONAL  ·  <b>SANO 0.22</b>  ·  PRECLÍNICO 0.14  ·  CLÍNICO 0.08  ·  ENVEJECIMIENTO −0.002/AÑO</div>\n</div>\n</div>\n</section>\n 7 CASCADA \n<section class=\"s7\" data-screen-label=\"07 Cascade failure\">\n<div class=\"chrome\">\n<span class=\"crop tl\"></span><span class=\"crop tr\"></span><span class=\"crop bl\"></span><span class=\"crop br\"></span>\n<div class=\"tl\">07 · CASCADA DE FALLA</div>\n<div class=\"tr\">§ 2.2 — PATOLOGÍA COMO DECOHERENCIA</div>\n<div class=\"bl\">PASA SOBRE UN NODO</div>\n<div class=\"br\">LOS SENSORES RÁPIDOS FALLAN PRIMERO</div>\n</div>\n<div class=\"stage\">\n<div class=\"micro\">CUANDO <b>C_bio</b> SE ADELGAZA POR DEBAJO DE LA PERCOLACIÓN, LA FALLA SE PROPAGA</div>\n<div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;\">\n<div style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:80px;line-height:1;max-width:18ch;\">Cinco pasos desde la <span style=\"color:var(--ochre)\">resonancia</span> hasta el <span style=\"color:var(--rust)\">deterioro.</span></div>\n<div class=\"mono\" style=\"font-size:14px;color:var(--ink-3);\">→ 1   → 2   → 3   → 4   → 5</div>\n</div>\n<div class=\"row\" id=\"cascadeRow\">\n<div class=\"node\">\n<div>\n<div class=\"ix\">01 · ADELGAZAMIENTO DE BORDES</div>\n<div class=\"ttl\" style=\"margin-top:18px\">EEG y<br/>HRV-HF<br/>se desincronizan.</div>\n</div>\n<div class=\"body\">Los ritmos de alta frecuencia pierden bloqueo. El PLV cae primero en β–γ. Aún es asintomático.</div>\n<div class=\"arrow\"></div>\n</div>\n<div class=\"node\">\n<div>\n<div class=\"ix\">02 · AISLAMIENTO MODULAR</div>\n<div class=\"ttl\" style=\"margin-top:18px\">La<br/>arquitectura del sueño<br/>se fragmenta.</div>\n</div>\n<div class=\"body\">Las ondas lentas y los husos se separan. La depuración glinfática se ve afectada.</div>\n<div class=\"arrow\"></div>\n</div>\n<div class=\"node\">\n<div>\n<div class=\"ix\">03 · DERIVA ENDOCRINA</div>\n<div class=\"ttl\" style=\"margin-top:18px\">Aplanamiento<br/>circadiano,<br/>PER/CRY.</div>\n</div>\n<div class=\"body\">El cortisol y la melatonina se aplanan. Las ventanas de reparación tisular se desalinean con el comportamiento.</div>\n<div class=\"arrow\"></div>\n</div>\n<div class=\"node\">\n<div>\n<div class=\"ix\">04 · PREACTIVACIÓN INFLAMATORIA</div>\n<div class=\"ttl\" style=\"margin-top:18px\">NF-κB activo.<br/>CRP &amp; IL-6<br/>aumentan.</div>\n</div>\n<div class=\"body\">La inflamación crónica de bajo grado altera aún más los ritmos neurales. La retroalimentación se cierra.</div>\n<div class=\"arrow\"></div>\n</div>\n<div class=\"node\">\n<div>\n<div class=\"ix\">05 · COLAPSO ESPORÁDICO</div>\n<div class=\"ttl\" style=\"margin-top:18px\">Eventos a<br/>nivel de órganos y<br/>fragilidad.</div>\n</div>\n<div class=\"body\">Arritmia, migraña, crisis metabólica. La cascada llega a la superficie.</div>\n</div>\n</div>\n</div>\n</section>\n 8 DFA empírico \n<section class=\"s8\" data-screen-label=\"08 Fractal pulse\">\n<div class=\"chrome\">\n<span class= class=\"crop bl\"></span><span class=\"crop br\"></span>\n<div class=\"tl\">12 · RESULTADOS ESPERADOS</div>\n<div class=\"tr\">PILOTO  ·  n = 10  ·  PRE / POST</div>\n<div class=\"bl\">PROYECCIONES DERIVADAS DE SIMULACIÓN</div>\n<div class=\"br\">α = 0.05 · UNA COLA · 80 % DE POTENCIA</div>\n</div>\n<div class=\"stage\">\n<div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n<div style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:64px;line-height:1;max-width:18ch;\">Lo que se espera que haga una sola sesión de 60 minutos.</div>\n<div class=\"mono\" style=\"font-size:13px;color:var(--ink-3);text-align:right;\">REEMPLAZAR TRAS OBTENER DATOS<br/><span style=\"color:var(--ink-4)\">las cifras son proyecciones — Sección 4</span></div>\n</div>\n<div class=\"grid\">\n<div class=\"card\">\n<div>\n<div class=\"micro\">PRIMARIO · C_BIO^LOG</div>\n<div class=\"lbl\" style=\"margin-top:6px;\">Coherencia ↑</div>\n</div>\n<div>\n<div class=\"big\"><span class=\"sign\">+</span>47<span style=\"font-size:.5em;color:var(--ink-3);\">%</span></div>\n<div class=\"sub\" style=\"margin-top:8px;\">Conjunto multimodal completo. Sinergia ×1.2 por encima de la suma de modalidades individuales.</div>\n</div>\n<div class=\"bar\"><div class=\"fill\" style=\"width:94%\"></div></div>\n</div>\n<div class=\"card neg\">\n<div>\n<div class=\"micro\">SECUNDARIO · INFLAMACIÓN</div>\n<div class=\"lbl\" style=\"margin-top:6px;\">CRP ↓</div>\n</div>\n<div>\n<div class=\"big neg\"><span class=\"sign\">−</span>43<span style=\"font-size:.5em;color:var(--ink-3);\">%</span></div>\n<div class=\"sub\" style=\"margin-top:8px;\">Proteína C reactiva, proyectada a partir de la correlación C_bio × PCR (r = −0.85).</div>\n</div>\n<div class=\"bar\"><div class=\"fill\" style=\"width:86%\"></div></div>\n</div>\n<div class=\"card neg\">\n<div>\n<div class=\"micro\">SECUNDARIO · CITOCINA</div>\n<div class=\"lbl\" style=\"margin-top:6px;\">IL-6 ↓</div>\n</div>\n<div>\n<div class=\"big neg\"><span class=\"sign\">−</span>50<span style=\"font-size:.5em;color:var(--ink-3);\">%</span></div>\n<div class=\"sub\" style=\"margin-top:8px;\">Interleucina-6, la citocina más cercana a la coherencia multiescala (r = −0.74).</div>\n</div>\n<div class=\"bar\"><div class=\"fill\" style=\"width:100%\"></div></div>\n</div>\n<div class=\"card\">\n<div>\n<div class=\"micro\">SECUNDARIO · AUTONÓMICO</div>\n<div class=\"lbl\" style=\"margin-top:6px;\">HRV-HF ↑</div>\n</div>\n<div>\n<div class=\"big\"><span class=\"sign\">+</span>24<span style=\"font-size:.5em;color:var(--ink-3);\">%</span></div>\n<div class=\"sub\" style=\"margin-top:8px;\">Potencia de banda de alta frecuencia,  tono parasimpático, PLV de banda α en EEG.</div>\n</div>\n<div class=\"bar\"><div class=\"fill\" style=\"width:48%\"></div></div>\n</div>\n</div>\n</div>\n</section>\n 13 CIERRE \n<section class=\"s13\" data-screen-label=\"13 Coherence medicine\">\n<div class=\"grid-bg\"></div>\n<div class=\"chrome\">\n<span class=\"crop tl\"></span><span class=\"crop tr\"></span><span class=\"crop bl\"></span><span class=\"crop br\"></span>\n<div class=\"tl\">13 · HACIA LA MEDICINA DE LA COHERENCIA</div>\n<div class=\"tr\">§ 6 — CONCLUSIÓN</div>\n<div class=\"bl\">PRUEBA DE MECANISMO, NO PRUEBA DE CURA</div>\n<div class=\"br\">PROTOCOLO ABIERTO · CC BY 4.0</div>\n</div>\n<div class=\"stage\">\n<div>\n<div class=\"micro\">LA INVITACIÓN</div>\n<div class=\"quote\" style=\"margin-top:18px\">Tratar la coherencia no como una <em>metáfora vaga,</em><br/>sino como una<br/><em>propiedad medible y manipulable de los sistemas vivos.</em></div>\n</div>\n<div class=\"bottom\">\n<div style=\"max-width:50ch;font-family:'Instrument Serif',serif;font-style:italic;font-size:30px;line-height:1.25;color:var(--ink-2)\">\n        C<sub style=\"font-size:.55em\">bio</sub> es una de las primeras reglas con las que aprendemos a medirla.\n      </div>\n<div class=\"mono\" style=\"text-align:right;\">\n        SIGUIENTE → ECA FASE II<br/>\n        N = 30–40 · CONTROL SIMULADO · SEGUIMIENTO DE 8 SEM<br/>\n        + ESCÁNER PORTÁTIL DE COHERENCIA\n      </div>\n</div>\n</div>\n</section>\n 14 SALIDA \n<section class=\"s14\" data-screen-label=\"14 Credits\">\n<div class=\"chrome\">\n<span class=\"crop tl\"></span><span class=\"crop tr\"></span><span class=\"crop bl\"></span><span class=\"crop br\"></span>\n<div class=\"tl\">14 · FIN DE LA TRANSMISIÓN</div>\n<div class=\"tr\">CORPUS RHYTHMOS</div>\n<div class=\"bl\">REPO · github / codeberg → Zarpa_Fantasma/corpus_rythmos</div>\n<div class=\"br\">© 2026 · CC BY 4.0</div>\n</div>\n<div class=\"stage\">\n<div class=\"card\">\n<div class=\"micro\">UN PROTOCOLO PILOTO</div>\n<div class=\"sig\">homeo-<span style=\"color:var(--ochre)\">resonancia</span>.</div>\n<div class=\"name\">009-ES-HOMEOSTASIS</div>\n<svg height=\"40\" style=\"margin:0 auto;\" viewbox=\"0 0 260 40\" width=\"260\">\n<path d=\"M0 20 Q 20 4 40 20 T 80 20 T 120 20 T 160 20 T 200 20 T 240 20 T 260 20\" fill=\"none\" stroke=\"#1A1A17\" stroke-width=\"1.2\"></path>\n<circle cx=\"260\" cy=\"20\" fill=\"#B8853A\" r=\"3\"></circle>\n</svg>\n</div>\n</div>\n</section>\n</deck-stage>\n<script>\n/* ============== SLIDE 2 — signature paths ============== */\n(function(){\n  function gen(flat){\n    const w=400,h=140;let d=\"M0 70\";\n    for(let i=1;i<=80;i++){\n      const x=(i/80)*w;\n      let y;\n      if(flat){\n        y=70+Math.sin(i*0.5)*4 + (Math.random()-0.5)*2;\n      }else{\n        y=70+Math.sin(i*0.4)*18 + Math.sin(i*1.7)*9 + Math.sin(i*0.13)*22 + (Math.random()-0.5)*4;\n      }\n      d+=` L${x.toFixed(1)} ${y.toFixed(1)}`;\n    }\n    return d;\n  }\n  document.getElementById('flatSig').setAttribute('d',gen(true));\n  document.getElementById('fractalSig').setAttribute('d',gen(false));\n})();\n\n/* ============== SLIDE 3 — RTM alpha slider ============== */\n(function(){\n  const s=document.getElementById('alphaSlider');\n  const v=document.getElementById('alphaVal');\n  const line=document.getElementById('alphaLine');\n  const dot=document.getElementById('alphaDot');\n  function update(){\n    const a=parseFloat(s.value);\n    v.textContent=a.toFixed(2);\n    // log L axis from 0 to 1 (40-440 px). y in -log scale: y = 320 - a * 80 * x  (per unit)\n    const x2=440;\n    const dx=x2-40;\n    // we scale: full range α 0.5..3.5 maps so α=3.5 -> y2=40 (top), α=0.5 -> y2=280\n    const y2 = 320 - (a/3.5)*(320-40);\n    line.setAttribute('x2',x2);\n    line.setAttribute('y2',y2.toFixed(1));\n    dot.setAttribute('cx',x2);\n    dot.setAttribute('cy',y2.toFixed(1));\n  }\n  s.addEventListener('input',update);\n  update();\n})();\n\n/* ============== SLIDE 5 — phase locking demo ============== */\n(function(){\n  const cA=document.getElementById('waveA'),cB=document.getElementById('waveB');\n  if(!cA) return;\n  const ctxA=cA.getContext('2d'),ctxB=cB.getContext('2d');\n  const slider=document.getElementById('couplingSlider');\n  const plvVal=document.getElementById('plvVal');\n  const plvArc=document.getElementById('plvArc');\n  const plvLamp=document.getElementById('plvLamp');\n  const plvLabel=document.getElementById('plvLabel');\n  let t=0;\n  function draw(){\n    t+=0.04;\n    const k=parseFloat(slider.value);\n    // PLV proxy = k (roughly)\n    const plv = Math.max(0.05, Math.min(0.99, k));\n    plvVal.textContent = plv.toFixed(2);\n    const dash = 540 * (1-plv);\n    plvArc.setAttribute('stroke-dashoffset', dash.toFixed(1));\n    const above = plv>=0.70;\n    plvLamp.style.background = above ? '#6B8068':'#A24A2A';\n    plvLabel.textContent = above ? 'COHERENT BIN  ·  PLV ≥ 0.70' : 'INCOHERENT BIN';\n    plvLabel.style.color = above ? '#1A1A17' : '#7A7A6E';\n    \n    [{ctx:ctxA,c:cA,phase:0,col:'#1A1A17',f:1.0},\n     {ctx:ctxB,c:cB,phase:Math.PI*0.4*(1-k),col:'#B8853A',f:1.0+(1-k)*0.4}]\n    .forEach(o=>{\n      const w=o.c.width,h=o.c.height;\n      o.ctx.clearRect(0,0,w,h);\n      // mid line\n      o.ctx.strokeStyle='rgba(26,26,23,.08)';\n      o.ctx.beginPath();o.ctx.moveTo(0,h/2);o.ctx.lineTo(w,h/2);o.ctx.stroke();\n      // wave\n      o.ctx.strokeStyle=o.col;\n      o.ctx.lineWidth=1.6;\n      o.ctx.beginPath();\n      for(let x=0;x<w;x+=2){\n        // base signal\n        const noise=(1-k)*Math.sin(x*0.07+t*1.7+o.phase*2.4)*22 + (1-k)*Math.sin(x*0.18+t*2.9)*10;\n        const carrier=Math.sin(x*0.025*o.f + t*1.2 + o.phase)*40;\n        const y=h/2 + carrier + noise*0.6;\n        if(x===0)o.ctx.moveTo(x,y);else o.ctx.lineTo(x,y);\n      }\n      o.ctx.stroke();\n    });\n    requestAnimationFrame(draw);\n  }\n  draw();\n})();\n\n/* ============== SLIDE 6 — meter ============== */\n(function(){\n  const slider=document.getElementById('meterSlider');\n  const needle=document.getElementById('needle');\n  const val=document.getElementById('meterVal');\n  const bands=document.querySelectorAll('#bands .band');\n  function update(){\n    const v=parseFloat(slider.value);\n    val.textContent=v.toFixed(2);\n    const t=Math.min(1,Math.max(0,v/0.34));\n    const ang = -90 + t*180;\n    needle.setAttribute('transform',`rotate(${ang} 300 460)`);\n    bands.forEach(b=>{\n      const mn=parseFloat(b.dataset.min),mx=parseFloat(b.dataset.max);\n      b.classList.toggle('active', v>=mn && v<mx);\n    });\n  }\n  slider.addEventListener('input',update);\n  update();\n})();\n\n/* ============== SLIDE 7 — cascade nodes ============== */\n(function(){\n  document.querySelectorAll('.s7 .node').forEach((n,i)=>{\n    n.addEventListener('mouseenter',()=>{\n      document.querySelectorAll('.s7 .node').forEach((m,j)=>{\n        m.classList.toggle('on', j<=i);\n      });\n    });\n    n.addEventListener('mouseleave',()=>{\n      document.querySelectorAll('.s7 .node').forEach(m=>m.classList.remove('on'));\n    });\n  });\n})();\n\n/* ============== SLIDE 8 — DFA hover ============== */\n(function(){\n  const rows=document.querySelectorAll('.s8 .row');\n  rows.forEach(r=>{\n    r.addEventListener('mouseenter',()=>{\n      const id=r.dataset.line;\n      document.querySelectorAll('.s8 svg line').forEach(l=>{\n        if(['lineYoung','lineElderly','lineCHF','lineVF'].includes(l.id)){\n          l.style.opacity = (l.id===id)?'1':'.18';\n          l.style.strokeWidth = (l.id===id)?'4':'2.5';\n        }\n      });\n      rows.forEach(o=>o.classList.toggle('active', o===r));\n    });\n    r.addEventListener('mouseleave',()=>{\n      document.querySelectorAll('.s8 svg line').forEach(l=>{\n        l.style.opacity='1';l.style.strokeWidth='2.5';\n      });\n      rows.forEach(o=>o.classList.remove('active'));\n    });\n  });\n})();\n\n/* ============== SLIDE 10 — modality stack ============== */\n(function(){\n  const mods=document.querySelectorAll('.s10 .mod');\n  const pre=0.140, baseline=pre;\n  const cnt=document.getElementById('modCount');\n  const pVal=document.getElementById('modPost');\n  const dVal=document.getElementById('modDelta');\n  function update(){\n    let g=0,n=0;\n    mods.forEach(m=>{\n      if(m.classList.contains('on')){g+=parseFloat(m.dataset.gain);n++;}\n    });\n    // synergy if ≥2 modalities active\n    const synergy = n>=2 ? 1 + 0.08*(n-1) : 1;\n    const post = baseline + g*synergy;\n    pVal.textContent = post.toFixed(3);\n    const delta = post-baseline;\n    const pct = (delta/baseline)*100;\n    dVal.textContent = `Δ ${delta>=0?'+':''}${delta.toFixed(3)}  (${pct>=0?'+':''}${pct.toFixed(0)}%)`;\n    cnt.textContent = `${n} / 4  ACTIVE`;\n  }\n  mods.forEach(m=>m.addEventListener('click',()=>{m.classList.toggle('on');update();}));\n  update();\n})();\n<\/script>\n<style id=\"__om-edit-overrides\">\n</style>\n</body></html>"
  </script>
