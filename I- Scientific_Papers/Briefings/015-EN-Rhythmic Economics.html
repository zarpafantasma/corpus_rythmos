t out = [];\n      for (let i = 0; i < this._slides.length; i++) {\n        if (this._slides[i].hasAttribute('data-deck-skip')) out.push(i);\n      }\n      return out;\n    }\n\n    _moveSlide(i, j) {\n      if (j < 0 || j >= this._slides.length || j === i) return;\n      const slide = this._slides[i];\n      const ref = j < i ? this._slides[j] : this._slides[j].nextSibling;\n      // Track the active slide across the reorder so the same content\n      // stays on screen.\n      const cur = this._index;\n      if (cur === i) this._index = j;\n      else if (i < cur && j >= cur) this._index = cur - 1;\n      else if (i > cur && j <= cur) this._index = cur + 1;\n      this._squelchSlotChange = true;\n      this.insertBefore(slide, ref);\n      this._emitDeckChange({ action: 'move', from: i, to: j, slide });\n      this._collectSlides();\n      this._applyIndex({ showOverlay: false, broadcast: true, reason: 'mutation' });\n    }\n\n    // Public API ------------------------------------------------------------\n\n    /** Current slide index (0-based). */\n    get index() { return this._index; }\n    /** Total slide count. */\n    get length() { return this._slides.length; }\n    /** Programmatically navigate. */\n    goTo(i) { this._go(i, 'api'); }\n    next() { this._advance(1, 'api'); }\n    prev() { this._advance(-1, 'api'); }\n    reset() { this._go(0, 'api'); }\n  }\n\n  if (!customElements.get('deck-stage')) {\n    customElements.define('deck-stage', DeckStage);\n  }\n})();\n\n<\u002Fscript>\n\n<script>\n/* ============ Build 3D glow bars ============ */\nfunction buildBar3d(w, h, c, fillPct){\n  const bar = document.createElement('div');\n  bar.className = 'bar3d';\n  bar.style.width = w + 'px';\n  bar.style.height = h + 'px';\n  bar.style.setProperty('--c', c);\n  bar.style.setProperty('--fill', (fillPct||100) + '%');\n  bar.innerHTML = `\n    <div class=\"wire\"><\u002Fdiv>\n    <div class=\"core\"><\u002Fdiv>\n    <div class=\"top\"><\u002Fdiv>\n    <div class=\"reflect\"><\u002Fdiv>\n  `;\n  return bar;\n}\n\n/* ============ Cover bars ============ */\n(function buildCover(){\n  const stage = document.getElementById('coverBars');\n  if(!stage) return;\n  // create perspective container\n  const heights = [380, 540, 320, 720, 460, 600, 380, 480, 520, 360];\n  const cols = ['#5dd2ff', '#5dd2ff', '#b189ff', '#5dd2ff', '#ffd66b', '#b189ff', '#5dd2ff', '#5dd2ff', '#ff8d5a', '#5dd2ff'];\n  const fills = [60, 75, 50, 90, 70, 80, 55, 65, 35, 60];\n  heights.forEach((h,i) => {\n    const wrap = document.createElement('div');\n    wrap.className = 'bar-wrap';\n    wrap.style.height = (h+220) + 'px';\n    const lbl = document.createElement('div');\n    lbl.className = 'label-top';\n    lbl.textContent = 'α = ' + (0.25 + i*0.05).toFixed(2);\n    if(i !== 3 && i !== 7) lbl.style.opacity = 0; // only highlight a couple\n    wrap.appendChild(lbl);\n    const bar = buildBar3d(110, h, cols[i], fills[i]);\n    bar.style.position = 'absolute';\n    bar.style.bottom = '0';\n    bar.style.left = '10px';\n    wrap.appendChild(bar);\n    stage.appendChild(wrap);\n  });\n})();\n\n/* ============ Close bars ============ */\n(function buildClose(){\n  const stage = document.getElementById('closeBars');\n  if(!stage) return;\n  const heights = [240, 420, 600, 780, 900, 780, 600, 420, 240];\n  heights.forEach((h,i) => {\n    const wrap = document.createElement('div');\n    wrap.style.position = 'relative';\n    wrap.style.width = '110px';\n    wrap.style.height = h + 'px';\n    const isCenter = (i === 4);\n    const isClose = (i === 3 || i === 5);\n    const col = isCenter ? '#5dd2ff' : (isClose ? '#b189ff' : '#5dd2ff');\n    const bar = buildBar3d(110, h, col, isCenter ? 90 : (isClose ? 75 : 50));\n    bar.style.opacity = isCenter ? '1' : (isClose ? '0.7' : '0.35');\n    wrap.appendChild(bar);\n    stage.appendChild(wrap);\n  });\n})();\n\n/* ============ Slide 4: alpha slider interactivity ============ */\n(function alphaSlider(){\n  const track = document.getElementById('alphaTrack');\n  const thumb = document.getElementById('alphaThumb');\n  const readout = document.getElementById('alphaReadout');\n  const state   = document.getElementById('alphaState');\n  const lowStack = document.getElementById('lowAlphaStack');\n  const highStack = document.getElementById('highAlphaStack');\n  if(!track) return;\n\n  // Build the bars (5 each side) — same heights template, but coloring tracks alpha\n  const sizes = [10, 100, 1000, 10000, 100000]; // L values\n  function buildStack(stack, colorFn){\n    stack.innerHTML = '';\n    sizes.forEach((L, i) => {\n      const bar = document.createElement('div');\n      bar.className = 'alpha-bar';\n      bar.dataset.l = L;\n      bar.style.height = '60px';\n      bar.style.setProperty('--c', '#5dd2ff');\n      bar.innerHTML = `\n        <div class=\"wire\"><\u002Fdiv>\n        <div class=\"glow\"><\u002Fdiv>\n        <div class=\"scale-num\">τ<\u002Fdiv>\n      `;\n      stack.appendChild(bar);\n    });\n  }\n  buildStack(lowStack);\n  buildStack(highStack);\n\n  function update(alpha){\n    const a = Math.max(0.10, Math.min(0.95, alpha));\n    // map alpha → position\n    const pct = ((a - 0.10) / (0.95 - 0.10)) * 100;\n    thumb.style.left = pct + '%';\n    thumb.textContent = a.toFixed(2);\n    readout.textContent = a.toFixed(2);\n\n    // state label/color\n    let lbl, col;\n    if(a < 0.30){ lbl = 'PHASE BIFURCATION · CRASH'; col = 'var(--orange)'; }\n    else if(a < 0.45){ lbl = 'PRE-CRISIS · FRAGILE'; col = 'var(--gold)'; }\n    else if(a < 0.65){ lbl = 'LAMINAR · HEALTHY'; col = 'var(--green)'; }\n    else if(a < 0.80){ lbl = 'VISCOUS · UNDER LOAD'; col = 'var(--cyan)'; }\n    else { lbl = 'HIERARCHICAL · DEEP BUFFERING'; col = 'var(--purple)'; }\n    state.textContent = lbl;\n    state.style.color = col;\n\n    // compute heights based on tau = L^alpha (normalized)\n    const lowAlpha  = Math.max(0.05, a * 0.45);            // visually flatter\n    const highAlpha = Math.min(1.4, a * 1.6 + 0.1);        // visually steeper\n\n    const Lmax = 100000;\n\n    function applyTo(stack, alphaShown, color){\n      const bars = stack.querySelectorAll('.alpha-bar');\n      // tau = L^alpha. Normalize so max bar is 380px.\n      const taus = sizes.map(L => Math.pow(L / Lmax, alphaShown));\n      const maxT = Math.max(...taus);\n      bars.forEach((bar, i) => {\n        const h = 60 + (taus[i] / maxT) * 360;\n        bar.style.height = h + 'px';\n        bar.style.setProperty('--c', color);\n        bar.querySelector('.scale-num').textContent = 'τ = ' + (taus[i] * 100).toFixed(1);\n      });\n    }\n\n    // Color for the lowAlpha side reflects \"flat\" — orange/yellow if a low\n    const lowColor  = (a < 0.40) ? '#ff8d5a' : (a < 0.55 ? '#ffd66b' : '#5dd2ff');\n    const highColor = (a < 0.40) ? '#ffd66b' : (a < 0.55 ? '#5dd2ff' : '#b189ff');\n\n    applyTo(lowStack,  lowAlpha,  lowColor);\n    applyTo(highStack, highAlpha, highColor);\n  }\n\n  let dragging = false;\n  function setFromEvent(e){\n    const rect = track.getBoundingClientRect();\n    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;\n    const pct = Math.max(0, Math.min(1, x / rect.width));\n    const a = 0.10 + pct * (0.95 - 0.10);\n    update(a);\n  }\n  track.addEventListener('mousedown', (e)=>{ dragging = true; setFromEvent(e); });\n  window.addEventListener('mousemove', (e)=>{ if(dragging) setFromEvent(e); });\n  window.addEventListener('mouseup',   ()=>{ dragging = false; });\n  track.addEventListener('touchstart', (e)=>{ dragging = true; setFromEvent(e); }, {passive:true});\n  window.addEventListener('touchmove',  (e)=>{ if(dragging) setFromEvent(e); }, {passive:true});\n  window.addEventListener('touchend',   ()=>{ dragging = false; });\n  track.addEventListener('keydown', (e)=>{\n    const cur = parseFloat(thumb.textContent) || 0.45;\n    if(e.key === 'ArrowLeft')  update(cur - 0.02);\n    if(e.key === 'ArrowRight') update(cur + 0.02);\n  });\n  update(0.55);\n})();\n\n\n/* ============ Slide 10: phase meter scrub ============ */\n(function phaseMeter(){\n  const meter = document.getElementById('phaseMeter');\n  const needle = document.getElementById('phaseNeedle');\n  if(!meter || !needle) return;\n  const states = document.querySelectorAll('.phase-state');\n\n  function setNeedle(pct){\n    needle.style.left = pct + '%';\n    const alpha = 0.10 + (pct/100) * (0.95 - 0.10);\n    needle.dataset.value = 'α = ' + alpha.toFixed(2);\n  }\n  states.forEach(st => {\n    st.addEventListener('click', ()=>{\n      const v = parseFloat(st.dataset.needle) || 55;\n      setNeedle(v);\n    });\n    st.style.cursor = 'pointer';\n  });\n  meter.addEventListener('click', (e)=>{\n    const rect = meter.getBoundingClientRect();\n    const pct = ((e.clientX - rect.left) / rect.width) * 100;\n    setNeedle(Math.max(2, Math.min(98, pct)));\n  });\n\n  // gentle auto-sweep idle\n  let idle = true, t = 0;\n  setInterval(()=>{\n    if(!idle) return;\n    t += 0.02;\n    const pct = 50 + Math.sin(t) * 35;\n    setNeedle(pct);\n  }, 60);\n  meter.addEventListener('mouseenter', ()=> idle = false);\n  meter.addEventListener('mouseleave', ()=> idle = true);\n  states.forEach(s => {\n    s.addEventListener('mouseenter', ()=> idle = false);\n  });\n})();\n\n\n/* ============ Reveal on slide change ============ */\nconst deck = document.querySelector('deck-stage');\nfunction activateReveal(slide){\n  if(!slide) return;\n  slide.querySelectorAll('.reveal').forEach(r => {\n    r.classList.remove('in');\n    void r.offsetWidth;\n    setTimeout(()=>r.classList.add('in'), 50);\n  });\n}\ndeck.addEventListener('slidechange', (e)=>{\n  activateReveal(e.detail.slide);\n\n  // Reset accuracy bar so it re-animates when slide 14 enters\n  if(e.detail.slide && e.detail.slide.querySelector('.s-honest, [data-label=\"Honest Caveat\"]') ||\n     (e.detail.slide && e.detail.slide.classList.contains('s-honest'))){\n    const f = document.getElementById('accFill');\n    if(f){ f.style.width = '0%'; setTimeout(()=> f.style.width = '25%', 200); }\n  }\n});\n\n// kick reveal on first slide\nwindow.addEventListener('load', ()=>{\n  const first = document.querySelector('deck-stage > section');\n  activateReveal(first);\n});\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
