tom:10px;\" data-om-id=\"94ead2f5:22\">Author<\u002Fdiv>\n        <div style=\"font-weight:600; color:var(--ink);\" data-om-id=\"94ead2f5:23\">Álvaro Quiceno<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"text-align:right;\" data-om-id=\"94ead2f5:24\">\n        <div style=\"color:var(--ink-dim); margin-bottom:10px;\" data-om-id=\"94ead2f5:25\">Coherence Exponent<\u002Fdiv>\n        <div style=\"font-weight:600; color:var(--cyan); font-size:18px;\" data-om-id=\"94ead2f5:26\">α &nbsp;·&nbsp; tau = κ · L^α<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <!-- ============ SLIDE 2: THE HOOK ============ -->\n  <section class=\"s-hook\" data-label=\"Hook\" data-om-id=\"94ead2f5:27\" data-screen-label=\"02 Hook\" data-om-validate=\"no_overflowing_text,no_overlapping_text,slide_sized_text\" data-deck-slide=\"1\">\n    <div class=\"grid-bg\" data-om-id=\"94ead2f5:28\"><\u002Fdiv>\n    <div class=\"chrome\" data-om-id=\"94ead2f5:29\">\n      <div class=\"brand\" data-om-id=\"94ead2f5:30\"><span class=\"brand-mark\" data-om-id=\"94ead2f5:31\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" data-om-id=\"94ead2f5:32\"><path d=\"M2 18 L7 18 L9 6 L12 22 L15 10 L17 18 L22 18\" stroke=\"#5dd2ff\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" data-om-id=\"94ead2f5:33\"><\u002Fpath><\u002Fsvg>\n      <\u002Fspan>Rhythmic Economics<\u002Fdiv>\n      <div class=\"topic\" data-om-id=\"94ead2f5:34\">01 · The Question<\u002Fdiv>\n      <div class=\"foot\" data-om-id=\"94ead2f5:35\"><span data-om-id=\"94ead2f5:36\">Section I<\u002Fspan><span data-om-id=\"94ead2f5:37\">Why tempo matters<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"reveal\" data-om-id=\"94ead2f5:38\">\n      <div class=\"chip\" data-om-id=\"94ead2f5:39\"><span class=\"dot\" data-om-id=\"94ead2f5:40\"><\u002Fspan>An invitation<\u002Fdiv>\n      <h2 class=\"h-display\" style=\"font-size: 116px; margin-top: 30px;\" data-om-id=\"94ead2f5:41\">\n        What if economies<br data-om-id=\"94ead2f5:42\">have a <em data-om-id=\"94ead2f5:43\">pulse?<\u002Fem>\n      <\u002Fh2>\n      <p class=\"body-lg\" style=\"margin-top: 32px;\" data-om-id=\"94ead2f5:44\">\n        GDP, inflation, volatility — these tell you <em style=\"font-style:italic; color:var(--ink);\" data-om-id=\"94ead2f5:45\">how much<\u002Fem>.\n        But crises move at the speed of <span class=\"accent-cyan\" data-om-id=\"94ead2f5:46\">time itself<\u002Fspan>. The question Rhythmic Economics asks is different:\n      <\u002Fp>\n      <p class=\"body-lg\" style=\"margin-top:14px; color:var(--ink); font-size:30px;\" data-om-id=\"94ead2f5:47\">\n        <span class=\"accent-purple\" data-om-id=\"94ead2f5:48\">How quickly does the system respond at every scale?<\u002Fspan>\n      <\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"pulse-viz\" id=\"pulseViz\" data-om-id=\"94ead2f5:49\">\n      <svg viewBox=\"0 0 600 700\" preserveAspectRatio=\"xMidYMid meet\" style=\"width:100%; height:100%;\" data-om-id=\"94ead2f5:50\">\n        <defs data-om-id=\"94ead2f5:51\">\n          <linearGradient id=\"pulseGrad\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\" data-om-id=\"94ead2f5:52\">\n            <stop offset=\"0%\" stop-color=\"#5dd2ff\" stop-opacity=\"0.9\" data-om-id=\"94ead2f5:53\"><\u002Fstop>\n            <stop offset=\"100%\" stop-color=\"#b189ff\" stop-opacity=\"0.1\" data-om-id=\"94ead2f5:54\"><\u002Fstop>\n          <\u002FlinearGradient>\n          <filter id=\"glow\" data-om-id=\"94ead2f5:55\"><feGaussianBlur stdDeviation=\"4\" result=\"b\" data-om-id=\"94ead2f5:56\"><\u002FfeGaussianBlur><feMerge data-om-id=\"94ead2f5:57\"><feMergeNode in=\"b\" data-om-id=\"94ead2f5:58\"><\u002FfeMergeNode><feMergeNode in=\"SourceGraphic\" data-om-id=\"94ead2f5:59\"><\u002FfeMergeNode><\u002FfeMerge><\u002Ffilter>\n        <\u002Fdefs>\n        <g transform=\"translate(300,360)\" filter=\"url(#glow)\" data-om-id=\"94ead2f5:60\">\n          <circle r=\"240\" stroke=\"rgba(93,210,255,0.06)\" fill=\"none\" data-om-id=\"94ead2f5:61\"><\u002Fcircle>\n          <circle r=\"180\" stroke=\"rgba(93,210,255,0.10)\" fill=\"none\" data-om-id=\"94ead2f5:62\"><\u002Fcircle>\n          <circle r=\"120\" stroke=\"rgba(93,210,255,0.16)\" fill=\"none\" data-om-id=\"94ead2f5:63\"><\u002Fcircle>\n          <circle r=\"60\" stroke=\"rgba(93,210,255,0.30)\" fill=\"none\" data-om-id=\"94ead2f5:64\"><\u002Fcircle>\n\n          <circle class=\"pulse-ring\" r=\"60\" fill=\"none\" stroke=\"#5dd2ff\" stroke-width=\"1.5\" opacity=\"0.6\" data-om-id=\"94ead2f5:65\"><\u002Fcircle>\n          <circle class=\"pulse-ring\" r=\"60\" fill=\"none\" stroke=\"#b189ff\" stroke-width=\"1.5\" opacity=\"0.6\" data-om-id=\"94ead2f5:66\"><\u002Fcircle>\n          <circle class=\"pulse-ring\" r=\"60\" fill=\"none\" stroke=\"#ffd66b\" stroke-width=\"1.5\" opacity=\"0.6\" data-om-id=\"94ead2f5:67\"><\u002Fcircle>\n\n          <g data-om-id=\"94ead2f5:68\">\n            <text text-anchor=\"middle\" y=\"-260\" fill=\"#8a97ac\" font-family=\"JetBrains Mono\" font-size=\"11\" letter-spacing=\"3\" data-om-id=\"94ead2f5:69\">MACRO  L≈10⁹<\u002Ftext>\n            <text text-anchor=\"middle\" y=\"-200\" fill=\"#8a97ac\" font-family=\"JetBrains Mono\" font-size=\"11\" letter-spacing=\"3\" data-om-id=\"94ead2f5:70\">MARKET  L≈10⁷<\u002Ftext>\n            <text text-anchor=\"middle\" y=\"-140\" fill=\"#8a97ac\" font-family=\"JetBrains Mono\" font-size=\"11\" letter-spacing=\"3\" data-om-id=\"94ead2f5:71\">SECTOR  L≈10⁴<\u002Ftext>\n            <text text-anchor=\"middle\" y=\"-80\" fill=\"#8a97ac\" font-family=\"JetBrains Mono\" font-size=\"11\" letter-spacing=\"3\" data-om-id=\"94ead2f5:72\">FIRM  L≈10²<\u002Ftext>\n          <\u002Fg>\n\n          <text text-anchor=\"middle\" y=\"10\" fill=\"#fff\" font-family=\"Fraunces\" font-size=\"48\" font-style=\"italic\" font-weight=\"300\" data-om-id=\"94ead2f5:73\">α<\u002Ftext>\n          <text text-anchor=\"middle\" y=\"42\" fill=\"#5dd2ff\" font-family=\"JetBrains Mono\" font-size=\"13\" letter-spacing=\"3\" data-om-id=\"94ead2f5:74\">COHERENCE<\u002Ftext>\n        <\u002Fg>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <style>\n      .pulse-ring{ animation: ring-out 3.8s ease-out infinite; transform-origin: center; transform-box: fill-box;}\n      .pulse-ring:nth-child(6){ animation-delay: 0s; }\n      .pulse-ring:nth-child(7){ animation-delay: 1.2s; }\n      .pulse-ring:nth-child(8){ animation-delay: 2.4s; }\n      @keyframes ring-out {\n        0% { r:60; opacity:0.9; }\n        100% { r:260; opacity:0; }\n      }\n    <\u002Fstyle>\n  <\u002Fsection>\n\n\n  <!-- ============ SLIDE 3: THE MASTER LAW ============ -->\n  <section class=\"s-law\" data-label=\"Master Law\" data-om-id=\"94ead2f5:75\" data-screen-label=\"03 Master Law\" data-om-validate=\"no_overflowing_text,no_overlapping_text,slide_sized_text\" data-deck-slide=\"2\">\n    <div class=\"grid-bg\" data-om-id=\"94ead2f5:76\"><\u002Fdiv>\n    <div class=\"chrome\" data-om-id=\"94ead2f5:77\">\n      <div class=\"brand\" data-om-id=\"94ead2f5:78\"><span class=\"brand-mark\" data-om-id=\"94ead2f5:79\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" data-om-id=\"94ead2f5:80\"><path d=\"M2 18 L7 18 L9 6 L12 22 L15 10 L17 18 L22 18\" stroke=\"#5dd2ff\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" data-om-id=\"94ead2f5:81\"><\u002Fpath><\u002Fsvg>\n      <\u002Fspan>Rhythmic Economics<\u002Fdiv>\n      <div class=\"topic\" data-om-id=\"94ead2f5:82\">02 · The Master Law<\u002Fdiv>\n      <div class=\"foot\" data-om-id=\"94ead2f5:83\"><span data-om-id=\"94ead2f5:84\">Section I<\u002Fspan><span data-om-id=\"94ead2f5:85\">From scale symmetry to power laws<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"reveal\" data-om-id=\"94ead2f5:86\">\n      <div class=\"chip\" data-om-id=\"94ead2f5:87\"><span class=\"dot\" data-om-id=\"94ead2f5:88\"><\u002Fspan>RTM in one line<\u002Fdiv>\n      <h2 class=\"h-title\" style=\"margin-top:24px;\" data-om-id=\"94ead2f5:89\">Bigger structures<br data-om-id=\"94ead2f5:90\">take <em style=\"font-style:italic; color:var(--purple);\" data-om-id=\"94ead2f5:91\">longer<\u002Fem> — but how much longer?<\u002Fh2>\n\n      <div class=\"legend-grid\" data-om-id=\"94ead2f5:92\">\n        <div class=\"k\" data-om-id=\"94ead2f5:93\">τ<\u002Fdiv>\n        <div class=\"v\" data-om-id=\"94ead2f5:94\"><strong style=\"color:var(--ink);\" data-om-id=\"94ead2f5:95\">Characteristic time.<\u002Fstrong> How long it takes for a shock to dissipate, an order to resolve, a market to recover.<\u002Fdiv>\n        <div class=\"k\" data-om-id=\"94ead2f5:96\">L<\u002Fdiv>\n        <div class=\"v\" data-om-id=\"94ead2f5:97\"><strong style=\"color:var(--ink);\" data-om-id=\"94ead2f5:98\">Scale.<\u002Fstrong> Network size, capitalization tier, supply-chain depth, firm headcount.<\u002Fdiv>\n        <div class=\"k alpha\" data-om-id=\"94ead2f5:99\">α<\u002Fdiv>\n        <div class=\"v\" data-om-id=\"94ead2f5:100\"><strong style=\"color:var(--ink);\" data-om-id=\"94ead2f5:101\">Coherence exponent.<\u002Fstrong> The slope. <em data-om-id=\"94ead2f5:102\">The whole story lives in this number.<\u002Fem><\u002Fdiv>\n        <div class=\"k kappa\" data-om-id=\"94ead2f5:103\">κ<\u002Fdiv>\n        <div class=\"v\" data-om-id=\"94ead2f5:104\"><strong style=\"color:var(--ink);\" data-om-id=\"94ead2f5:105\">Scale factor.<\u002Fstrong> Units, baseline frictions. Changes when you change clocks — but α doesn't.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-om-id=\"94ead2f5:106\">\n      <div class=\"equation-block\" data-om-id=\"94ead2f5:107\">\n        <div class=\"eq-text\" data-om-id=\"94ead2f5:108\">\n          <span class=\"var\" data-om-id=\"94ead2f5:109\">τ<\u002Fspan><span class=\"small\" data-om-id=\"94ead2f5:110\">=<\u002Fspan><span style=\"color:var(--gold)\" data-om-id=\"94ead2f5:111\">κ<\u002Fspan><span class=\"small\" data-om-id=\"94ead2f5:112\">·<\u002Fspan><span class=\"var\" style=\"color:#fff\" data-om-id=\"94ead2f5:113\">L<\u002Fspan><span class=\"pow\" data-om-id=\"94ead2f5:114\">α<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"body-md\" style=\"margin-top: 30px; max-width: 720px;\" data-om-id=\"94ead2f5:115\">\n        A single equation — a slope in log-log space — turns out to compress everything you'd want to know about <em style=\"font-style:italic;\" data-om-id=\"94ead2f5:116\">how organized<\u002Fem> a system is.\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <!-- ============ SLIDE 4: MEET ALPHA (interactive slider) ============ -->\n  <section class=\"s-alpha\" data-label=\"Meet Alpha\" id=\"slideAlpha\" data-om-id=\"94ead2f5:117\" data-screen-label=\"04 Meet Alpha\" data-om-validate=\"no_overflowing_text,no_overlapping_text,slide_sized_text\" data-deck-slide=\"3\">\n    <div class=\"grid-bg\" data-om-id=\"94ead2f5:118\"><\u002Fdiv>\n    <div class=\"chrome\" data-om-id=\"94ead2f5:119\">\n      <div class=\"brand\" data-om-id=\"94ead2f5:120\"><span class=\"brand-mark\" data-om-id=\"94ead2f5:121\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" data-om-id=\"94ead2f5:122\"><path d=\"M2 18 L7 18 L9 6 L12 22 L15 10 L17 18 L22 18\" stroke=\"#5dd2ff\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" data-om-id=\"94ead2f5:123\"><\u002Fpath><\u002Fsvg>\n      <\u002Fspan>Rhythmic Economics<\u002Fdiv>\n      <div class=\"topic\" data-om-id=\"94ead2f5:124\">03 · Meet α  ·  <span style=\"color:var(--cyan)\" data-om-id=\"94ead2f5:125\">try the slider →<\u002Fspan><\u002Fdiv>\n      <div class=\"foot\" data-om-id=\"94ead2f5:126\"><span data-om-id=\"94ead2f5:127\">Section II<\u002Fspan><span data-om-id=\"94ead2f5:128\">The coherence exponent<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; justify-content:space-between; align-items:flex-end; padding: 0 40px;\" data-om-id=\"94ead2f5:129\">\n      <div data-om-id=\"94ead2f5:130\">\n        <div class=\"chip\" data-om-id=\"94ead2f5:131\"><span class=\"dot\" data-om-id=\"94ead2f5:132\"><\u002Fspan>Interactive<\u002Fdiv>\n        <h2 class=\"h-title\" style=\"margin-top:18px;\" data-om-id=\"94ead2f5:133\">Drag <em style=\"color:var(--purple); font-style:italic;\" data-om-id=\"94ead2f5:134\">α<\u002Fem> &nbsp;and feel the rhythm change.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"text-align:right;\" data-om-id=\"94ead2f5:135\">\n        <div class=\"label\" style=\"margin-bottom:8px;\" data-om-id=\"94ead2f5:136\">Reading now<\u002Fdiv>\n        <div id=\"alphaReadout\" style=\"font:300 92px/1 var(--serif); color:var(--cyan); letter-spacing:-0.04em;\" data-om-id=\"94ead2f5:137\">0.55<\u002Fdiv>\n        <div id=\"alphaState\" style=\"font:500 14px/1 var(--mono); color:var(--green); letter-spacing:.18em; text-transform:uppercase; margin-top: 8px;\" data-om-id=\"94ead2f5:138\">LAMINAR · HEALTHY<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"alpha-stage\" data-om-id=\"94ead2f5:139\">\n      <div class=\"alpha-side\" data-om-id=\"94ead2f5:140\">\n        <div data-om-id=\"94ead2f5:141\">\n          <div class=\"label\" data-om-id=\"94ead2f5:142\">FLATTENED · low α<\u002Fdiv>\n          <div style=\"font: 400 18px/1.4 var(--sans); color:#aab4c6; margin-top:8px; max-width: 460px;\" data-om-id=\"94ead2f5:143\">Big and small move on the same clock. Shocks rip across every layer at once.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"scale-stack\" id=\"lowAlphaStack\" data-om-id=\"94ead2f5:144\"><div class=\"alpha-bar\" data-l=\"10\" style=\"height: 96.8386px; --c: #5dd2ff;\">\n        <div class=\"wire\"><\u002Fdiv>\n        <div class=\"glow\"><\u002Fdiv>\n        <div class=\"scale-num\">τ = 10.2<\u002Fdiv>\n      <\u002Fdiv><div class=\"alpha-bar\" data-l=\"100\" style=\"height: 125.133px; --c: #5dd2ff;\">\n        <div class=\"wire\"><\u002Fdiv>\n        <div class=\"glow\"><\u002Fdiv>\n        <div class=\"scale-num\">τ = 18.1<\u002Fdiv>\n      <\u002Fdiv><div class=\"alpha-bar\" data-l=\"1000\" style=\"height: 175.16px; --c: #5dd2ff;\">\n        <div class=\"wire\"><\u002Fdiv>\n        <div class=\"glow\"><\u002Fdiv>\n        <div class=\"scale-num\">τ = 32.0<\u002Fdiv>\n      <\u002Fdiv><div class=\"alpha-bar\" data-l=\"10000\" style=\"height: 263.612px; --c: #5dd2ff;\">\n        <div class=\"wire\"><\u002Fdiv>\n        <div class=\"glow\"><\u002Fdiv>\n        <div class=\"scale-num\">τ = 56.6<\u002Fdiv>\n      <\u002Fdiv><div class=\"alpha-bar\" data-l=\"100000\" style=\"height: 420px; --c: #5dd2ff;\">\n        <div class=\"wire\"><\u002Fdiv>\n        <div class=\"glow\"><\u002Fdiv>\n        <div class=\"scale-num\">τ = 100.0<\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n        <div class=\"label-row\" data-om-id=\"94ead2f5:145\"><span data-om-id=\"94ead2f5:146\">L = 10<\u002Fspan><span data-om-id=\"94ead2f5:147\">L = 100<\u002Fspan><span data-om-id=\"94ead2f5:148\">L = 1k<\u002Fspan><span data-om-id=\"94ead2f5:149\">L = 10k<\u002Fspan><span data-om-id=\"94ead2f5:150\">L = 100k<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"alpha-side\" data-om-id=\"94ead2f5:151\">\n        <div data-om-id=\"94ead2f5:152\">\n          <div class=\"label\" data-om-id=\"94ead2f5:153\">BUFFERED · high α<\u002Fdiv>\n          <div style=\"font: 400 18px/1.4 var(--sans); color:#aab4c6; margin-top:8px; max-width: 460px;\" data-om-id=\"94ead2f5:154\">Larger structures slow down more than proportionally. Buffers, staging, controlled flow.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"scale-stack\" id=\"highAlphaStack\" data-om-id=\"94ead2f5:155\"><div class=\"alpha-bar\" data-l=\"10\" style=\"height: 60.0433px; --c: #b189ff;\">\n        <div class=\"wire\"><\u002Fdiv>\n        <div class=\"glow\"><\u002Fdiv>\n        <div class=\"scale-num\">τ = 0.0<\u002Fdiv>\n      <\u002Fdiv><div class=\"alpha-bar\" data-l=\"100\" style=\"height: 60.4133px; --c: #b189ff;\">\n        <div class=\"wire\"><\u002Fdiv>\n        <div class=\"glow\"><\u002Fdiv>\n        <div class=\"scale-num\">τ = 0.1<\u002Fdiv>\n      <\u002Fdiv><div class=\"alpha-bar\" data-l=\"1000\" style=\"height: 63.9473px; --c: #b189ff;\">\n        <div class=\"wire\"><\u002Fdiv>\n        <div class=\"glow\"><\u002Fdiv>\n        <div class=\"scale-num\">τ = 1.1<\u002Fdiv>\n      <\u002Fdiv><div class=\"alpha-bar\" data-l=\"10000\" style=\"height: 97.6966px; --c: #b189ff;\">\n        <div class=\"wire\"><\u002Fdiv>\n        <div class=\"glow\"><\u002Fdiv>\n        <div class=\"scale-num\">τ = 10.5<\u002Fdiv>\n      <\u002Fdiv><div class=\"alpha-bar\" data-l=\"100000\" style=\"height: 420px; --c: #b189ff;\">\n        <div class=\"wire\"><\u002Fdiv>\n        <div class=\"glow\"><\u002Fdiv>\n        <div class=\"scale-num\">τ = 100.0<\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n        <div class=\"label-row\" data-om-id=\"94ead2f5:156\"><span data-om-id=\"94ead2f5:157\">L = 10<\u002Fspan><span data-om-id=\"94ead2f5:158\">L = 100<\u002Fspan><span data-om-id=\"94ead2f5:159\">L = 1k<\u002Fspan><span data-om-id=\"94ead2f5:160\">L = 10k<\u002Fspan><span data-om-id=\"94ead2f5:161\">L = 100k<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"alpha-slider\" data-om-id=\"94ead2f5:162\">\n      <div class=\"alpha-track\" id=\"alphaTrack\" role=\"slider\" tabindex=\"0\" data-om-id=\"94ead2f5:163\">\n        <div class=\"alpha-thumb\" id=\"alphaThumb\" data-om-id=\"94ead2f5:164\" style=\"left: 52.9412%;\">0.55<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"alpha-tick\" data-om-id=\"94ead2f5:165\">\n        <span data-om-id=\"94ead2f5:166\">0.20 · crash<\u002Fspan>\n        <span data-om-id=\"94ead2f5:167\">0.35 · pre-crisis<\u002Fspan>\n        <span data-om-id=\"94ead2f5:168\">0.50 · healthy<\u002Fspan>\n        <span data-om-id=\"94ead2f5:169\">0.70 · buffered<\u002Fspan>\n        <span data-om-id=\"94ead2f5:170\">0.90+ · hierarchical<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <!-- ============ SLIDE 5: SLOPE NOT LEVEL ============ -->\n  <section class=\"s-slope\" data-label=\"Slope not Level\" data-om-id=\"94ead2f5:171\" data-screen-label=\"05 Slope not Level\" data-om-validate=\"no_overflowing_text,no_overlapping_text,slide_sized_text\" data-deck-slide=\"4\">\n    <div class=\"grid-bg\" data-om-id=\"94ead2f5:172\"><\u002Fdiv>\n    <div class=\"chrome\" data-om-id=\"94ead2f5:173\">\n      <div class=\"brand\" data-om-id=\"94ead2f5:174\"><span class=\"brand-mark\" data-om-id=\"94ead2f5:175\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" data-om-id=\"94ead2f5:176\"><path d=\"M2 18 L7 18 L9 6 L12 22 L15 10 L17 18 L22 18\" stroke=\"#5dd2ff\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" data-om-id=\"94ead2f5:177\"><\u002Fpath><\u002Fsvg>\n      <\u002Fspan>Rhythmic Economics<\u002Fdiv>\n      <div class=\"topic\" data-om-id=\"94ead2f5:178\">04 · Slope, not Level<\u002Fdiv>\n      <div class=\"foot\" data-om-id=\"94ead2f5:179\"><span data-om-id=\"94ead2f5:180\">Section II<\u002Fspan><span data-om-id=\"94ead2f5:181\">Why α survives unit changes<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"reveal\" data-om-id=\"94ead2f5:182\">\n      <div class=\"chip\" data-om-id=\"94ead2f5:183\"><span class=\"dot\" data-om-id=\"94ead2f5:184\"><\u002Fspan>Robustness by construction<\u002Fdiv>\n      <h2 class=\"h-title\" style=\"margin-top:20px;\" data-om-id=\"94ead2f5:185\">Change the <em style=\"color:var(--gold); font-style:italic;\" data-om-id=\"94ead2f5:186\">clock<\u002Fem>,<br data-om-id=\"94ead2f5:187\">and the line just <em style=\"color:var(--ink); font-style:italic;\" data-om-id=\"94ead2f5:188\">shifts.<\u002Fem><\u002Fh2>\n      <p class=\"body-lg\" style=\"margin-top:26px;\" data-om-id=\"94ead2f5:189\">\n        Volatility and leverage move with units and regime changes. <span class=\"accent-cyan\" data-om-id=\"94ead2f5:190\">α is a slope<\u002Fspan> — invariant to unit changes, immune to most level-shifting confounders.\n      <\u002Fp>\n      <p class=\"body-md\" style=\"margin-top: 22px;\" data-om-id=\"94ead2f5:191\">\n        <span class=\"accent-purple\" data-om-id=\"94ead2f5:192\">Intercept<\u002Fspan> = where you are. <span class=\"accent-cyan\" data-om-id=\"94ead2f5:193\">Slope<\u002Fspan> = how the system <em data-om-id=\"94ead2f5:194\">scales.<\u002Fem> Crises don't shift intercepts — they bend slopes.\n      <\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"loglog\" data-om-id=\"94ead2f5:195\">\n      <svg viewBox=\"0 0 600 540\" preserveAspectRatio=\"xMidYMid meet\" style=\"width:100%; height:100%;\" data-om-id=\"94ead2f5:196\">\n        <!-- axes -->\n        <g stroke=\"rgba(255,255,255,0.15)\" stroke-width=\"1\" data-om-id=\"94ead2f5:197\">\n          <line x1=\"80\" y1=\"60\" x2=\"80\" y2=\"460\" data-om-id=\"94ead2f5:198\"><\u002Fline>\n          <line x1=\"80\" y1=\"460\" x2=\"560\" y2=\"460\" data-om-id=\"94ead2f5:199\"><\u002Fline>\n        <\u002Fg>\n        <g font-family=\"JetBrains Mono\" font-size=\"12\" fill=\"#4a556a\" letter-spacing=\"2\" data-om-id=\"94ead2f5:200\">\n          <text x=\"80\" y=\"490\" text-anchor=\"middle\" data-om-id=\"94ead2f5:201\">log L<\u002Ftext>\n          <text x=\"50\" y=\"60\" text-anchor=\"end\" data-om-id=\"94ead2f5:202\">log τ<\u002Ftext>\n          <text x=\"290\" y=\"510\" text-anchor=\"middle\" fill=\"#8a97ac\" data-om-id=\"94ead2f5:203\">SCALE  →<\u002Ftext>\n        <\u002Fg>\n        <!-- grid -->\n        <g stroke=\"rgba(255,255,255,0.05)\" stroke-dasharray=\"2 4\" data-om-id=\"94ead2f5:204\">\n          <line x1=\"80\" y1=\"160\" x2=\"560\" y2=\"160\" data-om-id=\"94ead2f5:205\"><\u002Fline>\n          <line x1=\"80\" y1=\"260\" x2=\"560\" y2=\"260\" data-om-id=\"94ead2f5:206\"><\u002Fline>\n          <line x1=\"80\" y1=\"360\" x2=\"560\" y2=\"360\" data-om-id=\"94ead2f5:207\"><\u002Fline>\n          <line x1=\"180\" y1=\"60\" x2=\"180\" y2=\"460\" data-om-id=\"94ead2f5:208\"><\u002Fline>\n          <line x1=\"280\" y1=\"60\" x2=\"280\" y2=\"460\" data-om-id=\"94ead2f5:209\"><\u002Fline>\n          <line x1=\"380\" y1=\"60\" x2=\"380\" y2=\"460\" data-om-id=\"94ead2f5:210\"><\u002Fline>\n          <line x1=\"480\" y1=\"60\" x2=\"480\" y2=\"460\" data-om-id=\"94ead2f5:211\"><\u002Fline>\n        <\u002Fg>\n\n        <!-- Three slopes - same alpha, different intercepts (units/clock change shifts) -->\n        <g data-om-id=\"94ead2f5:212\">\n          <line x1=\"80\" y1=\"380\" x2=\"540\" y2=\"120\" stroke=\"#5dd2ff\" stroke-width=\"2\" opacity=\"0.85\" data-om-id=\"94ead2f5:213\"><\u002Fline>\n          <line x1=\"80\" y1=\"420\" x2=\"540\" y2=\"160\" stroke=\"#b189ff\" stroke-width=\"2\" opacity=\"0.7\" stroke-dasharray=\"4 6\" data-om-id=\"94ead2f5:214\"><\u002Fline>\n          <line x1=\"80\" y1=\"340\" x2=\"540\" y2=\" 80\" stroke=\"#ffd66b\" stroke-width=\"2\" opacity=\"0.7\" stroke-dasharray=\"4 6\" data-om-id=\"94ead2f5:215\"><\u002Fline>\n        <\u002Fg>\n\n        <!-- Crisis line - different slope -->\n        <line x1=\"80\" y1=\"400\" x2=\"540\" y2=\"320\" stroke=\"#ff8d5a\" stroke-width=\"2.5\" data-om-id=\"94ead2f5:216\"><\u002Fline>\n\n        <!-- labels -->\n        <g font-family=\"JetBrains Mono\" font-size=\"13\" fill=\"#fff\" letter-spacing=\"2\" data-om-id=\"94ead2f5:217\">\n          <text x=\"550\" y=\"115\" fill=\"#5dd2ff\" text-anchor=\"end\" data-om-id=\"94ead2f5:218\">α = 0.55  baseline<\u002Ftext>\n          <text x=\"550\" y=\"155\" fill=\"#b189ff\" text-anchor=\"end\" data-om-id=\"94ead2f5:219\">+ clock change (slope SAME)<\u002Ftext>\n          <text x=\"550\" y=\" 78\" fill=\"#ffd66b\" text-anchor=\"end\" data-om-id=\"94ead2f5:220\">+ unit change (slope SAME)<\u002Ftext>\n          <text x=\"550\" y=\"316\" fill=\"#ff8d5a\" text-anchor=\"end\" data-om-id=\"94ead2f5:221\">α = 0.18  CRISIS<\u002Ftext>\n        <\u002Fg>\n\n        <!-- arrows for shifts -->\n        <g stroke=\"#b189ff\" stroke-width=\"1\" opacity=\"0.7\" fill=\"none\" data-om-id=\"94ead2f5:222\">\n          <path d=\"M 200 295 L 200 335\" marker-end=\"url(#arrPurple)\" data-om-id=\"94ead2f5:223\"><\u002Fpath>\n        <\u002Fg>\n        <g stroke=\"#ffd66b\" stroke-width=\"1\" opacity=\"0.7\" fill=\"none\" data-om-id=\"94ead2f5:224\">\n          <path d=\"M 200 305 L 200 250\" marker-end=\"url(#arrGold)\" data-om-id=\"94ead2f5:225\"><\u002Fpath>\n        <\u002Fg>\n        <defs data-om-id=\"94ead2f5:226\">\n          <marker id=\"arrPurple\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\" data-om-id=\"94ead2f5:227\"><path d=\"M0 0 L8 5 L0 10 z\" fill=\"#b189ff\" data-om-id=\"94ead2f5:228\"><\u002Fpath><\u002Fmarker>\n          <marker id=\"arrGold\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\" data-om-id=\"94ead2f5:229\"><path d=\"M0 0 L8 5 L0 10 z\" fill=\"#ffd66b\" data-om-id=\"94ead2f5:230\"><\u002Fpath><\u002Fmarker>\n        <\u002Fdefs>\n      <\u002Fsvg>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <!-- ============ SLIDE 6: HIGH vs LOW α COMPARISON ============ -->\n  <section class=\"s-compare\" data-label=\"High vs Low\" data-om-id=\"94ead2f5:231\" data-screen-label=\"06 High vs Low\" data-om-validate=\"no_overflowing_text,no_overlapping_text,slide_sized_text\" data-deck-slide=\"5\">\n    <div class=\"grid-bg\" data-om-id=\"94ead2f5:232\"><\u002Fdiv>\n    <div class=\"chrome\" data-om-id=\"94ead2f5:233\">\n      <div class=\"brand\" data-om-id=\"94ead2f5:234\"><span class=\"brand-mark\" data-om-id=\"94ead2f5:235\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" data-om-id=\"94ead2f5:236\"><path d=\"M2 18 L7 18 L9 6 L12 22 L15 10 L17 18 L22 18\" stroke=\"#5dd2ff\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" data-om-id=\"94ead2f5:237\"><\u002Fpath><\u002Fsvg>\n      <\u002Fspan>Rhythmic Economics<\u002Fdiv>\n      <div class=\"topic\" data-om-id=\"94ead2f5:238\">05 · Two regimes of timing<\u002Fdiv>\n      <div class=\"foot\" data-om-id=\"94ead2f5:239\"><span data-om-id=\"94ead2f5:240\">Section II<\u002Fspan><span data-om-id=\"94ead2f5:241\">Buffered vs flat<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-om-id=\"94ead2f5:242\">\n      <div class=\"chip\" data-om-id=\"94ead2f5:243\"><span class=\"dot\" data-om-id=\"94ead2f5:244\"><\u002Fspan>Same shock, different rhythm<\u002Fdiv>\n      <h2 class=\"h-title\" style=\"margin-top:14px;\" data-om-id=\"94ead2f5:245\">A pulse arrives. <em style=\"font-style:italic; color:var(--cyan);\" data-om-id=\"94ead2f5:246\">Then what?<\u002Fem><\u002Fh2>\n    <\u002Fdiv>\n\n    <div class=\"compare-grid\" data-om-id=\"94ead2f5:247\">\n      <div class=\"compare-card warn\" data-om-id=\"94ead2f5:248\">\n        <div class=\"label\" style=\"color:var(--orange);\" data-om-id=\"94ead2f5:249\">⌁  Low α  ·  flat &amp; fast<\u002Fdiv>\n        <h3 style=\"font:300 56px/1 var(--serif); margin:0;\" data-om-id=\"94ead2f5:250\">The Cascade.<\u002Fh3>\n        <p class=\"body-md\" style=\"color:#c5cfdd; font-size:19px; margin:0;\" data-om-id=\"94ead2f5:251\">Every layer fires at nearly the same speed. A single shock crosses the whole system before anyone can absorb it.<\u002Fp>\n        <div class=\"anim-area cascade-active cascade-stage\" style=\"--c: #ff8d5a; --dur: 1.2s; --d2: 0.05s; --d3: 0.1s;\" data-om-id=\"94ead2f5:252\">\n          <div class=\"cascade-layer layer-1\" data-om-id=\"94ead2f5:253\"><div class=\"node\" data-om-id=\"94ead2f5:254\"><\u002Fdiv><div class=\"node\" data-om-id=\"94ead2f5:255\"><\u002Fdiv><div class=\"node\" data-om-id=\"94ead2f5:256\"><\u002Fdiv><div class=\"node\" data-om-id=\"94ead2f5:257\"><\u002Fdiv><div class=\"node\" data-om-id=\"94ead2f5:258\"><\u002Fdiv><div class=\"node\" data-om-id=\"94ead2f5:259\"><\u002Fdiv><div class=\"node\" data-om-id=\"94ead2f5:260\"><\u002Fdiv><\u002Fdiv>\n          <div class=\"cascade-layer layer-2\" data-om-id=\"94ead2f5:261\"><div class=\"node\" data-om-id=\"94ead2f5:262\"><\u002Fdiv><div class=\"node\" data-om-id=\"94ead2f5:263\"><\u002Fdiv><div class=\"node\" data-om-id=\"94ead2f5:264\"><\u002Fdiv><div class=\"node\" data-om-id=\"94ead2f5:265\"><\u002Fdiv><div class=\"node\" data-om-id=\"94ead2f5:266\"><\u002Fdiv><\u002Fdiv>\n          <div class=\"cascade-layer layer-3\" data-om-id=\"94ead2f5:267\"><div class=\"node\" data-om-id=\"94ead2f5:268\"><\u002Fdiv><div class=\"node\" data-om-id=\"94ead2f5:269\"><\u002Fdiv><div class=\"node\" data-om-id=\"94ead2f5:270\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns: 1fr 1fr; gap: 20px; padding-top:10px; border-top:1px solid var(--panel-line);\" data-om-id=\"94ead2f5:271\">\n          <div data-om-id=\"94ead2f5:272\"><div class=\"label\" style=\"margin-bottom:6px;\" data-om-id=\"94ead2f5:273\">Throughput<\u002Fdiv><div style=\"font:500 22px/1 var(--mono); color:var(--green);\" data-om-id=\"94ead2f5:274\">HIGH<\u002Fdiv><\u002Fdiv>\n          <div data-om-id=\"94ead2f5:275\"><div class=\"label\" style=\"margin-bottom:6px;\" data-om-id=\"94ead2f5:276\">Systemic Risk<\u002Fdiv><div style=\"font:500 22px/1 var(--mono); color:var(--orange);\" data-om-id=\"94ead2f5:277\">HIGH<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"compare-card good\" data-om-id=\"94ead2f5:278\">\n        <div class=\"label\" style=\"color:var(--green);\" data-om-id=\"94ead2f5:279\">⌁  High α  ·  staged &amp; filtered<\u002Fdiv>\n        <h3 style=\"font:300 56px/1 var(--serif); margin:0;\" data-om-id=\"94ead2f5:280\">The Buffer.<\u002Fh3>\n        <p class=\"body-md\" style=\"color:#c5cfdd; font-size:19px; margin:0;\" data-om-id=\"94ead2f5:281\">Bigger structures absorb energy and slow it down. Information is filtered, decisions are staged, the system bends instead of breaks.<\u002Fp>\n        <div class=\"anim-area cascade-active cascade-stage\" style=\"--c: #5af3a0; --dur: 2.4s; --d2: 0.7s; --d3: 1.5s;\" data-om-id=\"94ead2f5:282\">\n          <div class=\"cascade-layer layer-1\" data-om-id=\"94ead2f5:283\"><div class=\"node\" data-om-id=\"94ead2f5:284\"><\u002Fdiv><div class=\"node\" data-om-id=\"94ead2f5:285\"><\u002Fdiv><div class=\"node\" data-om-id=\"94ead2f5:286\"><\u002Fdiv><div class=\"node\" data-om-id=\"94ead2f5:287\"><\u002Fdiv><div class=\"node\" data-om-id=\"94ead2f5:288\"><\u002Fdiv><div class=\"node\" data-om-id=\"94ead2f5:289\"><\u002Fdiv><div class=\"node\" data-om-id=\"94ead2f5:290\"><\u002Fdiv><\u002Fdiv>\n          <div class=\"cascade-layer layer-2\" data-om-id=\"94ead2f5:291\"><div class=\"node\" data-om-id=\"94ead2f5:292\"><\u002Fdiv><div class=\"node\" data-om-id=\"94ead2f5:293\"><\u002Fdiv><div class=\"node\" data-om-id=\"94ead2f5:294\"><\u002Fdiv><div class=\"node\" data-om-id=\"94ead2f5:295\"><\u002Fdiv><div class=\"node\" data-om-id=\"94ead2f5:296\"><\u002Fdiv><\u002Fdiv>\n          <div class=\"cascade-layer layer-3\" data-om-id=\"94ead2f5:297\"><div class=\"node\" data-om-id=\"94ead2f5:298\"><\u002Fdiv><div class=\"node\" data-om-id=\"94ead2f5:299\"><\u002Fdiv><div class=\"node\" data-om-id=\"94ead2f5:300\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns: 1fr 1fr; gap: 20px; padding-top:10px; border-top:1px solid var(--panel-line);\" data-om-id=\"94ead2f5:301\">\n          <div data-om-id=\"94ead2f5:302\"><div class=\"label\" style=\"margin-bottom:6px;\" data-om-id=\"94ead2f5:303\">Throughput<\u002Fdiv><div style=\"font:500 22px/1 var(--mono); color:var(--gold);\" data-om-id=\"94ead2f5:304\">MODERATE<\u002Fdiv><\u002Fdiv>\n          <div data-om-id=\"94ead2f5:305\"><div class=\"label\" style=\"margin-bottom:6px;\" data-om-id=\"94ead2f5:306\">Systemic Risk<\u002Fdiv><div style=\"font:500 22px/1 var(--mono); color:var(--green);\" data-om-id=\"94ead2f5:307\">LOW<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <!-- ============ SLIDE 7: PIPELINE ============ -->\n  <section class=\"s-pipe\" data-label=\"Pipeline\" data-om-id=\"94ead2f5:308\" data-screen-label=\"07 Pipeline\" data-om-validate=\"no_overflowing_text,no_overlapping_text,slide_sized_text\" data-deck-slide=\"6\">\n    <div class=\"grid-bg\" data-om-id=\"94ead2f5:309\"><\u002Fdiv>\n    <div class=\"chrome\" data-om-id=\"94ead2f5:310\">\n      <div class=\"brand\" data-om-id=\"94ead2f5:311\"><span class=\"brand-mark\" data-om-id=\"94ead2f5:312\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" data-om-id=\"94ead2f5:313\"><path d=\"M2 18 L7 18 L9 6 L12 22 L15 10 L17 18 L22 18\" stroke=\"#5dd2ff\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" data-om-id=\"94ead2f5:314\"><\u002Fpath><\u002Fsvg>\n      <\u002Fspan>Rhythmic Economics<\u002Fdiv>\n      <div class=\"topic\" data-om-id=\"94ead2f5:315\">06 · How we measure it<\u002Fdiv>\n      <div class=\"foot\" data-om-id=\"94ead2f5:316\"><span data-om-id=\"94ead2f5:317\">Section III<\u002Fspan><span data-om-id=\"94ead2f5:318\">From raw data to ECI<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-om-id=\"94ead2f5:319\">\n      <div class=\"chip\" data-om-id=\"94ead2f5:320\"><span class=\"dot\" data-om-id=\"94ead2f5:321\"><\u002Fspan>The ECI pipeline<\u002Fdiv>\n      <h2 class=\"h-title\" style=\"margin-top:18px;\" data-om-id=\"94ead2f5:322\">Five steps from <em style=\"font-style:italic; color:var(--cyan);\" data-om-id=\"94ead2f5:323\">noisy data<\u002Fem> to a single trustable number.<\u002Fh2>\n    <\u002Fdiv>\n\n    <div class=\"pipe-row\" data-om-id=\"94ead2f5:324\">\n      <div class=\"pipe-step\" data-om-id=\"94ead2f5:325\">\n        <div class=\"icon\" data-om-id=\"94ead2f5:326\">L,τ<\u002Fdiv>\n        <div class=\"num\" data-om-id=\"94ead2f5:327\">01 · COLLECT<\u002Fdiv>\n        <h3 data-om-id=\"94ead2f5:328\">Pair size &amp; time<\u002Fh3>\n        <p data-om-id=\"94ead2f5:329\">Build (L, τ) pairs across markets, logistics, credit, information — within a fixed regime.<\u002Fp>\n        <div class=\"pipe-arrow\" data-om-id=\"94ead2f5:330\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pipe-step\" data-om-id=\"94ead2f5:331\">\n        <div class=\"icon\" data-om-id=\"94ead2f5:332\">∂<\u002Fdiv>\n        <div class=\"num\" data-om-id=\"94ead2f5:333\">02 · ESTIMATE<\u002Fdiv>\n        <h3 data-om-id=\"94ead2f5:334\">Slope, with error<\u002Fh3>\n        <p data-om-id=\"94ead2f5:335\">Errors-in-variables regression (ODR / Theil–Sen / SIMEX). Returns α̂ with a confidence band.<\u002Fp>\n        <div class=\"pipe-arrow\" data-om-id=\"94ead2f5:336\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pipe-step\" data-om-id=\"94ead2f5:337\">\n        <div class=\"icon\" data-om-id=\"94ead2f5:338\">⊕<\u002Fdiv>\n        <div class=\"num\" data-om-id=\"94ead2f5:339\">03 · COLLAPSE<\u002Fdiv>\n        <h3 data-om-id=\"94ead2f5:340\">Validate scaling<\u002Fh3>\n        <p data-om-id=\"94ead2f5:341\">Rescale by L^α — if curves collapse onto one, the regime is real. Otherwise: reject.<\u002Fp>\n        <div class=\"pipe-arrow\" data-om-id=\"94ead2f5:342\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pipe-step\" data-om-id=\"94ead2f5:343\">\n        <div class=\"icon\" data-om-id=\"94ead2f5:344\">Σ<\u002Fdiv>\n        <div class=\"num\" data-om-id=\"94ead2f5:345\">04 · FUSE<\u002Fdiv>\n        <h3 data-om-id=\"94ead2f5:346\">Combine proxies<\u002Fh3>\n        <p data-om-id=\"94ead2f5:347\">Random-effects meta-analysis blends families. Disagreement (I²) gates the final number.<\u002Fp>\n        <div class=\"pipe-arrow\" data-om-id=\"94ead2f5:348\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pipe-step\" data-om-id=\"94ead2f5:349\">\n        <div class=\"icon\" data-om-id=\"94ead2f5:350\">▸<\u002Fdiv>\n        <div class=\"num\" data-om-id=\"94ead2f5:351\">05 · NOWCAST<\u002Fdiv>\n        <h3 data-om-id=\"94ead2f5:352\">ECI(t)<\u002Fh3>\n        <p data-om-id=\"94ead2f5:353\">Rolling windows → a live coherence index, with QA flags, uncertainty bands, regime markers.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <!-- ============ SLIDE 8: ECI DASHBOARD ============ -->\n  <section class=\"s-eci\" data-label=\"ECI Dashboard\" data-om-id=\"94ead2f5:354\" data-screen-label=\"08 ECI Dashboard\" data-om-validate=\"no_overflowing_text,no_overlapping_text,slide_sized_text\" data-deck-slide=\"7\">\n    <div class=\"grid-bg\" data-om-id=\"94ead2f5:355\"><\u002Fdiv>\n    <div class=\"chrome\" data-om-id=\"94ead2f5:356\">\n      <div class=\"brand\" data-om-id=\"94ead2f5:357\"><span class=\"brand-mark\" data-om-id=\"94ead2f5:358\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" data-om-id=\"94ead2f5:359\"><path d=\"M2 18 L7 18 L9 6 L12 22 L15 10 L17 18 L22 18\" stroke=\"#5dd2ff\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" data-om-id=\"94ead2f5:360\"><\u002Fpath><\u002Fsvg>\n      <\u002Fspan>Rhythmic Economics<\u002Fdiv>\n      <div class=\"topic\" data-om-id=\"94ead2f5:361\">07 · ECI Live<\u002Fdiv>\n      <div class=\"foot\" data-om-id=\"94ead2f5:362\"><span data-om-id=\"94ead2f5:363\">Section III<\u002Fspan><span data-om-id=\"94ead2f5:364\">A live structural pulse<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"eci-side\" data-om-id=\"94ead2f5:365\">\n      <div class=\"chip\" data-om-id=\"94ead2f5:366\"><span class=\"dot\" data-om-id=\"94ead2f5:367\"><\u002Fspan>Live nowcast<\u002Fdiv>\n      <h2 style=\"font:300 56px/1 var(--serif); margin:0; letter-spacing:-0.03em;\" data-om-id=\"94ead2f5:368\">The market's<br data-om-id=\"94ead2f5:369\"><em style=\"font-style:italic; color:var(--cyan);\" data-om-id=\"94ead2f5:370\">tempo<\u002Fem><br data-om-id=\"94ead2f5:371\">in one number.<\u002Fh2>\n\n      <div style=\"margin-top: 14px;\" data-om-id=\"94ead2f5:372\">\n        <div class=\"eci-stat\" data-om-id=\"94ead2f5:373\">\n          <div class=\"k\" data-om-id=\"94ead2f5:374\">Estimation error<\u002Fdiv>\n          <div class=\"v\" data-om-id=\"94ead2f5:375\">0.56<span class=\"unit\" data-om-id=\"94ead2f5:376\">%<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"eci-stat\" data-om-id=\"94ead2f5:377\">\n          <div class=\"k\" data-om-id=\"94ead2f5:378\">Avg early-warning lead<\u002Fdiv>\n          <div class=\"v\" data-om-id=\"94ead2f5:379\">9<span class=\"unit\" data-om-id=\"94ead2f5:380\">months<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"eci-stat\" data-om-id=\"94ead2f5:381\">\n          <div class=\"k\" data-om-id=\"94ead2f5:382\">α vs crisis frequency<\u002Fdiv>\n          <div class=\"v\" data-om-id=\"94ead2f5:383\">r = −0.91<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"eci-stat\" data-om-id=\"94ead2f5:384\">\n          <div class=\"k\" data-om-id=\"94ead2f5:385\">α vs avg drawdown<\u002Fdiv>\n          <div class=\"v\" data-om-id=\"94ead2f5:386\">r = −0.95<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"eci-main\" data-om-id=\"94ead2f5:387\">\n      <div style=\"display:flex; justify-content:space-between; align-items:flex-end; margin-bottom: 30px;\" data-om-id=\"94ead2f5:388\">\n        <div data-om-id=\"94ead2f5:389\">\n          <div class=\"label\" data-om-id=\"94ead2f5:390\">ECI(t)  ·  60-month rolling<\u002Fdiv>\n          <div style=\"font:500 22px/1 var(--mono); color:var(--ink); margin-top:8px; letter-spacing:.1em;\" data-om-id=\"94ead2f5:391\">SIMULATION SUITE  ·  S1 – S3<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:14px;\" data-om-id=\"94ead2f5:392\">\n          <span class=\"chip good\" data-om-id=\"94ead2f5:393\"><span class=\"dot\" data-om-id=\"94ead2f5:394\"><\u002Fspan>QA · green<\u002Fspan>\n          <span class=\"chip\" data-om-id=\"94ead2f5:395\"><span class=\"dot\" data-om-id=\"94ead2f5:396\"><\u002Fspan>I² = 0.12<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Mini SVG line + 3D bars -->\n      <div style=\"position:relative; height: 540px;\" data-om-id=\"94ead2f5:397\">\n        <svg viewBox=\"0 0 1100 540\" preserveAspectRatio=\"none\" style=\"width:100%; height:100%;\" data-om-id=\"94ead2f5:398\">\n          <defs data-om-id=\"94ead2f5:399\">\n            <linearGradient id=\"eciFill\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\" data-om-id=\"94ead2f5:400\">\n              <stop offset=\"0%\" stop-color=\"#5dd2ff\" stop-opacity=\"0.35\" data-om-id=\"94ead2f5:401\"><\u002Fstop>\n              <stop offset=\"100%\" stop-color=\"#5dd2ff\" stop-opacity=\"0\" data-om-id=\"94ead2f5:402\"><\u002Fstop>\n            <\u002FlinearGradient>\n          <\u002Fdefs>\n\n          <!-- y-axis -->\n          <g font-family=\"JetBrains Mono\" font-size=\"11\" fill=\"#4a556a\" letter-spacing=\"2\" data-om-id=\"94ead2f5:403\">\n            <text x=\"40\" y=\"50\" data-om-id=\"94ead2f5:404\">0.60<\u002Ftext><line x1=\"80\" y1=\"46\" x2=\"1080\" y2=\"46\" stroke=\"rgba(255,255,255,0.05)\" data-om-id=\"94ead2f5:405\"><\u002Fline>\n            <text x=\"40\" y=\"160\" data-om-id=\"94ead2f5:406\">0.50<\u002Ftext><line x1=\"80\" y1=\"156\" x2=\"1080\" y2=\"156\" stroke=\"rgba(255,255,255,0.05)\" data-om-id=\"94ead2f5:407\"><\u002Fline>\n            <text x=\"40\" y=\"270\" data-om-id=\"94ead2f5:408\">0.40<\u002Ftext><line x1=\"80\" y1=\"266\" x2=\"1080\" y2=\"266\" stroke=\"rgba(93,210,255,0.15)\" stroke-dasharray=\"2 4\" data-om-id=\"94ead2f5:409\"><\u002Fline>\n            <text x=\"40\" y=\"380\" data-om-id=\"94ead2f5:410\">0.30<\u002Ftext><line x1=\"80\" y1=\"376\" x2=\"1080\" y2=\"376\" stroke=\"rgba(255,255,255,0.05)\" data-om-id=\"94ead2f5:411\"><\u002Fline>\n            <text x=\"40\" y=\"490\" data-om-id=\"94ead2f5:412\">0.20<\u002Ftext><line x1=\"80\" y1=\"486\" x2=\"1080\" y2=\"486\" stroke=\"rgba(255,255,255,0.05)\" data-om-id=\"94ead2f5:413\"><\u002Fline>\n          <\u002Fg>\n\n          <!-- regime bands -->\n          <rect x=\"80\" y=\"20\" width=\"200\" height=\"500\" fill=\"rgba(90,243,160,0.04)\" data-om-id=\"94ead2f5:414\"><\u002Frect>\n          <rect x=\"280\" y=\"20\" width=\"200\" height=\"500\" fill=\"rgba(255,214,107,0.04)\" data-om-id=\"94ead2f5:415\"><\u002Frect>\n          <rect x=\"480\" y=\"20\" width=\"200\" height=\"500\" fill=\"rgba(255,141,90,0.06)\" data-om-id=\"94ead2f5:416\"><\u002Frect>\n          <rect x=\"680\" y=\"20\" width=\"200\" height=\"500\" fill=\"rgba(255,214,107,0.04)\" data-om-id=\"94ead2f5:417\"><\u002Frect>\n          <rect x=\"880\" y=\"20\" width=\"200\" height=\"500\" fill=\"rgba(90,243,160,0.04)\" data-om-id=\"94ead2f5:418\"><\u002Frect>\n\n          <!-- band labels -->\n          <g font-family=\"JetBrains Mono\" font-size=\"10\" fill=\"#8a97ac\" letter-spacing=\"2\" data-om-id=\"94ead2f5:419\">\n            <text x=\"180\" y=\"38\" text-anchor=\"middle\" data-om-id=\"94ead2f5:420\">STABLE<\u002Ftext>\n            <text x=\"380\" y=\"38\" text-anchor=\"middle\" data-om-id=\"94ead2f5:421\">PRE-CRISIS<\u002Ftext>\n            <text x=\"580\" y=\"38\" text-anchor=\"middle\" data-om-id=\"94ead2f5:422\">CRISIS<\u002Ftext>\n            <text x=\"780\" y=\"38\" text-anchor=\"middle\" data-om-id=\"94ead2f5:423\">RECOVERY<\u002Ftext>\n            <text x=\"980\" y=\"38\" text-anchor=\"middle\" data-om-id=\"94ead2f5:424\">REBUILD<\u002Ftext>\n          <\u002Fg>\n\n          <!-- area fill under curve -->\n          <path d=\"M 80,90 C 140,110 200,80 280,100 C 360,130 440,170 480,210 C 530,260 580,400 620,430 C 660,440 720,360 780,290 C 840,230 920,180 1080,140 L 1080,520 L 80,520 Z\" fill=\"url(#eciFill)\" data-om-id=\"94ead2f5:425\"><\u002Fpath>\n\n          <!-- shadow line -->\n          <path d=\"M 80,90 C 140,110 200,80 280,100 C 360,130 440,170 480,210 C 530,260 580,400 620,430 C 660,440 720,360 780,290 C 840,230 920,180 1080,140\" stroke=\"rgba(93,210,255,0.3)\" stroke-width=\"4\" fill=\"none\" filter=\"blur(4)\" data-om-id=\"94ead2f5:426\"><\u002Fpath>\n          <!-- main line -->\n          <path id=\"eciCurve\" d=\"M 80,90 C 140,110 200,80 280,100 C 360,130 440,170 480,210 C 530,260 580,400 620,430 C 660,440 720,360 780,290 C 840,230 920,180 1080,140\" stroke=\"#5dd2ff\" stroke-width=\"2.5\" fill=\"none\" data-om-id=\"94ead2f5:427\"><\u002Fpath>\n\n          <!-- crisis markers -->\n          <g data-om-id=\"94ead2f5:428\">\n            <circle cx=\"620\" cy=\"430\" r=\"8\" fill=\"#ff8d5a\" data-om-id=\"94ead2f5:429\"><\u002Fcircle>\n            <circle cx=\"620\" cy=\"430\" r=\"14\" fill=\"none\" stroke=\"#ff8d5a\" stroke-width=\"1\" opacity=\"0.5\" data-om-id=\"94ead2f5:430\"><\u002Fcircle>\n            <text x=\"620\" y=\"465\" fill=\"#ff8d5a\" font-family=\"JetBrains Mono\" font-size=\"14\" text-anchor=\"middle\" letter-spacing=\"2\" data-om-id=\"94ead2f5:431\">α = 0.20<\u002Ftext>\n          <\u002Fg>\n          <g data-om-id=\"94ead2f5:432\">\n            <circle cx=\"180\" cy=\"90\" r=\"6\" fill=\"#5af3a0\" data-om-id=\"94ead2f5:433\"><\u002Fcircle>\n            <text x=\"180\" y=\"115\" fill=\"#5af3a0\" font-family=\"JetBrains Mono\" font-size=\"13\" text-anchor=\"middle\" letter-spacing=\"2\" data-om-id=\"94ead2f5:434\">0.55<\u002Ftext>\n          <\u002Fg>\n\n          <!-- decoherence event arrow -->\n          <g stroke=\"#ff6478\" fill=\"none\" stroke-width=\"1.5\" data-om-id=\"94ead2f5:435\">\n            <line x1=\"380\" y1=\"380\" x2=\"380\" y2=\"180\" data-om-id=\"94ead2f5:436\"><\u002Fline>\n            <path d=\"M 374 188 L 380 178 L 386 188\" data-om-id=\"94ead2f5:437\"><\u002Fpath>\n          <\u002Fg>\n          <text x=\"396\" y=\"200\" fill=\"#ff6478\" font-family=\"JetBrains Mono\" font-size=\"13\" letter-spacing=\"2\" data-om-id=\"94ead2f5:438\">Δα⁻  decoherence<\u002Ftext>\n          <text x=\"396\" y=\"220\" fill=\"#ff6478\" font-family=\"JetBrains Mono\" font-size=\"11\" letter-spacing=\"2\" opacity=\"0.7\" data-om-id=\"94ead2f5:439\">→ recession in ~9 mo<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; justify-content:space-between; padding-top: 20px; border-top:1px solid var(--panel-line); margin-top: 18px;\" data-om-id=\"94ead2f5:440\">\n        <div class=\"label\" data-om-id=\"94ead2f5:441\">TIME  →<\u002Fdiv>\n        <div class=\"label\" data-om-id=\"94ead2f5:442\">FAMILIES  ·  microstructure · credit · logistics · sentiment<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <!-- ============ SLIDE 9: HYPOTHESES ============ -->\n  <section class=\"s-hyp\" data-label=\"Hypotheses\" data-om-id=\"94ead2f5:443\" data-screen-label=\"09 Hypotheses\" data-om-validate=\"no_overflowing_text,no_overlapping_text,slide_sized_text\" data-deck-slide=\"8\">\n    <div class=\"grid-bg\" data-om-id=\"94ead2f5:444\"><\u002Fdiv>\n    <div class=\"chrome\" data-om-id=\"94ead2f5:445\">\n      <div class=\"brand\" data-om-id=\"94ead2f5:446\"><span class=\"brand-mark\" data-om-id=\"94ead2f5:447\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" data-om-id=\"94ead2f5:448\"><path d=\"M2 18 L7 18 L9 6 L12 22 L15 10 L17 18 L22 18\" stroke=\"#5dd2ff\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" data-om-id=\"94ead2f5:449\"><\u002Fpath><\u002Fsvg>\n      <\u002Fspan>Rhythmic Economics<\u002Fdiv>\n      <div class=\"topic\" data-om-id=\"94ead2f5:450\">08 · Three falsifiable hypotheses<\u002Fdiv>\n      <div class=\"foot\" data-om-id=\"94ead2f5:451\"><span data-om-id=\"94ead2f5:452\">Section IV<\u002Fspan><span data-om-id=\"94ead2f5:453\">Predictions that can be wrong<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-om-id=\"94ead2f5:454\">\n      <div class=\"chip\" data-om-id=\"94ead2f5:455\"><span class=\"dot\" data-om-id=\"94ead2f5:456\"><\u002Fspan>The bet<\u002Fdiv>\n      <h2 class=\"h-title\" style=\"margin-top:18px;\" data-om-id=\"94ead2f5:457\">Three predictions. <em style=\"font-style:italic; color:var(--cyan);\" data-om-id=\"94ead2f5:458\">Each can fail.<\u002Fem><\u002Fh2>\n    <\u002Fdiv>\n\n    <div class=\"hyp-grid\" data-om-id=\"94ead2f5:459\">\n      <div class=\"hyp-card\" data-h=\"1\" data-om-id=\"94ead2f5:460\">\n        <div class=\"tag\" data-om-id=\"94ead2f5:461\">H1 · Resilience<\u002Fdiv>\n        <h3 data-om-id=\"94ead2f5:462\">Higher α,<br data-om-id=\"94ead2f5:463\">shallower fall.<\u002Fh3>\n        <p class=\"desc\" data-om-id=\"94ead2f5:464\">Economies with higher baseline coherence absorb shocks better. Drawdowns are smaller, recoveries are quicker.<\u002Fp>\n        <div class=\"hyp-icon\" data-om-id=\"94ead2f5:465\">\n          <svg viewBox=\"0 0 320 200\" style=\"width:100%; height:100%;\" data-om-id=\"94ead2f5:466\">\n            <path d=\"M 20 80 Q 80 60, 140 90 Q 200 120, 280 70\" stroke=\"#5dd2ff\" stroke-width=\"2\" fill=\"none\" data-om-id=\"94ead2f5:467\"><\u002Fpath>\n            <path d=\"M 20 80 Q 80 60, 140 170 Q 200 180, 280 130\" stroke=\"#ff8d5a\" stroke-width=\"2\" fill=\"none\" stroke-dasharray=\"4 4\" data-om-id=\"94ead2f5:468\"><\u002Fpath>\n            <text x=\"282\" y=\"65\" fill=\"#5dd2ff\" font-family=\"JetBrains Mono\" font-size=\"10\" letter-spacing=\"2\" data-om-id=\"94ead2f5:469\">α = 0.55<\u002Ftext>\n            <text x=\"282\" y=\"148\" fill=\"#ff8d5a\" font-family=\"JetBrains Mono\" font-size=\"10\" letter-spacing=\"2\" data-om-id=\"94ead2f5:470\">α = 0.25<\u002Ftext>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <div class=\"hyp-prediction\" data-om-id=\"94ead2f5:471\">β &lt; 0  in  drawdown ~ ᾱ + controls<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"hyp-card\" data-h=\"2\" data-om-id=\"94ead2f5:472\">\n        <div class=\"tag\" data-om-id=\"94ead2f5:473\">H2 · Anticipation<\u002Fdiv>\n        <h3 data-om-id=\"94ead2f5:474\">Coherence breaks <em style=\"font-style:italic;\" data-om-id=\"94ead2f5:475\">first.<\u002Fem><\u002Fh3>\n        <p class=\"desc\" data-om-id=\"94ead2f5:476\">A sharp drop in α precedes recessions by 6–18 months. Δα⁻ is a leading indicator distinct from VIX, term spreads, or credit indices.<\u002Fp>\n        <div class=\"hyp-icon\" data-om-id=\"94ead2f5:477\">\n          <svg viewBox=\"0 0 320 200\" style=\"width:100%; height:100%;\" data-om-id=\"94ead2f5:478\">\n            <path d=\"M 20 60 L 80 80 L 120 130 L 180 140 L 240 100 L 280 90\" stroke=\"#b189ff\" stroke-width=\"2\" fill=\"none\" data-om-id=\"94ead2f5:479\"><\u002Fpath>\n            <path d=\"M 20 80 L 80 90 L 120 100 L 180 105 L 240 165 L 280 175\" stroke=\"#aab4c6\" stroke-width=\"2\" fill=\"none\" stroke-dasharray=\"3 3\" data-om-id=\"94ead2f5:480\"><\u002Fpath>\n            <line x1=\"120\" y1=\"30\" x2=\"120\" y2=\"180\" stroke=\"#b189ff\" stroke-width=\"1\" stroke-dasharray=\"2 4\" data-om-id=\"94ead2f5:481\"><\u002Fline>\n            <line x1=\"220\" y1=\"30\" x2=\"220\" y2=\"180\" stroke=\"#aab4c6\" stroke-width=\"1\" stroke-dasharray=\"2 4\" data-om-id=\"94ead2f5:482\"><\u002Fline>\n            <text x=\"120\" y=\"22\" fill=\"#b189ff\" font-family=\"JetBrains Mono\" font-size=\"10\" text-anchor=\"middle\" letter-spacing=\"2\" data-om-id=\"94ead2f5:483\">Δα⁻<\u002Ftext>\n            <text x=\"220\" y=\"22\" fill=\"#aab4c6\" font-family=\"JetBrains Mono\" font-size=\"10\" text-anchor=\"middle\" letter-spacing=\"2\" data-om-id=\"94ead2f5:484\">price<\u002Ftext>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <div class=\"hyp-prediction\" data-om-id=\"94ead2f5:485\">P(stress | Δα⁻) &gt; baseline  at  h = 6–18mo<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"hyp-card\" data-h=\"3\" data-om-id=\"94ead2f5:486\">\n        <div class=\"tag\" data-om-id=\"94ead2f5:487\">H3 · Cascade<\u002Fdiv>\n        <h3 data-om-id=\"94ead2f5:488\">Up the layers,<br data-om-id=\"94ead2f5:489\">up goes α.<\u002Fh3>\n        <p class=\"desc\" data-om-id=\"94ead2f5:490\">From firm to sector to macro, coherence is non-decreasing. Information flows forward — micro to meso to macro.<\u002Fp>\n        <div class=\"hyp-icon\" data-om-id=\"94ead2f5:491\">\n          <svg viewBox=\"0 0 320 200\" style=\"width:100%; height:100%;\" data-om-id=\"94ead2f5:492\">\n            <g data-om-id=\"94ead2f5:493\">\n              <rect x=\"40\" y=\"130\" width=\"60\" height=\"40\" fill=\"rgba(255,214,107,0.2)\" stroke=\"#ffd66b\" data-om-id=\"94ead2f5:494\"><\u002Frect>\n              <rect x=\"130\" y=\"100\" width=\"60\" height=\"70\" fill=\"rgba(255,214,107,0.3)\" stroke=\"#ffd66b\" data-om-id=\"94ead2f5:495\"><\u002Frect>\n              <rect x=\"220\" y=\"60\" width=\"60\" height=\"110\" fill=\"rgba(255,214,107,0.5)\" stroke=\"#ffd66b\" data-om-id=\"94ead2f5:496\"><\u002Frect>\n              <text x=\"70\" y=\"190\" fill=\"#aab4c6\" font-family=\"JetBrains Mono\" font-size=\"10\" text-anchor=\"middle\" data-om-id=\"94ead2f5:497\">MICRO<\u002Ftext>\n              <text x=\"160\" y=\"190\" fill=\"#aab4c6\" font-family=\"JetBrains Mono\" font-size=\"10\" text-anchor=\"middle\" data-om-id=\"94ead2f5:498\">MESO<\u002Ftext>\n              <text x=\"250\" y=\"190\" fill=\"#aab4c6\" font-family=\"JetBrains Mono\" font-size=\"10\" text-anchor=\"middle\" data-om-id=\"94ead2f5:499\">MACRO<\u002Ftext>\n              <path d=\"M 100 150 L 130 135\" stroke=\"#ffd66b\" stroke-width=\"1.5\" marker-end=\"url(#arrGold2)\" data-om-id=\"94ead2f5:500\"><\u002Fpath>\n              <path d=\"M 190 135 L 220 115\" stroke=\"#ffd66b\" stroke-width=\"1.5\" marker-end=\"url(#arrGold2)\" data-om-id=\"94ead2f5:501\"><\u002Fpath>\n              <defs data-om-id=\"94ead2f5:502\">\n                <marker id=\"arrGold2\" viewBox=\"0 0 10 10\" refX=\"6\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\" data-om-id=\"94ead2f5:503\"><path d=\"M0 0 L8 5 L0 10 z\" fill=\"#ffd66b\" data-om-id=\"94ead2f5:504\"><\u002Fpath><\u002Fmarker>\n              <\u002Fdefs>\n            <\u002Fg>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <div class=\"hyp-prediction\" data-om-id=\"94ead2f5:505\">α_micro  ≤  α_meso  ≤  α_macro<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <!-- ============ SLIDE 10: PHASE SPECTRUM ============ -->\n  <section class=\"s-phase\" data-label=\"Phase Spectrum\" data-om-id=\"94ead2f5:506\" data-screen-label=\"10 Phase Spectrum\" data-om-validate=\"no_overflowing_text,no_overlapping_text,slide_sized_text\" data-deck-slide=\"9\">\n    <div class=\"grid-bg\" data-om-id=\"94ead2f5:507\"><\u002Fdiv>\n    <div class=\"chrome\" data-om-id=\"94ead2f5:508\">\n      <div class=\"brand\" data-om-id=\"94ead2f5:509\"><span class=\"brand-mark\" data-om-id=\"94ead2f5:510\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" data-om-id=\"94ead2f5:511\"><path d=\"M2 18 L7 18 L9 6 L12 22 L15 10 L17 18 L22 18\" stroke=\"#5dd2ff\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" data-om-id=\"94ead2f5:512\"><\u002Fpath><\u002Fsvg>\n      <\u002Fspan>Rhythmic Economics<\u002Fdiv>\n      <div class=\"topic\" data-om-id=\"94ead2f5:513\">09 · The Stability Spectrum  ·  <span style=\"color:var(--cyan);\" data-om-id=\"94ead2f5:514\">click to scrub →<\u002Fspan><\u002Fdiv>\n      <div class=\"foot\" data-om-id=\"94ead2f5:515\"><span data-om-id=\"94ead2f5:516\">Section V<\u002Fspan><span data-om-id=\"94ead2f5:517\">From healthy → viscous → bifurcation<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-om-id=\"94ead2f5:518\">\n      <div class=\"chip\" data-om-id=\"94ead2f5:519\"><span class=\"dot\" data-om-id=\"94ead2f5:520\"><\u002Fspan>A periodic table of market states<\u002Fdiv>\n      <h2 class=\"h-title\" style=\"margin-top:14px;\" data-om-id=\"94ead2f5:521\">Markets have <em style=\"font-style:italic; color:var(--cyan);\" data-om-id=\"94ead2f5:522\">phases<\u002Fem>, like water has steam, liquid, ice.<\u002Fh2>\n    <\u002Fdiv>\n\n    <div class=\"phase-meter\" id=\"phaseMeter\" data-om-id=\"94ead2f5:523\">\n      <div class=\"phase-fill\" data-om-id=\"94ead2f5:524\"><\u002Fdiv>\n      <div class=\"phase-ticks\" data-om-id=\"94ead2f5:525\">\n        <div class=\"phase-tick\" style=\"left:25%\" data-om-id=\"94ead2f5:526\"><\u002Fdiv>\n        <div class=\"phase-tick\" style=\"left:50%\" data-om-id=\"94ead2f5:527\"><\u002Fdiv>\n        <div class=\"phase-tick\" style=\"left:75%\" data-om-id=\"94ead2f5:528\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"phase-needle\" id=\"phaseNeedle\" data-value=\"α = 0.49\" style=\"left: 45.9761%;\" data-om-id=\"94ead2f5:529\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"phase-labels\" data-om-id=\"94ead2f5:530\">\n      <div class=\"phase-state crash\" data-phase=\"crash\" data-needle=\"18\" data-om-id=\"94ead2f5:531\" style=\"cursor: pointer;\">\n        <h4 data-om-id=\"94ead2f5:532\">Phase Bifurcation<\u002Fh4>\n        <div class=\"range\" data-om-id=\"94ead2f5:533\">α &lt; 0.50  ·  the crash<\u002Fdiv>\n        <p data-om-id=\"94ead2f5:534\">The market fractures into anti-persistent chaos. Time and structure decouple. Flash crash phenomenology.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"phase-state healthy\" data-phase=\"healthy\" data-needle=\"55\" data-om-id=\"94ead2f5:535\" style=\"cursor: pointer;\">\n        <h4 data-om-id=\"94ead2f5:536\">Laminar Flow<\u002Fh4>\n        <div class=\"range\" data-om-id=\"94ead2f5:537\">α ≈ 0.55 ± 0.05  ·  healthy<\u002Fdiv>\n        <p data-om-id=\"94ead2f5:538\">Structurally sound, slightly persistent. Time scales smoothly with volume — liquidity transport is efficient.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"phase-state viscous\" data-phase=\"viscous\" data-needle=\"78\" data-om-id=\"94ead2f5:539\" style=\"cursor: pointer;\">\n        <h4 data-om-id=\"94ead2f5:540\">Viscous Stress<\u002Fh4>\n        <div class=\"range\" data-om-id=\"94ead2f5:541\">α &gt; 0.60  ·  under load<\u002Fdiv>\n        <p data-om-id=\"94ead2f5:542\">The market still works but suffers severe topological friction. Solvency crisis, exogenous shock, sticky liquidity.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n\n  <!-- ============ SLIDE 11: HISTORICAL CRASHES ============ -->\n  <section class=\"s-crash\" data-label=\"Crashes\" data-om-id=\"94ead2f5:543\" data-screen-label=\"11 Crashes\" data-om-validate=\"no_overflowing_text,no_overlapping_text,slide_sized_text\" data-deck-slide=\"10\">\n    <div class=\"grid-bg\" data-om-id=\"94ead2f5:544\"><\u002Fdiv>\n    <div class=\"chrome\" data-om-id=\"94ead2f5:545\">\n      <div class=\"brand\" data-om-id=\"94ead2f5:546\"><span class=\"brand-mark\" data-om-id=\"94ead2f5:547\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" data-om-id=\"94ead2f5:548\"><path d=\"M2 18 L7 18 L9 6 L12 22 L15 10 L17 18 L22 18\" stroke=\"#5dd2ff\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" data-om-id=\"94ead2f5:549\"><\u002Fpath><\u002Fsvg>\n      <\u002Fspan>Rhythmic Economics<\u002Fdiv>\n      <div class=\"topic\" data-om-id=\"94ead2f5:550\">10 · The forensic record<\u002Fdiv>\n      <div class=\"foot\" data-om-id=\"94ead2f5:551\"><span data-om-id=\"94ead2f5:552\">Section VI<\u002Fspan><span data-om-id=\"94ead2f5:553\">13 crashes, one signature<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-om-id=\"94ead2f5:554\">\n      <div class=\"chip warn\" data-om-id=\"94ead2f5:555\"><span class=\"dot\" data-om-id=\"94ead2f5:556\"><\u002Fspan>In-sample · forensic<\u002Fdiv>\n      <h2 class=\"h-title\" style=\"margin-top:14px;\" data-om-id=\"94ead2f5:557\">Every crash<br data-om-id=\"94ead2f5:558\">broke <em style=\"font-style:italic; color:var(--orange);\" data-om-id=\"94ead2f5:559\">coherence first.<\u002Fem><\u002Fh2>\n      <p class=\"body-md\" style=\"margin-top: 24px; max-width: 580px;\" data-om-id=\"94ead2f5:560\">\n        Across thirteen major crashes — S&amp;P 500, gold, crypto — the network decorrelated <span class=\"accent-cyan\" data-om-id=\"94ead2f5:561\">~10 days before<\u002Fspan> the price trough.\n      <\u002Fp>\n\n      <div class=\"crash-events\" data-om-id=\"94ead2f5:562\">\n        <div class=\"crash-event\" data-om-id=\"94ead2f5:563\"><div class=\"yr\" data-om-id=\"94ead2f5:564\">2008<\u002Fdiv><div class=\"name\" data-om-id=\"94ead2f5:565\">Global Financial Crisis<span class=\"sub\" data-om-id=\"94ead2f5:566\">S&amp;P 500<\u002Fspan><\u002Fdiv><div class=\"drop\" data-om-id=\"94ead2f5:567\">Δα = −0.27<\u002Fdiv><\u002Fdiv>\n        <div class=\"crash-event\" data-om-id=\"94ead2f5:568\"><div class=\"yr\" data-om-id=\"94ead2f5:569\">2020<\u002Fdiv><div class=\"name\" data-om-id=\"94ead2f5:570\">COVID Liquidity Vacuum<span class=\"sub\" data-om-id=\"94ead2f5:571\">BTC · S&amp;P<\u002Fspan><\u002Fdiv><div class=\"drop\" data-om-id=\"94ead2f5:572\">Δα = −0.22<\u002Fdiv><\u002Fdiv>\n        <div class=\"crash-event\" data-om-id=\"94ead2f5:573\"><div class=\"yr\" data-om-id=\"94ead2f5:574\">2022<\u002Fdiv><div class=\"name\" data-om-id=\"94ead2f5:575\">FTX Solvency Cascade<span class=\"sub\" data-om-id=\"94ead2f5:576\">BTC · viscous<\u002Fspan><\u002Fdiv><div class=\"drop\" data-om-id=\"94ead2f5:577\">Δα = −0.14<\u002Fdiv><\u002Fdiv>\n        <div class=\"crash-event\" data-om-id=\"94ead2f5:578\"><div class=\"yr\" data-om-id=\"94ead2f5:579\">2001<\u002Fdiv><div class=\"name\" data-om-id=\"94ead2f5:580\">Dot-Com Implosion<span class=\"sub\" data-om-id=\"94ead2f5:581\">NASDAQ<\u002Fspan><\u002Fdiv><div class=\"drop\" data-om-id=\"94ead2f5:582\">Δα = −0.18<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"crash-chart\" data-om-id=\"94ead2f5:583\">\n      <div style=\"display:flex; justify-content:space-between; align-items:flex-start;\" data-om-id=\"94ead2f5:584\">\n        <div data-om-id=\"94ead2f5:585\">\n          <div class=\"label\" data-om-id=\"94ead2f5:586\">α-DROP vs CRASH SEVERITY<\u002Fdiv>\n          <div style=\"font:500 22px/1 var(--mono); color:var(--ink); margin-top: 10px;\" data-om-id=\"94ead2f5:587\">Cohen's d = −1.45<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:right;\" data-om-id=\"94ead2f5:588\">\n          <div class=\"label\" data-om-id=\"94ead2f5:589\">LEAD TIME<\u002Fdiv>\n          <div style=\"font:300 56px/1 var(--serif); color:var(--cyan); letter-spacing:-0.03em;\" data-om-id=\"94ead2f5:590\">9.75<span style=\"font-size:.4em; color:var(--ink-dim); margin-left:.2em;\" data-om-id=\"94ead2f5:591\">days<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top: 30px; position:relative; height: 480px;\" data-om-id=\"94ead2f5:592\">\n        <svg viewBox=\"0 0 600 480\" preserveAspectRatio=\"none\" style=\"width:100%; height:100%;\" data-om-id=\"94ead2f5:593\">\n          <!-- baseline -->\n          <line x1=\"40\" y1=\"200\" x2=\"560\" y2=\"200\" stroke=\"rgba(90,243,160,0.3)\" stroke-dasharray=\"4 4\" data-om-id=\"94ead2f5:594\"><\u002Fline>\n          <text x=\"50\" y=\"194\" fill=\"#5af3a0\" font-family=\"JetBrains Mono\" font-size=\"11\" letter-spacing=\"2\" data-om-id=\"94ead2f5:595\">α = 0.55  baseline<\u002Ftext>\n\n          <!-- price line (later) -->\n          <path d=\"M 40 220 L 120 240 L 200 245 L 280 250 L 340 320 L 380 410 L 420 430 L 480 420 L 560 380\" stroke=\"#8a97ac\" stroke-width=\"2\" fill=\"none\" data-om-id=\"94ead2f5:596\"><\u002Fpath>\n          <text x=\"500\" y=\"364\" fill=\"#8a97ac\" font-family=\"JetBrains Mono\" font-size=\"11\" letter-spacing=\"2\" data-om-id=\"94ead2f5:597\">PRICE<\u002Ftext>\n\n          <!-- alpha line (earlier) -->\n          <path d=\"M 40 180 L 120 190 L 200 195 L 240 240 L 280 360 L 320 420 L 360 430 L 420 380 L 480 280 L 560 230\" stroke=\"#ff8d5a\" stroke-width=\"3\" fill=\"none\" data-om-id=\"94ead2f5:598\"><\u002Fpath>\n          <text x=\"480\" y=\"270\" fill=\"#ff8d5a\" font-family=\"JetBrains Mono\" font-size=\"11\" letter-spacing=\"2\" data-om-id=\"94ead2f5:599\">α  (network)<\u002Ftext>\n\n          <!-- lead bracket -->\n          <g stroke=\"#5dd2ff\" stroke-width=\"1.5\" fill=\"none\" data-om-id=\"94ead2f5:600\">\n            <line x1=\"240\" y1=\"60\" x2=\"240\" y2=\"430\" data-om a<\u002Fdiv>\n      <div class=\"foot\" data-om-id=\"94ead2f5:820\"><span data-om-id=\"94ead2f5:821\">End of presentation<\u002Fspan><span data-om-id=\"94ead2f5:822\">α · ECI · RTM<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"close-bars\" id=\"closeBars\" aria-hidden=\"true\" data-om-id=\"94ead2f5:823\"><div style=\"position: relative; width: 110px; height: 240px;\"><div class=\"bar3d\" style=\"width: 110px; height: 240px; --c: #5dd2ff; --fill: 50%; opacity: 0.35;\">\n    <div class=\"wire\"><\u002Fdiv>\n    <div class=\"core\"><\u002Fdiv>\n    <div class=\"top\"><\u002Fdiv>\n    <div class=\"reflect\"><\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv><div style=\"position: relative; width: 110px; height: 420px;\"><div class=\"bar3d\" style=\"width: 110px; height: 420px; --c: #5dd2ff; --fill: 50%; opacity: 0.35;\">\n    <div class=\"wire\"><\u002Fdiv>\n    <div class=\"core\"><\u002Fdiv>\n    <div class=\"top\"><\u002Fdiv>\n    <div class=\"reflect\"><\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv><div style=\"position: relative; width: 110px; height: 600px;\"><div class=\"bar3d\" style=\"width: 110px; height: 600px; --c: #5dd2ff; --fill: 50%; opacity: 0.35;\">\n    <div class=\"wire\"><\u002Fdiv>\n    <div class=\"core\"><\u002Fdiv>\n    <div class=\"top\"><\u002Fdiv>\n    <div class=\"reflect\"><\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv><div style=\"position: relative; width: 110px; height: 780px;\"><div class=\"bar3d\" style=\"width: 110px; height: 780px; --c: #b189ff; --fill: 75%; opacity: 0.7;\">\n    <div class=\"wire\"><\u002Fdiv>\n    <div class=\"core\"><\u002Fdiv>\n    <div class=\"top\"><\u002Fdiv>\n    <div class=\"reflect\"><\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv><div style=\"position: relative; width: 110px; height: 900px;\"><div class=\"bar3d\" style=\"width: 110px; height: 900px; --c: #5dd2ff; --fill: 90%; opacity: 1;\">\n    <div class=\"wire\"><\u002Fdiv>\n    <div class=\"core\"><\u002Fdiv>\n    <div class=\"top\"><\u002Fdiv>\n    <div class=\"reflect\"><\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv><div style=\"position: relative; width: 110px; height: 780px;\"><div class=\"bar3d\" style=\"width: 110px; height: 780px; --c: #b189ff; --fill: 75%; opacity: 0.7;\">\n    <div class=\"wire\"><\u002Fdiv>\n    <div class=\"core\"><\u002Fdiv>\n    <div class=\"top\"><\u002Fdiv>\n    <div class=\"reflect\"><\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv><div style=\"position: relative; width: 110px; height: 600px;\"><div class=\"bar3d\" style=\"width: 110px; height: 600px; --c: #5dd2ff; --fill: 50%; opacity: 0.35;\">\n    <div class=\"wire\"><\u002Fdiv>\n    <div class=\"core\"><\u002Fdiv>\n    <div class=\"top\"><\u002Fdiv>\n    <div class=\"reflect\"><\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv><div style=\"position: relative; width: 110px; height: 420px;\"><div class=\"bar3d\" style=\"width: 110px; height: 420px; --c: #5dd2ff; --fill: 50%; opacity: 0.35;\">\n    <div class=\"wire\"><\u002Fdiv>\n    <div class=\"core\"><\u002Fdiv>\n    <div class=\"top\"><\u002Fdiv>\n    <div class=\"reflect\"><\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv><div style=\"position: relative; width: 110px; height: 240px;\"><div class=\"bar3d\" style=\"width: 110px; height: 240px; --c: #5dd2ff; --fill: 50%; opacity: 0.35;\">\n    <div class=\"wire\"><\u002Fdiv>\n    <div class=\"core\"><\u002Fdiv>\n    <div class=\"top\"><\u002Fdiv>\n    <div class=\"reflect\"><\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n    <div class=\"close-text\" data-om-id=\"94ead2f5:824\">\n      <div class=\"close-backdrop\" data-om-id=\"94ead2f5:825\"><\u002Fdiv>\n      <div class=\"chip\" style=\"margin-bottom: 30px;\" data-om-id=\"94ead2f5:826\"><span class=\"dot\" data-om-id=\"94ead2f5:827\"><\u002Fspan>Diagnosis over direction<\u002Fdiv>\n      <h2 class=\"h-display\" style=\"font-size: 116px;\" data-om-id=\"94ead2f5:828\">\n        Stop asking<br data-om-id=\"94ead2f5:829\">\n        <span style=\"color:var(--ink-dim);\" data-om-id=\"94ead2f5:830\">\"where will price go?\"<\u002Fspan><br data-om-id=\"94ead2f5:831\">\n        Start asking<br data-om-id=\"94ead2f5:832\">\n        <em data-om-id=\"94ead2f5:833\">\"what's the phase of the system?\"<\u002Fem>\n      <\u002Fh2>\n      <p class=\"body-lg\" style=\"margin: 40px auto 0; text-align:center; max-width: 1100px; font-size:24px;\" data-om-id=\"94ead2f5:834\">\n        Rhythmic Economics measures the <span class=\"accent-cyan\" data-om-id=\"94ead2f5:835\">curvature of economic time.<\u002Fspan> Coherence is not a forecast. It is a <span class=\"accent-purple\" data-om-id=\"94ead2f5:836\">phase reading<\u002Fspan> — a way to know whether the system you depend on is still rhythmic, or already breaking.\n      <\u002Fp>\n\n      <div style=\"margin-top:60px; display:flex; justify-content:center; gap:80px; align-items:center;\" data-om-id=\"94ead2f5:837\">\n        <div style=\"text-align:center;\" data-om-id=\"94ead2f5:838\">\n          <div class=\"label\" data-om-id=\"94ead2f5:839\">PAPER<\u002Fdiv>\n          <div style=\"font:500 18px/1 var(--mono); color:var(--ink); margin-top:8px;\" data-om-id=\"94ead2f5:840\">Rhythmic Economics — Quiceno (2026)<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:center;\" data-om-id=\"94ead2f5:841\">\n          <div class=\"label\" data-om-id=\"94ead2f5:842\">FRAMEWORK<\u002Fdiv>\n          <div style=\"font:500 18px/1 var(--mono); color:var(--ink); margin-top:8px;\" data-om-id=\"94ead2f5:843\">RTM · ECI · α<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:center;\" data-om-id=\"94ead2f5:844\">\n          <div class=\"label\" data-om-id=\"94ead2f5:845\">LICENSE<\u002Fdiv>\n          <div style=\"font:500 18px/1 var(--mono); color:var(--ink); margin-top:8px;\" data-om-id=\"94ead2f5:846\">CC BY 4.0<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdeck-stage>\n\n<script>\n/* BEGIN USAGE */\n/**\n * <deck-stage> — reusable web component for HTML decks.\n *\n * Handles:\n *  (a) speaker notes — reads <script type=\"application/json\" id=\"speakerXnotes\">\n *      and posts {slideIndexChanged: N} to the parent window on nav.\n *  (b) keyboard navigation — ←/→, PgUp/PgDn, Space, Home/End, number keys.\n *      On touch devices, tapping the left/right half of the stage goes\n *      prev/next — taps on links, buttons and other interactive slide\n *      content are left alone.\n *  (c) press R to reset to slide 0 (with a tasteful keyboard hint).\n *  (d) bottom-center overlay showing slide count + hints, fades out on idle.\n *  (e) auto-scaling — inner canvas is a fixed design size (default 1920×1080)\n *      scaled with `transform: scale()` to fit the viewport, letterboxed.\n *      Set the `noscale` attribute to render at authored size (1:1) — the\n *      PPTX exporter sets this so its DOM capture sees unscaled geometry.\n *  (f) print — `@media print` lays every slide out as its own page at the\n *      design size, so the browser's Print → Save as PDF produces a clean\n *      one-page-per-slide PDF with no extra setup.\n *  (g) thumbnail rail — resizable left-hand column of per-slide thumbnails\n *      (static clones). Click to navigate; ↑/↓ with a thumbnail focused to\n *      step between slides; drag to reorder; right-click for\n *      Skip / Move up / Move down / Delete (opens a Cancel/Delete confirm\n *      dialog). Drag the rail's right edge to resize; width persists to\n *      localStorage. Skipped slides carry `data-deck-skip`, are dimmed in\n *      the rail, omitted from prev/next navigation, and hidden at print.\n *      The rail is suppressed in presenting mode, in the host's Preview\n *      mode (ViewerMode='none'), on `noscale`, on narrow viewports\n *      (≤640px), and via the `no-rail` attribute. Rail mutations dispatch\n *      a `deckchange`\n *      CustomEvent on the element: detail = {action, from, to, slide}.\n *\n * Slides are HIDDEN, not unmounted. Non-active slides stay in the DOM with\n * `visibility: hidden` + `opacity: 0`, so their state (videos, iframes,\n * form inputs, React trees) is preserved across navigation.\n *\n * Lifecycle event — the component dispatches a `slidechange` CustomEvent on\n * itself whenever the active slide changes (including the initial mount).\n * The event bubbles and composes out of shadow DOM, so you can listen on\n * the <deck-stage> element or on document:\n *\n *   document.querySelector('deck-stage').addEventListener('slidechange', (e) => {\n *     e.detail.index         // new 0-based index\n *     e.detail.previousIndex // previous index, or -1 on init\n *     e.detail.total         // total slide count\n *     e.detail.slide         // the new active slide element\n *     e.detail.previousSlide // the prior slide element, or null on init\n *     e.detail.reason        // 'init' | 'keyboard' | 'click' | 'tap' | 'api'\n *   });\n *\n * Persistence: none at the deck level. The host app keeps the current slide\n * in its own URL (?slide=) and re-delivers it via location.hash on load, so a\n * bare load with no hash always starts at slide 1.\n *\n * Usage:\n *   <style>deck-stage:not(:defined){visibility:hidden}<\u002Fstyle>\n *   <deck-stage width=\"1920\" height=\"1080\">\n *     <section data-label=\"Title\">...<\u002Fsection>\n *     <section data-label=\"Agenda\">...<\u002Fsection>\n *   <\u002Fdeck-stage>\n *   <script src=\"deck-stage.js\"><\\/script>\n *\n * The :not(:defined) rule prevents a flash of the first slide at its\n * authored styles before this script runs and attaches the shadow root.\n *\n * Slides are the direct element children of <deck-stage>. Each slide is\n * automatically tagged with:\n *   - data-screen-label=\"NN Label\"   (1-indexed, for comment flow)\n *   - data-om-validate=\"no_overflowing_text,no_overlapping_text,slide_sized_text\"\n *\n * Speaker notes stay in sync because the component posts {slideIndexChanged: N}\n * to the parent — just include the #speakerXnotes script tag if asked for notes.\n *\n * Authoring guidance:\n *   - Write slide bodies as static HTML inside <deck-stage>, with sizing via\n *     CSS custom properties in a <style> block rather than JS constants.\n *     Static slide markup is what lets the user click a heading in edit mode\n *     and retype it directly; a slide rendered through <script type=\"text/babel\">,\n *     React, or a loop over a JS array has to round-trip every tweak through a\n *     chat message instead. Reach for script-generated slides only when the\n *     content genuinely needs interactive behaviour static HTML can't express.\n *   - Do NOT set position/inset/width/height on the slide <section> elements —\n *     the component absolutely positions every slotted child for you.\n */\n/* END USAGE */\n\n(() => {\n  const DESIGN_W_DEFAULT = 1920;\n  const DESIGN_H_DEFAULT = 1080;\n  const OVERLAY_HIDE_MS = 1800;\n  const VALIDATE_ATTR = 'no_overflowing_text,no_overlapping_text,slide_sized_text';\n  const FINE_POINTER_MQ = matchMedia('(hover: hover) and (pointer: fine)');\n  const NARROW_MQ = matchMedia('(max-width: 640px)');\n  // Slide-authored controls that should keep a tap instead of it navigating.\n  const INTERACTIVE_SEL = 'a[href], button, input, select, textarea, summary, label, video[controls], audio[controls], [role=\"button\"], [onclick], [tabindex]:not([tabindex^=\"-\"]), [contenteditable]:not([contenteditable=\"false\" i])';\n\n  const pad2 = (n) => String(n).padStart(2, '0');\n\n  // Label precedence: data-label → data-screen-label (number stripped) → first heading → \"Slide\".\n  const getSlideLabel = (el) => {\n    const explicit = el.getAttribute('data-label');\n    if (explicit) return explicit;\n\n    const existing = el.getAttribute('data-screen-label');\n    if (existing) return existing.replace(/^\\s*\\d+\\s*/, '').trim() || existing;\n\n    const h = el.querySelector('h1, h2, h3, [data-title]');\n    const t = h && (h.textContent || '').trim().slice(0, 40);\n    if (t) return t;\n\n    return 'Slide';\n  };\n\n  const stylesheet = `\n    :host {\n      position: fixed;\n      inset: 0;\n      display: block;\n      background: #000;\n      color: #fff;\n      font-family: -apple-system, BlinkMacSystemFont, \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n      overflow: hidden;\n      -webkit-tap-highlight-color: transparent;\n    }\n    /* connectedCallback holds this until document.fonts.ready (capped 2s) so\n     * the first visible paint has the deck's real typography + final rail\n     * layout. opacity (not visibility) so the active slide can't un-hide\n     * itself via the ::slotted([data-deck-active]) visibility:visible rule.\n     * Only the stage/rail hide — the black :host background stays, so the\n     * iframe doesn't flash the page's default white. */\n    :host([data-fonts-pending]) .stage,\n    :host([data-fonts-pending]) .rail { opacity: 0; pointer-events: none; }\n\n    .stage {\n      position: absolute;\n      inset: 0;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n    }\n\n    .canvas {\n      position: relative;\n      transform-origin: center center;\n      flex-shrink: 0;\n      background: #fff;\n      will-change: transform;\n    }\n\n    /* Slides live in light DOM (via <slot>) so authored CSS still applies.\n       We absolutely position each slotted child to stack them. */\n    ::slotted(*) {\n      position: absolute !important;\n      inset: 0 !important;\n      width: 100% !important;\n      height: 100% !important;\n      box-sizing: border-box !important;\n      overflow: hidden;\n      opacity: 0;\n      pointer-events: none;\n      visibility: hidden;\n    }\n    ::slotted([data-deck-active]) {\n      opacity: 1;\n      pointer-events: auto;\n      visibility: visible;\n    }\n\n    .overlay {\n      position: fixed;\n      left: 50%;\n      bottom: 22px;\n      transform: translate(-50%, 6px) scale(0.92);\n      filter: blur(6px);\n      display: flex;\n      align-items: center;\n      gap: 4px;\n      p
