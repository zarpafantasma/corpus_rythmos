  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

3, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"ba3557c9-50f6-406f-9767-bec9da60a078\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"32ebf949-cd7b-4bbd-8aea-24cd02e19f0c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n\n<style>\n  deck-stage:not(:defined){visibility:hidden}\n\n  :root{\n    --ink:        #f3f6fb;\n    --ink-dim:    #8a97ac;\n    --ink-faint:  #4a556a;\n    --bg:         #06090f;\n    --bg-2:       #0b1019;\n    --panel:      rgba(255,255,255,0.04);\n    --panel-line: rgba(255,255,255,0.08);\n\n    --cyan:   #5dd2ff;\n    --purple: #b189ff;\n    --orange: #ff8d5a;\n    --green:  #5af3a0;\n    --red:    #ff6478;\n    --gold:   #ffd66b;\n\n    --serif: \"Fraunces\", Georgia, serif;\n    --sans:  \"Manrope\", -apple-system, system-ui, sans-serif;\n    --mono:  \"JetBrains Mono\", ui-monospace, monospace;\n  }\n\n  html, body { margin:0; background:#000; color:var(--ink); font-family:var(--sans); }\n\n  deck-stage > section{\n    background: radial-gradient(1200px 800px at 70% 30%, #0e1726 0%, var(--bg) 55%, #03050a 100%);\n    color:var(--ink);\n    font-family:var(--sans);\n    overflow:hidden;\n    position:relative;\n  }\n\n  /* — Reusable building blocks — */\n  .grid-bg{\n    position:absolute; inset:0; pointer-events:none;\n    background-image:\n      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),\n      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);\n    background-size: 80px 80px;\n    mask-image: radial-gradient(900px 700px at 50% 60%, #000 30%, transparent 80%);\n  }\n  .vignette{\n    position:absolute; inset:0; pointer-events:none;\n    background: radial-gradient(70% 60% at 50% 45%, transparent 50%, rgba(0,0,0,0.6) 100%);\n  }\n\n  .chip{\n    display:inline-flex; align-items:center; gap:.55em;\n    padding:.45em .9em; border:1px solid var(--panel-line);\n    border-radius:999px; font:500 13px/1 var(--mono);\n    color:var(--ink-dim); letter-spacing:.12em; text-transform:uppercase;\n    background: rgba(255,255,255,0.025);\n  }\n  .chip .dot{ width:7px; height:7px; border-radius:50%; background:var(--cyan); box-shadow:0 0 12px var(--cyan); }\n  .chip.warn .dot{ background:var(--orange); box-shadow:0 0 12px var(--orange); }\n  .chip.good .dot{ background:var(--green); box-shadow:0 0 12px var(--green); }\n\n  .label{ font:500 12px/1 var(--mono); color:var(--ink-faint); letter-spacing:.18em; text-transform:uppercase; }\n  .mono{ font-family:var(--mono); }\n  .serif{ font-family:var(--serif); font-weight:300; }\n  .accent-cyan{ color:var(--cyan); }\n  .accent-purple{ color:var(--purple); }\n  .accent-orange{ color:var(--orange); }\n  .accent-green{ color:var(--green); }\n  .accent-gold{ color:var(--gold); }\n\n  .h-display{\n    font-family:var(--serif); font-weight:300;\n    font-size: 132px; line-height: 0.92; letter-spacing:-0.035em;\n    color:var(--ink);\n  }\n  .h-display em{ font-style:italic; color:var(--cyan); }\n  .h-title{\n    font-family:var(--serif); font-weight:300;\n    font-size: 88px; line-height: 0.95; letter-spacing:-0.03em;\n  }\n  .h-section{\n    font-family:var(--sans); font-weight:600;\n    font-size: 22px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-dim);\n  }\n  .body-lg{ font-size:26px; line-height:1.45; color:#c5cfdd; max-width:900px; }\n  .body-md{ font-size:21px; line-height:1.5; color:#aab4c6; }\n\n  /* — Slide chrome (corner label + pagination) — */\n  .chrome{\n    position:absolute; inset:0; pointer-events:none; z-index:10;\n  }\n  .chrome .brand{\n    position:absolute; top:48px; left:64px;\n    display:flex; align-items:center; gap:14px;\n    font:600 13px/1 var(--mono); letter-spacing:.18em; text-transform:uppercase; color:var(--ink-dim);\n  }\n  .brand-mark{\n    width:22px; height:22px; position:relative;\n  }\n  .brand-mark svg{ width:100%; height:100%; }\n  .chrome .topic{\n    position:absolute; top:48px; right:64px;\n    font:500 13px/1 var(--mono); letter-spacing:.2em; text-transform:uppercase; color:var(--ink-faint);\n  }\n  .chrome .foot{\n    position:absolute; bottom:42px; left:64px; right:64px;\n    display:flex; justify-content:space-between; align-items:center;\n    font:500 12px/1 var(--mono); letter-spacing:.16em; color:var(--ink-faint);\n  }\n\n  /* ============ 3D GLOWING BAR ============ */\n  .bar3d{\n    position:relative;\n    transform-style: preserve-3d;\n    transform: rotateX(-12deg) rotateY(28deg);\n  }\n  .bar3d .wire{\n    position:absolute; inset:0;\n    border:1px solid rgba(255,255,255,0.18);\n  }\n  .bar3d .core{\n    position:absolute; inset:0;\n    background: linear-gradient(180deg,\n      color-mix(in oklab, var(--c, var(--cyan)) 95%, white) 0%,\n      color-mix(in oklab, var(--c, var(--cyan)) 70%, transparent) 60%,\n      color-mix(in oklab, var(--c, var(--cyan)) 20%, transparent) 100%);\n    box-shadow:\n      0 0 60px color-mix(in oklab, var(--c, var(--cyan)) 70%, transparent),\n      0 0 120px color-mix(in oklab, var(--c, var(--cyan)) 40%, transparent),\n      inset 0 30px 60px color-mix(in oklab, var(--c, var(--cyan)) 50%, white);\n  }\n  .bar3d .core::before{\n    content:\"\";\n    position:absolute; left:0; right:0; bottom:0;\n    height: var(--fill, 100%);\n    background: linear-gradient(180deg,\n      color-mix(in oklab, var(--c, var(--cyan)) 90%, white) 0%,\n      color-mix(in oklab, var(--c, var(--cyan)) 50%, black) 100%);\n    transition: height 1.4s cubic-bezier(.2,.7,.2,1);\n  }\n  .bar3d .top{\n    position:absolute; left:0; right:0; top:0;\n    height: 16px; transform-origin: top;\n    transform: rotateX(90deg) translateY(-8px);\n    background: color-mix(in oklab, var(--c, var(--cyan)) 80%, white);\n    filter: brightness(1.4);\n    opacity:.4;\n  }\n  .bar3d .reflect{\n    position:absolute; left:0; right:0; top:100%;\n    height:60%;\n    background: linear-gradient(180deg, color-mix(in oklab, var(--c, var(--cyan)) 40%, transparent), transparent 70%);\n    transform: scaleY(-1); transform-origin: top;\n    opacity:.35; filter: blur(2px);\n    mask-image: linear-gradient(180deg, #000, transparent 70%);\n  }\n\n  /* ============ SLIDE 1: COVER ============ */\n  .s-cover{ display:grid; grid-template-rows: 1fr auto; padding:0; }\n  .cover-bars{\n    position:absolute; inset:0;\n    display:flex; align-items:flex-end; justify-content:center;\n    gap: 70px; padding-bottom: 0;\n    perspective: 2400px;\n  }\n  .cover-bars .bar-wrap{\n    position:relative; width: 130px;\n  }\n  .cover-bars .bar-wrap .label-top{\n    position:absolute; bottom:100%; left:50%; transform:translate(-50%,-20px);\n    font:500 16px/1 var(--mono); color:var(--ink-dim);\n    white-space:nowrap;\n  }\n  .cover-text{\n    position:relative; z-index:5;\n    grid-row:1; align-self:center; justify-self:center;\n    text-align:center; padding-top: 160px;\n  }\n  .cover-text h1,\n  .cover-text .lead,\n  .cover-text .subtitle{\n    text-shadow:\n      0 0 30px rgba(3,5,10,0.95),\n      0 0 60px rgba(3,5,10,0.85),\n      0 2px 6px rgba(0,0,0,0.9);\n  }\n  .cover-text::before{\n    content:\"\"; position:absolute; inset: -60px -120px -20px;\n    background: radial-gradient(60% 55% at 50% 50%, rgba(3,5,10,0.85) 0%, rgba(3,5,10,0.55) 55%, transparent 80%);\n    z-index:-1; pointer-events:none;\n  }\n  .cover-text .lead{\n    margin-bottom:26px;\n    font:500 14px/1 var(--mono); letter-spacing:.32em; text-transform:uppercase; color:var(--cyan);\n  }\n  .cover-meta{\n    position:relative; z-index:5; padding: 0 64px 60px;\n    display:flex; justify-content:space-between; align-items:flex-end;\n    font:500 13px/1.4 var(--mono); color:var(--ink-faint); letter-spacing:.14em; text-transform:uppercase;\n  }\n\n  /* ============ SLIDE 2: HOOK ============ */\n  .s-hook{ display:grid; grid-template-columns: 1fr 1fr; align-items:center; padding:140px 100px 100px; gap:80px; }\n  .pulse-viz{\n    position:relative; height: 700px;\n  }\n\n  /* ============ SLIDE 3: MASTER LAW ============ */\n  .s-law{ padding:140px 100px 100px; display:grid; grid-template-columns: 1.05fr 1fr; gap:80px; align-items:center; }\n  .equation-block{\n    display:flex; align-items:center; justify-content:center;\n    padding: 50px 40px;\n    border: 1px solid var(--panel-line);\n    background: linear-gradient(180deg, rgba(93,210,255,0.04), transparent);\n    border-radius: 4px;\n    position:relative;\n  }\n  .eq-text{\n    font-family:var(--serif); font-weight:300; font-style:italic;\n    font-size: 140px; letter-spacing:-0.02em;\n    color: var(--ink); line-height:1;\n  }\n  .eq-text .var{ color:var(--cyan); }\n  .eq-text .pow{ color:var(--purple); font-size:.7em; vertical-align: super; }\n  .eq-text .small{ font-size:.85em; color:var(--ink-dim); margin: 0 .15em; }\n\n  .legend-grid{ display:grid; grid-template-columns: auto 1fr; gap: 26px 28px; margin-top:32px; }\n  .legend-grid .k{ font:500 32px/1 var(--serif); color:var(--cyan); }\n  .legend-grid .v{ font-size:20px; line-height:1.4; color:#aab4c6; }\n  .legend-grid .k.alpha{ color:var(--purple); }\n  .legend-grid .k.kappa{ color:var(--gold); }\n\n  /* ============ SLIDE 4: MEET ALPHA — interactive slider ============ */\n  .s-alpha{ padding:130px 80px 80px; display:grid; grid-template-rows: auto 1fr auto; gap: 30px; }\n  .alpha-stage{\n    position:relative;\n    display:grid; grid-template-columns: 1fr 1fr; gap:60px;\n    padding: 0 40px;\n    align-items:end;\n  }\n  .alpha-side{\n    position:relative;\n    height: 560px;\n    border:1px solid var(--panel-line);\n    border-radius:3px;\n    padding: 30px 36px 30px;\n    display:flex; flex-direction: column; justify-content:space-between;\n    overflow:hidden;\n    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);\n  }\n  .alpha-side .scale-stack{\n    position:relative; flex:1;\n    display:flex; align-items:flex-end; justify-content:space-around; padding: 30px 0;\n    perspective: 1400px;\n  }\n  .alpha-side .label-row{ display:flex; justify-content:space-between; color:var(--ink-faint); font:500 12px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; }\n  .alpha-bar{\n    width: 70px;\n    position:relative;\n    transform: rotateX(-14deg) rotateY(22deg);\n    transform-style: preserve-3d;\n  }\n  .alpha-bar .wire{ position:absolute; inset:0; border:1px solid rgba(255,255,255,0.14); }\n  .alpha-bar .glow{\n    position:absolute; inset:0;\n    background: linear-gradient(180deg, var(--c) 0%, color-mix(in oklab, var(--c), transparent 60%) 100%);\n    box-shadow: 0 0 40px var(--c), 0 0 80px color-mix(in oklab, var(--c), transparent 60%);\n  }\n  .alpha-bar .scale-num{\n    position:absolute; bottom:-32px; left:50%; transform:translateX(-50%);\n    font:500 14px/1 var(--mono); color:var(--ink-dim);\n  }\n  .alpha-slider{\n    margin: 0 80px;\n    display:flex; flex-direction:column; gap: 10px;\n  }\n  .alpha-track{\n    position:relative;\n    height: 36px;\n    background: linear-gradient(90deg, var(--orange) 0%, var(--gold) 35%, var(--cyan) 70%, var(--purple) 100%);\n    border-radius: 999px;\n    cursor: pointer;\n    box-shadow: 0 0 40px rgba(93,210,255,0.18);\n  }\n  .alpha-thumb{\n    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);\n    width: 60px; height: 60px; border-radius:50%;\n    background: var(--ink); border:3px solid var(--ink);\n    box-shadow: 0 0 30px rgba(255,255,255,0.4), inset 0 0 0 2px #000;\n    display:flex; align-items:center; justify-content:center;\n    font:600 14px/1 var(--mono); color:#000;\n  }\n  .alpha-tick{\n    display:flex; justify-content:space-between;\n    font:500 11px/1 var(--mono); color:var(--ink-faint); letter-spacing:.14em; text-transform:uppercase;\n    padding: 0 4px;\n  }\n\n  /* ============ SLIDE 5: SLOPE NOT LEVEL ============ */\n  .s-slope{ padding:130px 90px 90px; display:grid; grid-template-columns: 1.15fr 1fr; gap:80px; align-items:center; }\n  .s-slope .h-title{ font-size: 60px; line-height: 1.2; }\n  .loglog{ position:relative; width:100%; aspect-ratio: 1.1/1; }\n\n  /* ============ SLIDE 6: COMPARISON ============ */\n  .s-compare{ padding:120px 80px 80px; display:grid; grid-template-rows: auto 1fr; gap:40px; }\n  .compare-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:50px; }\n  .compare-card{\n    border:1px solid var(--panel-line); border-radius:4px;\n    padding: 40px 40px 30px;\n    background: linear-gradient(180deg, rgba(255,255,255,0.025), transparent);\n    position:relative; overflow:hidden;\n    min-height: 620px;\n    display:flex; flex-direction:column; gap: 24px;\n  }\n  .compare-card.warn{ border-color: color-mix(in oklab, var(--orange), transparent 70%); background: linear-gradient(180deg, rgba(255,141,90,0.06), transparent); }\n  .compare-card.good{ border-color: color-mix(in oklab, var(--green), transparent 70%); background: linear-gradient(180deg, rgba(90,243,160,0.05), transparent); }\n  .compare-card .anim-area{ flex:1; position:relative; }\n\n  /* dots cascade animation */\n  .cascade-stage{ position:absolute; inset:0; }\n  .cascade-layer{\n    position:absolute; left:8%; right:8%;\n    height: 50px;\n    display:flex; gap: 14px; align-items:center;\n  }\n  .cascade-layer .node{\n    flex:1; height: 12px; border-radius:2px;\n    background: rgba(255,255,255,0.08);\n    position:relative; overflow:hidden;\n  }\n  .cascade-layer .node::after{\n    content:\"\"; position:absolute; inset:0; left:-100%;\n    background: linear-gradient(90deg, transparent, var(--c, var(--cyan)), transparent);\n    box-shadow: 0 0 20px var(--c, var(--cyan));\n  }\n  .cascade-layer.layer-1{ top: 10%; }\n  .cascade-layer.layer-2{ top: 38%; }\n  .cascade-layer.layer-3{ top: 66%; }\n\n  /* ============ SLIDE 7: PIPELINE ============ */\n  .s-pipe{ padding:130px 80px 90px; display:grid; grid-template-rows: auto 1fr; gap:50px; }\n  .pipe-row{ display:grid; grid-template-columns: repeat(5, 1fr); gap: 16px; align-items:stretch; }\n  .pipe-step{\n    border:1px solid var(--panel-line); border-radius:3px;\n    padding: 30px 26px;\n    background: linear-gradient(180deg, rgba(255,255,255,0.025), transparent);\n    position:relative;\n    display:flex; flex-direction:column; gap:14px;\n    min-height: 280px;\n  }\n  .pipe-step .num{\n    font:500 13px/1 var(--mono); color:var(--cyan); letter-spacing:.2em;\n  }\n  .pipe-step h3{ font:500 26px/1.05 var(--serif); margin:0; color:var(--ink); font-weight:400; }\n  .pipe-step p{ font: 400 16px/1.45 var(--sans); color: var(--ink-dim); margin: 0; }\n  .pipe-arrow{\n    position:absolute; right:-18px; top:50%; transform:translateY(-50%);\n    width: 30px; height: 1px; background:var(--ink-faint);\n  }\n  .pipe-arrow::after{\n    content:\"\"; position:absolute; right:0; top:50%;\n    width:8px; height:8px; border-top:1px solid var(--ink-faint); border-right:1px solid var(--ink-faint);\n    transform: translateY(-50%) rotate(45deg);\n  }\n  .pipe-step .icon{\n    width: 48px; height: 48px;\n    border:1px solid var(--panel-line); border-radius:2px;\n    display:flex; align-items:center; justify-content:center;\n    font:500 18px/1 var(--mono); color:var(--cyan);\n  }\n\n  /* ============ SLIDE 8: ECI DASHBOARD ============ */\n  .s-eci{ padding:120px 70px 140px; display:grid; grid-template-columns: 360px 1fr; gap:50px; }\n  .eci-side{ display:flex; flex-direction:column; gap: 28px; padding-top: 20px; }\n  .eci-stat{\n    padding: 18px 0;\n    border-top:1px solid var(--panel-line);\n  }\n  .eci-stat:last-child{ border-bottom:1px solid var(--panel-line); }\n  .eci-stat .v{ font:500 40px/1 var(--serif); color:var(--ink); }\n  .eci-stat .v .unit{ font-size:.45em; color:var(--ink-dim); margin-left:.25em; }\n  .eci-stat .k{ font:500 12px/1 var(--mono); color:var(--ink-faint); letter-spacing:.18em; text-transform:uppercase; margin-bottom: 10px;}\n  .eci-stat .trend{ display:inline-block; font:500 14px/1 var(--mono); color:var(--green); margin-left:8px; }\n  .eci-main{\n    position:relative;\n    border:1px solid var(--panel-line); border-radius:4px;\n    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);\n    padding: 40px 50px 30px;\n    overflow:hidden;\n  }\n\n  /* ============ SLIDE 9: HYPOTHESES ============ */\n  .s-hyp{ padding:130px 80px 80px; display:grid; grid-template-rows: auto 1fr; gap:50px; }\n  .hyp-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }\n  .hyp-card{\n    border:1px solid var(--panel-line); border-radius:4px;\n    padding: 36px 36px 34px;\n    background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent);\n    position:relative; overflow:hidden;\n    display:flex; flex-direction:column; gap:18px;\n    min-height: 640px;\n    transition: transform .4s ease, border-color .4s ease;\n  }\n  .hyp-card:hover{ transform: translateY(-6px); border-color: rgba(93,210,255,0.4); }\n  .hyp-card .tag{\n    font:600 14px/1 var(--mono); color:var(--cyan); letter-spacing:.2em;\n  }\n  .hyp-card h3{ font:300 56px/0.95 var(--serif); margin:0; letter-spacing:-0.02em; }\n  .hyp-card .desc{ font: 400 18px/1.5 var(--sans); color: #b8c1d0; }\n  .hyp-icon{\n    height: 200px; position:relative; margin: 16px 0;\n    border:1px solid var(--panel-line); border-radius:3px;\n    background: radial-gradient(circle at 50% 50%, rgba(93,210,255,0.08), transparent 65%);\n    overflow:hidden;\n  }\n  .hyp-prediction{\n    font:500 13px/1.5 var(--mono); color:var(--ink-dim);\n    padding: 14px 16px; border-left: 2px solid var(--cyan);\n    background: rgba(93,210,255,0.04);\n  }\n  .hyp-card[data-h=\"2\"] .tag{ color:var(--purple); }\n  .hyp-card[data-h=\"2\"] .hyp-prediction{ border-left-color: var(--purple); background: rgba(177,137,255,0.05); }\n  .hyp-card[data-h=\"3\"] .tag{ color:var(--gold); }\n  .hyp-card[data-h=\"3\"] .hyp-prediction{ border-left-color: var(--gold); background: rgba(255,214,107,0.05); }\n\n  /* ============ SLIDE 10: PHASE SPECTRUM ============ */\n  .s-phase{ padding:130px 80px 80px; display:grid; grid-template-rows: auto auto 1fr; gap: 36px; }\n  .phase-meter{\n    position:relative; height: 110px;\n    border:1px solid var(--panel-line); border-radius: 6px;\n    background: linear-gradient(180deg, rgba(0,0,0,0.4), rgba(255,255,255,0.02));\n    overflow:hidden;\n  }\n  .phase-fill{\n    position:absolute; inset:0;\n    background: linear-gradient(90deg,\n      var(--red) 0%, var(--red) 18%,\n      var(--orange) 25%, var(--gold) 38%,\n      var(--green) 50%, var(--cyan) 65%,\n      var(--purple) 85%, var(--purple) 100%);\n    opacity:.85;\n  }\n  .phase-ticks{\n    position:absolute; inset:0; display:flex; align-items:flex-end;\n    pointer-events:none;\n  }\n  .phase-tick{\n    position:absolute; bottom:0; top:0; width:1px; background: rgba(0,0,0,0.4);\n  }\n  .phase-needle{\n    position:absolute; top:-10px; bottom:-10px;\n    width: 4px; background: var(--ink); box-shadow: 0 0 24px var(--ink), 0 0 60px rgba(255,255,255,0.6);\n    transition: left 1.2s cubic-bezier(.5,.2,.3,1);\n  }\n  .phase-needle::before{\n    content: attr(data-value);\n    position:absolute; top:-46px; left:50%; transform:translateX(-50%);\n    font:600 22px/1 var(--mono); color:var(--ink); white-space:nowrap;\n    background:#000; padding: 6px 12px; border:1px solid var(--panel-line);\
