document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: datos del paquete faltantes');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Desempaquetando ' + uuids.length + ' recursos...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

px;\n  background: var(--bg);\n  color: var(--ink);\n  overflow: hidden;\n  isolation: isolate;\n}\n\n\u002F* Persistent star field on every slide *\u002F\n.slide::before {\n  content: \"\";\n  position: absolute; inset: 0;\n  background:\n    radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,0.55) 50%, transparent 51%),\n    radial-gradient(1px 1px at 23% 73%, rgba(255,255,255,0.35) 50%, transparent 51%),\n    radial-gradient(1px 1px at 41% 32%, rgba(255,255,255,0.45) 50%, transparent 51%),\n    radial-gradient(1px 1px at 67% 86%, rgba(255,255,255,0.30) 50%, transparent 51%),\n    radial-gradient(1.5px 1.5px at 81% 14%, rgba(255,255,255,0.55) 50%, transparent 51%),\n    radial-gradient(1px 1px at 88% 54%, rgba(255,255,255,0.30) 50%, transparent 51%),\n    radial-gradient(1px 1px at 5% 89%, rgba(255,255,255,0.40) 50%, transparent 51%),\n    radial-gradient(1px 1px at 53% 11%, rgba(255,255,255,0.45) 50%, transparent 51%),\n    radial-gradient(2px 2px at 31% 47%, rgba(212,162,106,0.35) 50%, transparent 51%),\n    radial-gradient(1px 1px at 74% 39%, rgba(255,255,255,0.35) 50%, transparent 51%),\n    radial-gradient(1px 1px at 17% 61%, rgba(255,255,255,0.25) 50%, transparent 51%),\n    radial-gradient(1.5px 1.5px at 92% 78%, rgba(122,212,200,0.30) 50%, transparent 51%),\n    radial-gradient(800px 600px at 78% 22%, rgba(212,162,106,0.06), transparent 60%),\n    radial-gradient(900px 700px at 15% 80%, rgba(122,212,200,0.04), transparent 60%);\n  pointer-events: none;\n  z-index: 0;\n}\n\n.slide > * { position: relative; z-index: 1; }\n\n\u002F* ---------- chrome: corner brackets, header bar, footer ---------- *\u002F\n.hud-corners {\n  position: absolute; inset: 56px;\n  pointer-events: none; z-index: 2;\n}\n.hud-corners span {\n  position: absolute; width: 28px; height: 28px;\n  border: 1px solid var(--gold);\n  opacity: 0.7;\n}\n.hud-corners .tl { top: 0; left: 0; border-right: none; border-bottom: none; }\n.hud-corners .tr { top: 0; right: 0; border-left: none; border-bottom: none; }\n.hud-corners .bl { bottom: 0; left: 0; border-right: none; border-top: none; }\n.hud-corners .br { bottom: 0; right: 0; border-left: none; border-top: none; }\n\n.hud-top {\n  position: absolute; top: 56px; left: 56px; right: 56px;\n  display: flex; justify-content: space-between; align-items: center;\n  font-family: var(--f-mono); font-size: 14px; font-weight: 400;\n  letter-spacing: 0.18em; text-transform: uppercase;\n  color: var(--ink-3); z-index: 3;\n}\n.hud-top .logo {\n  display: flex; align-items: center; gap: 14px;\n  color: var(--ink);\n}\n.hud-top .logo svg { display: block; }\n.hud-top .nav { display: flex; gap: 36px; }\n.hud-top .nav b { color: var(--ink-2); font-weight: 400; }\n.hud-top .nav b.active { color: var(--gold); }\n\n.hud-bottom {\n  position: absolute; bottom: 56px; left: 56px; right: 56px;\n  display: flex; justify-content: space-between; align-items: flex-end;\n  font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.18em;\n  text-transform: uppercase; color: var(--ink-3); z-index: 3;\n}\n.hud-bottom .signal {\n  display: flex; align-items: center; gap: 10px;\n}\n.hud-bottom .signal::before {\n  content: \"\"; width: 8px; height: 8px; border-radius: 50%;\n  background: var(--gold); box-shadow: 0 0 12px var(--gold);\n  animation: pulse 1.8s ease-in-out infinite;\n}\n\n@keyframes pulse {\n  0%, 100% { opacity: 0.4; transform: scale(0.8); }\n  50% { opacity: 1; transform: scale(1.1); }\n}\n\n\u002F* ---------- type scale ---------- *\u002F\nh1.display {\n  font-family: var(--f-sans);\n  font-weight: 300;\n  font-size: 124px;\n  line-height: 1.0;\n  letter-spacing: -0.02em;\n  color: var(--ink);\n}\nh1.display em { font-style: normal; color: var(--gold); font-weight: 400; }\nh1.display b { font-weight: 600; color: var(--ink); font-style: normal; }\n\nh2.title {\n  font-family: var(--f-sans);\n  font-weight: 400;\n  font-size: 72px;\n  line-height: 1.05;\n  letter-spacing: -0.02em;\n  color: var(--ink);\n}\nh2.title em { color: var(--gold); font-style: normal; font-weight: 500; }\n\nh3.eyebrow {\n  font-family: var(--f-mono);\n  font-size: 14px;\n  font-weight: 500;\n  letter-spacing: 0.32em;\n  text-transform: uppercase;\n  color: var(--gold);\n}\n\np.lead {\n  font-family: var(--f-sans);\n  font-weight: 300;\n  font-size: 28px;\n  line-height: 1.45;\n  color: var(--ink-2);\n  max-width: 720px;\n  text-wrap: pretty;\n}\n\np.body {\n  font-size: 20px;\n  line-height: 1.55;\n  color: var(--ink-2);\n  max-width: 540px;\n}\n\n.mono { font-family: var(--f-mono); }\n.tag {\n  font-family: var(--f-mono);\n  font-size: 12px;\n  letter-spacing: 0.24em;\n  text-transform: uppercase;\n  color: var(--ink-3);\n}\n.kbd {\n  font-family: var(--f-mono); font-size: 13px;\n  color: var(--gold); border: 1px solid var(--hairline);\n  padding: 4px 10px; border-radius: 4px;\n  background: rgba(212,162,106,0.05);\n}\n\n\u002F* ---------- layout ---------- *\u002F\n.stage {\n  position: absolute;\n  top: 120px; bottom: 120px; left: 120px; right: 120px;\n  z-index: 1;\n}\n.col-2 {\n  display: grid; grid-template-columns: 1fr 1fr; gap: 80px;\n  height: 100%;\n}\n.center {\n  height: 100%; display: flex; flex-direction: column;\n  justify-content: center;\n}\n\n\u002F* ---------- shared components ---------- *\u002F\n.framed {\n  position: relative;\n  border: 1px solid var(--hairline);\n  background: rgba(17, 22, 30, 0.45);\n  backdrop-filter: blur(2px);\n}\n.framed .marks { position: absolute; inset: -1px; pointer-events: none; }\n.framed .marks::before, .framed .marks::after {\n  content: \"\"; position: absolute; width: 14px; height: 14px;\n  border: 1px solid var(--gold); opacity: 0.8;\n}\n.framed .marks::before { top: -7px; left: -7px; border-right: none; border-bottom: none; }\n.framed .marks::after { bottom: -7px; right: -7px; border-left: none; border-top: none; }\n\n.chip {\n  display: inline-flex; align-items: center; gap: 10px;\n  padding: 8px 14px;\n  border: 1px solid var(--hairline);\n  border-radius: 999px;\n  font-family: var(--f-mono); font-size: 12px;\n  letter-spacing: 0.2em; text-transform: uppercase;\n  color: var(--ink-2);\n}\n.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }\n.chip.cyan .dot { background: var(--cyan); }\n.chip.coral .dot { background: var(--coral); }\n\n.btn-ghost {\n  display: inline-flex; align-items: center; gap: 12px;\n  padding: 18px 28px;\n  border: 1px solid var(--gold);\n  background: transparent; color: var(--gold);\n  font-family: var(--f-mono); font-size: 14px;\n  letter-spacing: 0.24em; text-transform: uppercase;\n  cursor: pointer; transition: 160ms;\n}\n.btn-ghost:hover {\n  background: rgba(212,162,106,0.08);\n  box-shadow: 0 0 24px rgba(212,162,106,0.2);\n}\n\n\u002F* ---------- circular HUD (reused on a few slides) ---------- *\u002F\n.hud-ring {\n  position: relative;\n  width: 720px; height: 720px;\n  display: grid; place-items: center;\n}\n.hud-ring svg.ticks { position: absolute; inset: 0; }\n.hud-ring .ring-label {\n  position: absolute; font-family: var(--f-mono);\n  font-size: 12px; letter-spacing: 0.2em;\n  color: var(--gold); text-transform: uppercase;\n}\n\n@keyframes rotate-slow {\n  to { transform: rotate(360deg); }\n}\n@keyframes rotate-back {\n  to { transform: rotate(-360deg); }\n}\n.spin { animation: rotate-slow 36s linear infinite; transform-origin: center; }\n.spin-back { animation: rotate-back 60s linear infinite; transform-origin: center; }\n\n\u002F* ---------- slide-specific helpers ---------- *\u002F\n.metric {\n  display: flex; flex-direction: column; gap: 6px;\n}\n.metric .val {\n  font-family: var(--f-sans); font-weight: 300;\n  font-size: 80px; line-height: 1; color: var(--ink);\n  letter-spacing: -0.02em;\n}\n.metric .val em { color: var(--gold); font-style: normal; }\n.metric .lbl {\n  font-family: var(--f-mono); font-size: 12px;\n  letter-spacing: 0.24em; text-transform: uppercase;\n  color: var(--ink-3);\n}\n\n\u002F* divider hairline *\u002F\n.hairline {\n  height: 1px; background: var(--hairline);\n  margin: 24px 0;\n}\n\n\u002F* ---------- slide 1 cascade animation ---------- *\u002F\n.title-cascade {\n  position: absolute;\n  right: -120px; top: 50%; transform: translateY(-50%);\n  width: 1200px; height: 1200px;\n  pointer-events: none;\n}\n\n\u002F* alpha slider control (slide 3) *\u002F\n.alpha-control {\n  display: flex; flex-direction: column; gap: 18px;\n  font-family: var(--f-mono);\n}\n.alpha-control .track {\n  position: relative;\n  height: 6px; background: rgba(245,239,230,0.06);\n  border-top: 1px solid var(--hairline);\n  border-bottom: 1px solid var(--hairline);\n}\n.alpha-control .fill {\n  position: absolute; top: 0; left: 0; height: 100%;\n  background: linear-gradient(90deg, var(--cyan), var(--gold), var(--coral));\n  width: 30%;\n}\n.alpha-control input[type=\"range\"] {\n  -webkit-appearance: none; appearance: none;\n  width: 100%; background: transparent;\n}\n.alpha-control input[type=\"range\"]::-webkit-slider-thumb {\n  -webkit-appearance: none; appearance: none;\n  width: 22px; height: 22px; border-radius: 50%;\n  background: var(--gold); border: 3px solid var(--bg);\n  box-shadow: 0 0 16px var(--gold);\n  cursor: pointer;\n}\n.alpha-control input[type=\"range\"]::-moz-range-thumb {\n  width: 22px; height: 22px; border-radius: 50%;\n  background: var(--gold); border: 3px solid var(--bg);\n  cursor: pointer;\n}\n.alpha-regimes {\n  display: grid; grid-template-columns: repeat(4, 1fr);\n  gap: 8px; margin-top: 8px;\n}\n.alpha-regimes .reg {\n  font-family: var(--f-mono); font-size: 11px;\n  letter-spacing: 0.18em; text-transform: uppercase;\n  color: var(--ink-3); padding: 8px 0;\n  border-top: 1px solid var(--hairline);\n  transition: 200ms;\n}\n.alpha-regimes .reg.active { color: var(--gold); border-top-color: var(--gold); }\n\n\u002F* Layer stack (slide 5) *\u002F\n.layer-stack {\n  display: flex; flex-direction: column; gap: 18px;\n}\n.layer {\n  position: relative;\n  display: grid; grid-template-columns: 80px 1fr 200px; gap: 24px;\n  align-items: center;\n  padding: 24px 28px;\n  border: 1px solid var(--hairline);\n  background: rgba(17, 22, 30, 0.55);\n  transition: 240ms;\n}\n.layer .ix {\n  font-family: var(--f-mono); font-size: 28px;\n  color: var(--gold); letter-spacing: 0.04em;\n}\n.layer .name {\n  font-family: var(--f-sans); font-weight: 400; font-size: 22px;\n  color: var(--ink);\n}\n.layer .sub {\n  font-family: var(--f-mono); font-size: 12px;\n  letter-spacing: 0.2em; text-transform: uppercase;\n  color: var(--ink-3); margin-top: 4px;\n}\n.layer .alpha-pill {\n  font-family: var(--f-mono); font-size: 18px;\n  color: var(--gold);\n  text-align: right;\n}\n.layer.lit {\n  border-color: var(--gold);\n  box-shadow: inset 0 0 60px rgba(212,162,106,0.08);\n}\n.layer.lit::before {\n  content: \"\"; position: absolute; left: -1px; top: 0; bottom: 0;\n  width: 2px; background: var(--gold);\n}\n\n\u002F* arrow between layers *\u002F\n.layer-arrow {\n  display: flex; justify-content: center;\n  font-family: var(--f-mono); font-size: 10px;\n  letter-spacing: 0.3em; color: var(--ink-4);\n}\n\n\u002F* Decision pill *\u002F\n.pass { color: var(--cyan); }\n.fail { color: var(--coral); }\n\n\u002F* Closing slide *\u002F\n.big-quote {\n  font-family: var(--f-sans); font-weight: 300;\n  font-size: 96px; line-height: 1.05;\n  letter-spacing: -0.02em; color: var(--ink);\n  max-width: 1400px;\n  text-wrap: balance;\n}\n.big-quote em { color: var(--gold); font-style: normal; font-weight: 400; }\n\n\u002F* ---------- progressive entrance: subtle per-slide reveal ---------- *\u002F\n@keyframes fadeUp {\n  from { opacity: 0; transform: translateY(12px); }\n  to { opacity: 1; transform: translateY(0); }\n}\n.slide[data-deck-active] .reveal { animation: fadeUp 700ms 100ms both cubic-bezier(.2,.7,.2,1); }\n.slide[data-deck-active] .reveal-2 { animation: fadeUp 700ms 280ms both cubic-bezier(.2,.7,.2,1); }\n.slide[data-deck-active] .reveal-3 { animation: fadeUp 700ms 460ms both cubic-bezier(.2,.7,.2,1); }\n.slide[data-deck-active] .reveal-4 { animation: fadeUp 700ms 640ms both cubic-bezier(.2,.7,.2,1); }\n\n\u002F* Pulse glow on key elements *\u002F\n@keyframes glow {\n  0%, 100% { filter: drop-shadow(0 0 6px rgba(212,162,106,0.4)); }\n  50% { filter: drop-shadow(0 0 16px rgba(212,162,106,0.8)); }\n}\n.glow { animation: glow 2.4s ease-in-out infinite; }\n\n\u002F* dashed stream *\u002F\n@keyframes dash {\n  to { stroke-dashoffset: -200; }\n}\n.flow { stroke-dasharray: 6 8; animation: dash 4s linear infinite; }\n.flow-fast { stroke-dasharray: 4 6; animation: dash 1.6s linear infinite; }\n<\u002Fstyle>\n  \n<\u002Fhead>\n<body>\n\n<deck-stage width=\"1920\" height=\"1080\">\n\n  <!-- =============================================================\n       SLIDE 01 \u2014 TITLE\n       ============================================================= -->\n  <section class=\"slide\" data-label=\"T\u00edtulo\">\n    <!-- Top HUD bar -->\n    <div class=\"hud-top reveal\">\n      <div class=\"logo\">\n        <svg width=\"40\" height=\"40\" viewBox=\"0 0 40 40\" fill=\"none\">\n          <circle cx=\"20\" cy=\"20\" r=\"14\" stroke=\"currentColor\" stroke-width=\"1.2\"><\u002Fcircle>\n          <circle cx=\"20\" cy=\"20\" r=\"2.5\" fill=\"var(--gold)\"><\u002Fcircle>\n          <circle cx=\"34\" cy=\"20\" r=\"2\" fill=\"var(--gold)\"><\u002Fcircle>\n          <path d=\"M20 6 L20 20 L34 20\" stroke=\"var(--gold)\" stroke-width=\"1\" opacity=\"0.6\"><\u002Fpath>\n        <\u002Fsvg>\n        <span>RTM \u00b7 Cascade<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"nav\">\n        <b class=\"active\">01 \u00b7 Marco te\u00f3rico<\u002Fb>\n        <b>02 \u00b7 Firmas<\u002Fb>\n        <b>03 \u00b7 Modos de falla<\u002Fb>\n        <b>04 \u00b7 Evidencia<\u002Fb>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"hud-corners\"><span class=\"tl\"><\u002Fspan><span class=\"tr\"><\u002Fspan><span class=\"bl\"><\u002Fspan><span class=\"br\"><\u002Fspan><\u002Fdiv>\n\n    <!-- Cascading rings on the right -->\n    <div style=\"position:absolute; right:80px; top:50%; transform:translateY(-50%); width:900px; height:900px; z-index:0;\">\n      <svg viewBox=\"0 0 900 900\" style=\"width:100%; height:100%;\">\n        <defs>\n          <radialGradient id=\"ring-glow\" cx=\"50%\" cy=\"50%\" r=\"50%\">\n            <stop offset=\"0%\" stop-color=\"rgba(212,162,106,0.18)\"><\u002Fstop>\n            <stop offset=\"60%\" stop-color=\"rgba(212,162,106,0.04)\"><\u002Fstop>\n            <stop offset=\"100%\" stop-color=\"transparent\"><\u002Fstop>\n          <\u002FradialGradient>\n        <\u002Fdefs>\n        <circle cx=\"450\" cy=\"450\" r=\"380\" fill=\"url(#ring-glow)\"><\u002Fcircle>\n\n        <!-- Outer tick ring -->\n        <g class=\"spin\">\n          <circle cx=\"450\" cy=\"450\" r=\"380\" fill=\"none\" stroke=\"rgba(212,162,106,0.25)\" stroke-width=\"1\"><\u002Fcircle>\n          <g stroke=\"rgba(212,162,106,0.5)\" stroke-width=\"1\">\n            <!-- 60 ticks -->\n            <g id=\"ticks-outer\"><\u002Fg>\n          <\u002Fg>\n        <\u002Fg>\n\n        <!-- Mid ring with cardinal labels -->\n        <g class=\"spin-back\">\n          <circle cx=\"450\" cy=\"450\" r=\"300\" fill=\"none\" stroke=\"rgba(245,239,230,0.10)\" stroke-width=\"1\"><\u002Fcircle>\n          <circle cx=\"450\" cy=\"450\" r=\"300\" fill=\"none\" stroke=\"var(--gold)\" stroke-width=\"1.5\" stroke-dasharray=\"6 14\"><\u002Fcircle>\n        <\u002Fg>\n\n        <!-- Inner concentric: four layer rings, each pulse-animated -->\n        <g>\n          <circle cx=\"450\" cy=\"450\" r=\"220\" fill=\"none\" stroke=\"rgba(122,212,200,0.35)\" stroke-width=\"1\"><\u002Fcircle>\n          <circle cx=\"450\" cy=\"450\" r=\"170\" fill=\"none\" stroke=\"rgba(122,212,200,0.45)\" stroke-width=\"1\"><\u002Fcircle>\n          <circle cx=\"450\" cy=\"450\" r=\"120\" fill=\"none\" stroke=\"rgba(212,162,106,0.6)\" stroke-width=\"1\"><\ pacing=\"2\">N=5<\u002Ftext>\n          <\u002Fsvg>\n          <p class=\"body\" style=\"margin-top:16px; color:var(--ink);\">\n            Los interceptos cambian, las pendientes se mantienen planas. La causalidad es sim\u00e9trica.\n            <b><\u002Fb>\n          <\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"hud-bottom\"><span class=\"signal\">CONSULTA 01<\u002Fspan><span>FALSIFICABLE POR DISE\u00d1O<\u002Fspan><span>AMBOS RESULTADOS SON VALIOSOS<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- =============================================================\n       SLIDE 03 \u2014 THE LAW (interactive \u03b1 slider)\n       ============================================================= -->\n  <section class=\"slide\" data-label=\"La ley de escalamiento\">\n    <div class=\"hud-top\">\n      <div class=\"logo\">\n        <svg width=\"40\" height=\"40\" viewBox=\"0 0 40 40\" fill=\"none\">\n          <circle cx=\"20\" cy=\"20\" r=\"14\" stroke=\"currentColor\" stroke-width=\"1.2\"><\u002Fcircle>\n          <circle cx=\"20\" cy=\"20\" r=\"2.5\" fill=\"var(--gold)\"><\u002Fcircle>\n        <\u002Fsvg>\n        <span>RTM \u00b7 Cascade<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"nav\"><b>01<\u002Fb><b class=\"active\">02 \u00b7 La ley<\u002Fb><b>03 \u00b7 Firmas<\u002Fb><b>04 \u00b7 Veredicto<\u002Fb><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hud-corners\"><span class=\"tl\"><\u002Fspan><span class=\"tr\"><\u002Fspan><span class=\"bl\"><\u002Fspan><span class=\"br\"><\u002Fspan><\u002Fdiv>\n\n    <div class=\"stage\">\n      <h3 class=\"eyebrow reveal\">\u002F 02 \u00b7 LA LEY DE ESCALAMIENTO<\u002Fh3>\n\n      <div class=\"col-2\" style=\"margin-top:48px;\">\n        <!-- LEFT: copy + slider -->\n        <div style=\"display:flex; flex-direction:column; justify-content:center; gap:36px;\">\n          <h2 class=\"title reveal-2\">Una ecuaci\u00f3n,<br>en <em>cada<\u002Fem> escala.<\u002Fh2>\n\n          <!-- The equation -->\n          <div class=\"framed reveal-3\" style=\"padding:36px 40px;\">\n            <div class=\"marks\"><\u002Fdiv>\n            <div style=\"font-family:var(--f-mono); font-size:14px; letter-spacing:0.24em; text-transform:uppercase; color:var(--ink-3); margin-bottom:18px;\">LEY TIEMPO\u2013TAMA\u00d1O RTM \u00b7 EC 2.1<\u002Fdiv>\n            <div style=\"font-family:var(--f-sans); font-size:64px; color:var(--ink); letter-spacing:-0.01em; line-height:1;\">\n              T \u002F T\u2080 = <span style=\"display:inline-block; transform:translateY(-2px);\">(<\u002Fspan>L \u002F L\u2080<span style=\"display:inline-block; transform:translateY(-2px);\">)<\u002Fspan><sup style=\"font-size:32px; color:var(--gold); margin-left:4px;\">\u03b1<\u002Fsup>\n            <\u002Fdiv>\n            <p class=\"body\" style=\"margin-top:20px; font-size:18px; max-width:none;\">\n              Toma logaritmos y se convierte en una l\u00ednea recta: <span class=\"mono\" style=\"color:var(--ink);\">log T = \u03b1 \u00b7 log L + \u03b2<\u002Fspan>.\n              La pendiente <span class=\"mono\" style=\"color:var(--gold);\">\u03b1<\u002Fspan> es lo que medimos. Todo lo dem\u00e1s reside en el intercepto.\n            <\u002Fp>\n          <\u002Fdiv>\n\n          <!-- Interactive slider -->\n          <div class=\"reveal-4\">\n            <div style=\"display:flex; justify-content:space-between; align-items:baseline; margin-bottom:18px;\">\n              <span class=\"tag\">DESLIZA \u03b1 \u2192<\u002Fspan>\n              <span class=\"mono\" style=\"font-size:48px; color:var(--gold); font-weight:300;\" id=\"alpha-val\">0.31<\u002Fspan>\n            <\u002Fdiv>\n            <input type=\"range\" id=\"alpha-slider\" min=\"0\" max=\"2.5\" step=\"0.01\" value=\"0.31\" style=\"width:100%; height:10px;\">\n            <div class=\"alpha-regimes\">\n              <div class=\"reg\" data-min=\"0\" data-max=\"0.5\">\u03b1 &lt; 0.5 \u00b7 Super-diffusive<\u002Fdiv>\n              <di      <span class=\"mono\" style=\"color:var(--cyan); font-size:14px;\">\u03b1 &lt; 0.5<\u002Fspan>\n          <\u002Fdiv>\n          <svg viewBox=\"0 0 280 160\" style=\"width:100%; height:160px;\">\n            <g stroke=\"rgba(245,239,230,0.06)\"><line x1=\"0\" y1=\"140\" x2=\"280\" y2=\"140\"><\u002Fline><line x1=\"20\" y1=\"0\" x2=\"20\" y2=\"160\"><\u002Fline><\u002Fg>\n            <path d=\"M 20 140 Q 140 138 270 35\" stroke=\"var(--cyan)\" stroke-width=\"2.5\" fill=\"none\"><\u002Fpath>\n            <circle cx=\"270\" cy=\"35\" r=\"5\" fill=\"var(--cyan)\"><\u002Fcircle>\n          <\u002Fsvg>\n          <div style=\"margin-top:24px;\">\n            <div style=\"font-size:24px; color:var(--ink); margin-bottom:6px;\">Superdifusivo<\u002Fdiv>\n            <div class=\"mono\" style=\"font-size:12px; color:var(--ink-3); letter-spacing:0.2em; text-transform:uppercase;\">M\u00e1s r\u00e1pido que el bal\u00edstico<\u002Fdiv>\n            <p class=\"body\" style=\"margin-top:16px; font-size:16px;\">\n              La jerarqu\u00eda paralela supera los l\u00edmites t\u00e9rmicos. El cerebro habita aqu\u00ed.\n            <\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Card 2: ballistic -->\n        <div class=\"framed\" style=\"padding:32px;\">\n          <div class=\"marks\"><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; margin-bottom:24px;\">\n            <span class=\"tag\">R\u00c9GIMEN 02<\u002Fspan>\n            <span class=\"mono\" style=\"color:var(--gold); font-size:14px;\">\u03b1 \u2248 1<\u002Fspan>\n          <\u002Fdiv>\n          <svg viewBox=\"0 0 280 160\" style=\"width:100%; height:160px;\">\n            <g stroke=\"rgba(245,239,230,0.06)\"><line x1=\"0\" y1=\"140\" x2=\"280\" y2=\"140\"><\u002Fline><line x1=\"20\" y1=\"0\" x2=\"20\" y2=\"160\"><\u002Fline><\u002Fg>\n            <line x1=\"20\" y1=\"140\" x2=\"260\" y2=\"20\" stroke=\"var(--gold)\" stroke-width=\"2.5\"><\u002Fline>\n            <circle cx=\"260\" cy=\"20\" r=\"5\" fill=\"var(--gold)\"><\u002Fcircle>\n          <\u002Fsvg>\n          <div style=\"margin-top:24px;\">\n            <div style=\"font-size:24px; color:var(--ink); margin-bottom:6px;\">Bal\u00edstico<\u002Fdiv>\n            <div class=\"mono\" style=\"font-size:12px; color:var(--ink-3); letter-spacing:0.2em; text-transform:uppercase;\">Vuelo libre<\u002Fdiv>\n            <p class=\"body\" style=\"margin-top:16px; font-size:16px;\">La se\u00f1al viaja sin dispersi\u00f3n: luz en el vac\u00edo, canales ideales.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Card 3: diffusive -->\n        <div class=\"framed\" style=\"padding:32px;\">\n          <div class=\"marks\"><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; margin-bottom:24px;\">\n            <span class=\"tag\">R\u00c9GIMEN 03<\u002Fspan>\n            <span class=\"mono\" style=\"color:var(--gold); font-size:14px;\">\u03b1 \u2248 2<\u002Fspan>\n          <\u002Fdiv>\n          <svg viewBox=\"0 0 280 160\" style=\"width:100%; height:160px;\">\n            <g stroke=\"rgba(245,239,230,0.06)\"><line x1=\"0\" y1=\"140\" x2=\"280\" y2=\"140\"><\u002Fline><line x1=\"20\" y1=\"0\" x2=\"20\" y2=\"160\"><\u002Fline><\u002Fg>\n            <path d=\"M 20 140 Q 100 138 160 110 Q 220 70 260 14\" stroke=\"var(--gold)\" stroke-width=\"2.5\" fill=\"none\" opacity=\"0.85\"><\u002Fpath>\n            <circle cx=\"260\" cy=\"14\" r=\"5\" fill=\"var(--gold)\"><\u002Fcircle>\n          <\u002Fsvg>\n          <div style=\"margin-top:24px;\">\n            <div style=\"font-size:24px; color:var(--ink); margin-bottom:6px;\">Difusivo<\u002Fdiv>\n            <div class=\"mono\" style=\"font-size:12px; color:var(--ink-3); letter-spacing:0.2em; text-transform:uppercase;\">Caminata aleatoria<\u002Fdiv>\n            <p class=\"body\" style=\"margin-top:16px; font-size:16px;\">\n              Browniano, mezcla t\u00e9rmica. El comportamiento por defecto en materia no estructurada.\n            <\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Card 4: sub-diffusive -->\n        <div class=\"framed\" style=\"padding:32px;\">\n          <div class=\"marks\"><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; margin-bottom:24px;\">\n            <span class=\"tag\" style=\"color:var(--coral);\">R\u00c9GIMEN 04<\u002Fspan>\n            <span class=\"mono\" style=\"color:var(--coral); font-size:14px;\">\u03b1 &gt; 2<\u002Fspan>\n          <\u002Fdiv>\n          <svg viewBox=\"0 0 280 160\" style=\"width:100%; height:160px;\">\n            <g stroke=\"rgba(245,239,230,0.06)\"><line x1=\"0\" y1=\"140\" x2=\"280\" y2=\"140\"><\u002Fline><line x1=\"20\" y1=\"0\" x2=\"20\" y2=\"160\"><\u002Fline><\u002Fg>\n            <path d=\"M 20 140 C 60 138 130 130 200 100 C 240 80 255 50 260 8\" stroke=\"var(--coral)\" stroke-width=\"2.5\" fill=\"none\"><\u002Fpath>\n            <circle cx=\"260\" cy=\"8\" r=\"5\" fill=\"var(--coral)\"><\u002Fcircle>\n          <\u002Fsvg>\n          <div style=\"margin-top:24px;\">\n            <div style=\"font-size:24px; color:var(--ink); margin-bottom:6px;\">Subdifusivo<\u002Fdiv>\n            <div class=\"mono\" style=\"font-size:12px; color:var(--ink-3); letter-spacing:0.2em; text-transform:uppercase;\">Atrapado \u002F congestionado<\u002Fdiv>\n            <p class=\"body\" style=\"margin-top:16px; font-size:16px;\">\n              N\u00facleos de memoria, trampas, jerarqu\u00edas que ralentizan la integraci\u00f3n con el tama\u00f1o.\n            <\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"reveal-4\" style=\"margin-top:48px; padding-top:24px; border-top:1px solid var(--hairline); display:flex; justify-content:space-between; align-items:center;\">\n        <p class=\"body\" style=\"max-width:1200px; color:var(--ink); font-size:18px;\">\u03b1 no es entrop\u00eda, ni una constante, ni una met\u00e1fora. Es la pendiente operacional entre tiempo y tama\u00f1o, un solo n\u00famero que clasifica una clase de transporte.<\u002Fp>\n        <span class=\"mono\" style=\"font-size:12px; color:var(--ink-3); letter-spacing:0.2em;\">\u00a7 2.1 \u2014 \u03b1 OPERACIONAL<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"hud-bottom\"><span class=\"signal\">CLASIFICADOR<\u002Fspan><span>CUATRO CLASES DE TRANSPORTE<\u002Fspan><span>OPERACIONAL \u00b7 NO METAF\u00cdSICO<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- =============================================================\n       SLIDE 05 \u2014 THE LADDER (stacked layers)\n       ============================================================= -->\n  <section class=\"slide\" data-label=\"La escalera\">\n    <div class=\"hud-top\">\n      <div class=\"logo\">\n        <svg width=\"40\" height=\"40\" viewBox=\"0 0 40 40\" fill=\"none\">\n          <circle cx=\"20\" cy=\"20\" r=\"14\" stroke=\"currentColor\" stroke-width=\"1.2\"><\u002Fcircle>\n          <circle cx=\"20\" cy=\"20\" r=\"2.5\" fill=\"var(--gold)\"><\u002Fcircle>\n        <\u002Fsvg>\n        <span>RTM \u00b7 Cascade<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"nav\"><b>01<\u002Fb><b class=\"active\">02 \u00b7 La escalera<\u002Fb><b>03 \u00b7 Firmas<\u002Fb><b>04 \u00b7 Veredicto<\u002Fb><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hud-corners\"><span class=\"tl\"><\u002Fspan><span class=\"tr\"><\u002Fspan><span class=\"bl\"><\u002Fspan><span class=\"br\"><\u002Fspan><\u002Fdiv>\n\n    <div class=\"stage\">\n      <h3 class=\"eyebrow reveal\">\u002F 02\u00b7c \u00b7 CAPAS ANIDADAS<\u002Fh3>\n      <h2 class=\"title reveal-2\" style=\"margin-top:16px;\">Apila la ley. <em>Anida<\u002Fem> las escalas.<\u002Fh2>\n      <p class=\"lead reveal-3\" style=\"margin-top:24px; max-width:1100px;\">Un sistema se descompone en capas n = 1\u2026N&nbsp;Envolturas espaciales, m\u00f3dulos funcionales, etapas controladas. Cada capa tiene su propio \u03b1. La hip\u00f3tesis de cascada dice que se alinean.<\u002Fp>\n\n      <div style=\"margin-top:48px; display:grid; grid-template-columns: 1fr 520px; gap:80px; align-items:start;\">\n        <!-- LEFT: layer stack with click-to-light -->\n        <div class=\"reveal-4\" id=\"layer-stack\">\n          <div class=\"layer\" data-n=\"1\">\n            <div class=\"ix\">N1<\u002Fdiv>\n            <div><div class=\"name\">Microsc\u00f3pico \u002F sensorial<\u002Fdiv><div class=\"sub\">C\u00e9lulas primarias \u00b7 receptores \u00b7 tasa de entrada<\u002Fdiv><\u002Fdiv>\n            <div class=\"alpha-pill\" id=\"al-1\">\u03b1 \u2248 1.68<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"layer-arrow\">\u2193 TE(1\u21922)<\u002Fdiv>\n          <div class=\"layer\" data-n=\"2\">\n            <div class=\"ix\">N2<\u002Fdiv>\n            <div><div class=\"name\">Procesamiento local<\u002Fdiv><div class=\"sub\">Integraci\u00f3n de caracter\u00edsticas \u00b7 acoplamiento de corto alcance<\u002Fdiv><\u002Fdiv>\n            <div class=\"alpha-pill\" id=\"al-2\">\u03b1 \u2248 1.80<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"layer-arrow\">\u2193 TE(2\u21923)<\u002Fdiv>\n          <div class=\"layer\" data-n=\"3\">\n            <div class=\"ix\">N3<\u002Fdiv>\n            <div><div class=\"name\">Integraci\u00f3n regional<\u002Fdiv><div class=\"sub\">Bloqueo de fase \u00b7 recodificaci\u00f3n<\u002Fdiv><\u002Fdiv>\n            <div class=\"alpha-pill\" id=\"al-3\">\u03b1 \u2248 2.09<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"layer-arrow\">\u2193 TE(3\u21924)<\u002Fdiv>\n          <div class=\"layer\" data-n=\"4\">\n            <div class=\"ix\">N4<\u002Fdiv>\n            <div><div class=\"name\">Coherencia global<\u002Fdiv><div class=\"sub\">Cierre a nivel de sistema \u00b7 alineaci\u00f3n de retroalimentaci\u00f3n<\u002Fdiv><\u002Fdiv>\n            <div class=\"alpha-pill\" id=\"al-4\">\u03b1 \u2248 2.20<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- RIGHT: explainer + play button -->\n        <div style=\"position:sticky; top:0;\">\n          <div class=\"framed\" style=\"padding:32px;\">\n            <div class=\"marks\"><\u002Fdiv>\n            <span class=\"tag\" style=\"color:var(--gold);\">EJECUTAR CASCADA<\u002Fspan>\n            <p class=\"body\" style=\"margin-top:18px; color:var(--ink); font-size:18px;\">Cada pelda\u00f1o a\u00f1ade su propio \u03b1n. El acoplamiento hacia adelante transporta informaci\u00f3n hacia arriba, solo hacia arriba.<\u002Fp>\n            <button id=\"play-cascade\" class=\"btn-ghost\" style=\"margin-top:24px; width:100%; justify-content:center;\">\n              \u25ba PROPAGAR SE\u00d1AL\n            <\u002Fbutton>\n            <div class=\"hairline\"><\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:24px;\">\n              <div class=\"metric\">\n                <span class=\"val mono\"><em>\u039e\u2099<\u002Fem><\u002Fspan>\n                <span class=\"lbl\">FACTOR DE CAPA<br>(solo interceptos)<\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"metric\">\n                <span class=\"val mono\"><em>\u03b1<sub>n<\u002Fsub><\u002Fem><\u002Fspan>\n                <span class=\"lbl\">PENDIENTE<br>(registro de coherencia)<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:24px; padding:20px 24px; border-left:2px solid var(--gold); background:rgba(212,162,106,0.04);\">\n            <p class=\"body\" style=\"font-size:16px; color:var(--ink);\">\n              <b>Regla de dise\u00f1o.<\u002Fb> Dentro de cada capa, abarca <span class=\"mono\" style=\"color:var(--gold);\">L<\u002Fspan> en \u2265 6\u20138 tama\u00f1os, idealmente \u2265 1 d\u00e9cada. De lo contrario, la pendiente se difumina.\n            <\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"hud-bottom\"><span
